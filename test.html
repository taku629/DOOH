<body class="bg-surface text-on-surface font-body-md overflow-hidden">
<!-- Main Introduction Container -->
<main class="relative h-screen w-full flex flex-col justify-between overflow-hidden">
<!-- Hero Background Visual -->
<div class="absolute inset-0 z-0">
<img alt="Shinjuku at dusk" class="w-full h-full object-cover scale-110 blur-[2px]" data-alt="A cinematic, soft-focus landscape of Shinjuku's urban landscape during the golden hour dusk. The image captures the warm, amber glow of street lamps and neon signs reflecting against a soft, hazy sky. The lighting is ethereal and compassionate, emphasizing a gentle urban atmosphere with a palette of soft corals, warm whites, and deep grays. This high-quality photography evokes a sense of quiet connection and modern elegance within a bustling city environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD-rRgismU4Rl-umY8f5gf4jp3KfK1v2jMiucJUn_xnsDwmCPHBRn5FEGre3L54MyUy5L12BaaUgzaMMx-nP6dPUZ9hV_fFY5TMdCOLXeazH5644TQW-8dXAxEk4oXV-T4vK5Tcs10lHkF_BxuEbJFoXxSa6sL8wBYYBMKCwdQpM8_lMlYxuvZcwfXMRfw8yQJco8WehT4Vmxzu6xzdKg2IUdLR8bY3HLK255o5QI6wqOP8rkyC_fYvBJtLe-kGHvOii89ofAYaVPgs"/>
<div class="absolute inset-0 bg-gradient-to-b from-surface/20 via-surface/60 to-surface"></div>
<div class="absolute inset-0 glow-overlay"></div>
</div>
<!-- Top App Bar (Shared Component Style) -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-margin-mobile h-16 border-b border-secondary-container/30">
<span class="font-headline-md text-headline-md-mobile font-semibold text-primary">Shinjuku Care</span>
<button class="material-symbols-outlined text-primary active:scale-95 transition-transform">close</button>
</header>
<!-- Content Area -->
<div class="relative z-10 flex-1 flex flex-col items-center justify-center px-margin-mobile text-center pt-16">
<div class="fade-in space-y-stack-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface max-w-[12em]">
                    「あなたの一押しで、街が温かくなる。」
                </h1>
<p class="font-body-md text-body-md text-secondary opacity-80">
                    新宿エリア限定。所要10秒。
                </p>
</div>
</div>
<!-- Bottom Actions -->
<div class="relative z-10 px-margin-mobile pb-section-gap flex flex-col items-center space-y-stack-lg">
<!-- Primary Button -->
<button class="w-full max-w-sm py-4 bg-primary-container text-on-primary-container font-semibold rounded-full shadow-[0_8px_24px_rgba(242,139,130,0.25)] active:scale-95 transition-all duration-200" onclick="handleStart()">
                参加してみる
            </button>
<!-- Swipe Indicator (BottomNavBar Style Adaptation) -->
<div class="flex flex-col items-center justify-center gap-unit animate-bounce pt-stack-md">
<span class="material-symbols-outlined text-secondary/40">keyboard_arrow_up</span>
<span class="font-label-caps text-label-caps text-secondary/40">SWIPE UP</span>
</div>
</div>
</main>
<!-- Hidden Navigation Shell (Suppressed for Intro Screen per rules) -->
<script>
        function handleStart() {
            // Interactive micro-feedback
            const btn = event.currentTarget;
            btn.innerHTML = "ロード中...";
            btn.style.opacity = "0.7";
            
            // Atmospheric transition simulation
            document.body.style.transition = "background-color 1s ease";
            document.body.style.backgroundColor = "#e8ded3";
            
            setTimeout(() => {
                console.log("Navigating to onboarding flow...");
            }, 800);
        }

        // Parallax effect on mouse move or device tilt
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) / 50;
            const moveY = (e.clientY - window.innerHeight / 2) / 50;
            const hero = document.querySelector('img[data-alt*="Shinjuku"]');
            if(hero) {
                hero.style.transform = `scale(1.1) translate(${moveX}px, ${moveY}px)`;
            }
        });
    </script>
