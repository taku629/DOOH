<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0f10" />
    <title>新宿DOOH 撮影用Showcase</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b0d0e;
            --panel: #15191b;
            --line: rgba(255, 255, 255, 0.14);
            --muted: rgba(255, 255, 255, 0.64);
            --cyan: #63d7f4;
            --gold: #ffd166;
            --coral: #ff7180;
            --green: #78e0af;
        }

        * { box-sizing: border-box; }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 8% 0%, rgba(87, 143, 167, 0.12), transparent 31%),
                radial-gradient(circle at 92% 100%, rgba(255, 184, 91, 0.08), transparent 34%),
                var(--bg);
            color: #fff;
            font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
        }

        body {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            height: 100vh;
        }

        button,
        input,
        select {
            font: inherit;
        }

        .toolbar {
            position: relative;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 70px;
            padding: 10px 18px;
            border-bottom: 1px solid var(--line);
            background: rgba(11, 13, 14, 0.92);
            backdrop-filter: blur(20px);
            transition: transform 360ms ease, opacity 360ms ease;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 260px;
            margin-right: auto;
        }

        .brand-mark {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--cyan), var(--gold) 50%, var(--coral));
            box-shadow: 0 0 20px rgba(99, 215, 244, 0.6);
        }

        .brand strong {
            display: block;
            font-size: 0.96rem;
            letter-spacing: 0.06em;
        }

        .brand small {
            display: block;
            margin-top: 2px;
            color: var(--muted);
            font-size: 0.68rem;
        }

        .field {
            display: grid;
            gap: 4px;
        }

        .field span {
            color: var(--muted);
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .field input,
        .field select {
            height: 38px;
            border: 1px solid var(--line);
            border-radius: 11px;
            outline: 0;
            background: #202527;
            color: #fff;
        }

        .field input {
            width: 140px;
            padding: 0 12px;
        }

        .field select {
            min-width: 116px;
            padding: 0 10px;
        }

        .count-control {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 48px;
            padding: 0 13px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #171b1d;
        }

        .count-control span {
            color: var(--muted);
            font-size: 0.7rem;
        }

        .count-control strong {
            min-width: 64px;
            font-family: "EB Garamond", Georgia, serif;
            font-size: 1.6rem;
            line-height: 1;
            text-align: center;
        }

        .toolbar-button {
            min-height: 42px;
            padding: 0 15px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #23282a;
            color: #fff;
            font-size: 0.76rem;
            font-weight: 800;
            cursor: pointer;
        }

        .toolbar-button:hover {
            border-color: rgba(255, 255, 255, 0.42);
        }

        .toolbar-button.primary {
            border-color: rgba(120, 224, 175, 0.45);
            background: linear-gradient(135deg, #1d4939, #175164);
        }

        .workspace {
            position: relative;
            display: grid;
            grid-template-columns: minmax(390px, 0.34fr) minmax(0, 0.66fr);
            gap: 18px;
            min-height: 0;
            padding: 18px;
            transition: padding 360ms ease;
        }

        .panel {
            position: relative;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 28px;
            background: rgba(20, 24, 26, 0.9);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.3);
        }

        .frame-viewport {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        .phone-shell {
            position: absolute;
            top: 0;
            left: 0;
            width: 430px;
            height: 860px;
            overflow: hidden;
            border: 8px solid #050607;
            border-radius: 38px;
            background: #fff;
            box-shadow: 0 26px 80px rgba(0, 0, 0, 0.5);
            filter: grayscale(1) saturate(0.1) contrast(0.98);
            transform-origin: top left;
            transition: filter 1100ms cubic-bezier(0.2, 0.75, 0.25, 1);
        }

        .phone-shell.is-color {
            filter: grayscale(0) saturate(1) contrast(1);
        }

        .phone-shell::before {
            content: "";
            position: absolute;
            z-index: 8;
            top: 8px;
            left: 50%;
            width: 92px;
            height: 20px;
            border-radius: 999px;
            background: #050607;
            transform: translateX(-50%);
            pointer-events: none;
        }

        .phone-shell iframe {
            width: 100%;
            height: 100%;
            border: 0;
            background: #fff;
        }

        .phone-send-card {
            position: absolute;
            z-index: 10;
            left: 50%;
            bottom: 12%;
            min-width: 250px;
            padding: 22px 28px;
            border: 1px solid rgba(255, 255, 255, 0.82);
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.2),
                0 0 42px rgba(99, 215, 244, 0.28);
            color: #17191a;
            text-align: center;
            opacity: 0;
            transform: translate(-50%, 28px) scale(0.9);
            pointer-events: none;
        }

        .phone-send-card strong {
            display: block;
            font-size: 1.45rem;
            letter-spacing: 0.12em;
        }

        .phone-send-card span {
            display: block;
            margin-top: 5px;
            color: #5d6468;
            font-size: 0.66rem;
            font-weight: 700;
            letter-spacing: 0.14em;
        }

        .phone-send-card.is-sending {
            animation: phone-send 1500ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        @keyframes phone-send {
            0% { opacity: 0; transform: translate(-50%, 30px) scale(0.9); }
            22% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            68% { opacity: 1; transform: translate(-50%, -16px) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -230px) scale(0.78); }
        }

        .dooh-shell {
            position: absolute;
            top: 0;
            left: 0;
            width: 1280px;
            height: 720px;
            overflow: hidden;
            border-radius: 14px;
            background: #080909;
            box-shadow: 0 26px 80px rgba(0, 0, 0, 0.46);
            transform-origin: top left;
        }

        .dooh-shell iframe {
            width: 1280px;
            height: 720px;
            border: 0;
        }

        .tap-surface {
            position: absolute;
            z-index: 14;
            inset: 0;
            width: 100%;
            height: 100%;
            padding: 0;
            border: 0;
            border-radius: inherit;
            outline: 0;
            background: transparent;
            color: #fff;
            cursor: pointer;
            touch-action: manipulation;
        }

        .phone-tap-surface {
            position: absolute;
            z-index: 9;
            inset: 0;
            width: 100%;
            height: 100%;
            padding: 0;
            border: 0;
            border-radius: inherit;
            outline: 0;
            background: transparent;
            cursor: pointer;
            touch-action: manipulation;
        }

        .tap-hint {
            position: absolute;
            right: 26px;
            bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 46px;
            padding: 0 17px;
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 999px;
            background: rgba(7, 9, 10, 0.74);
            box-shadow: 0 16px 44px rgba(0, 0, 0, 0.24);
            font-size: 0.74rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            backdrop-filter: blur(16px);
            transition: opacity 300ms ease;
            pointer-events: none;
        }

        .tap-hint kbd {
            display: grid;
            place-items: center;
            width: 26px;
            height: 26px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.09);
            font-family: inherit;
        }

        .signal {
            position: absolute;
            z-index: 20;
            top: 50%;
            left: calc(34% - 1px);
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            background: #171a1c;
            color: var(--muted);
            font-size: 1.35rem;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .signal.is-active {
            color: #fff;
            border-color: rgba(120, 224, 175, 0.74);
            background: #1d3b31;
            box-shadow: 0 0 44px rgba(120, 224, 175, 0.38);
            animation: signal-pulse 1200ms ease both;
        }

        @keyframes signal-pulse {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.76); }
            35% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .status-toast {
            position: fixed;
            z-index: 50;
            left: 50%;
            bottom: 30px;
            max-width: min(680px, calc(100vw - 40px));
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 22px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            background: rgba(7, 9, 10, 0.82);
            box-shadow: 0 18px 54px rgba(0, 0, 0, 0.28);
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            opacity: 0;
            transform: translate(-50%, 10px);
            transition: opacity 260ms ease, transform 260ms ease;
            pointer-events: none;
            backdrop-filter: blur(18px);
        }

        .status-toast.is-visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        body.is-clean {
            grid-template-rows: minmax(0, 1fr);
        }

        body.is-clean .toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            opacity: 0;
            transform: translateY(-100%);
            pointer-events: none;
        }

        body.is-clean .workspace {
            height: 100vh;
            padding: 20px;
        }

        body.is-clean .tap-hint {
            opacity: 0;
        }

        @media (max-width: 1050px) {
            html,
            body { overflow: auto; }
            body { height: auto; min-height: 100vh; }
            .toolbar { flex-wrap: wrap; }
            .brand { flex: 1 1 100%; }
            .workspace {
                grid-template-columns: 1fr;
                grid-template-rows: 78vh minmax(420px, 56vw);
                min-height: 1280px;
            }
            .signal { display: none; }
        }
    </style>
</head>
<body>
    <header class="toolbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true"></span>
            <span>
                <strong>新宿DOOH 撮影用Showcase</strong>
                <small>本番DBへ書き込まない手動デモ</small>
            </span>
        </div>

        <label class="field">
            <span>次に表示する名前</span>
            <input id="nameInput" type="text" maxlength="24" value="あおい" autocomplete="off" />
        </label>

        <label class="field">
            <span>参加者タイプ</span>
            <select id="participantType">
                <option value="standard">通常参加者</option>
                <option value="supporter">クラファン支援者</option>
            </select>
        </label>

        <div class="count-control" aria-label="現在の人数">
            <span>現在</span>
            <strong id="countDisplay">14人</strong>
        </div>

        <button class="toolbar-button primary" id="sendButton" type="button">＋1人を送る</button>
        <button class="toolbar-button" id="cleanButton" type="button">撮影モード</button>
        <button class="toolbar-button" id="fullscreenButton" type="button">全画面</button>
        <button class="toolbar-button" id="resetButton" type="button">最初から</button>
    </header>

    <main class="workspace">
        <section class="panel phone-panel" aria-label="スマホ参加画面">
            <div class="frame-viewport" id="phoneViewport">
                <div class="phone-shell" id="phoneShell">
                    <iframe id="participantFrame" title="スマホ参加画面" allow="clipboard-write"></iframe>
                    <button class="phone-tap-surface" id="phoneTapSurface" type="button" aria-label="1人追加してDOOHへ名前を送る"></button>
                    <div class="phone-send-card" id="phoneSendCard" aria-hidden="true">
                        <strong id="phoneSendName">あおい</strong>
                        <span>TO SHINJUKU DOOH</span>
                    </div>
                </div>
            </div>
        </section>

        <div class="signal" id="signal" aria-hidden="true">→</div>

        <section class="panel dooh-panel" aria-label="DOOH画面">
            <div class="frame-viewport" id="doohViewport">
                <div class="dooh-shell" id="doohShell">
                    <iframe id="doohFrame" title="新宿DOOH画面"></iframe>
                </div>
            </div>
            <button class="tap-surface" id="tapSurface" type="button" aria-label="1人追加してDOOHへ名前を送る">
                <span class="tap-hint"><kbd>＋</kbd> 画面をタップして1人追加</span>
            </button>
        </section>
    </main>

    <div class="status-toast" id="statusToast" aria-live="polite"></div>

    <script>
        const params = new URLSearchParams(location.search);
        const DEFAULT_COUNT = Math.max(0, Number(params.get("count")) || 14);
        const AUTO_NAMES = [
            "あおい", "さくら", "ゆうと", "あかり", "ケンタ", "みなみ",
            "はる", "タクミ", "ひろと", "りん", "まこと", "ひなた",
        ];

        const participantFrame = document.getElementById("participantFrame");
        const doohFrame = document.getElementById("doohFrame");
        const phoneViewport = document.getElementById("phoneViewport");
        const doohViewport = document.getElementById("doohViewport");
        const phoneShell = document.getElementById("phoneShell");
        const doohShell = document.getElementById("doohShell");
        const phoneSendCard = document.getElementById("phoneSendCard");
        const phoneSendName = document.getElementById("phoneSendName");
        const nameInput = document.getElementById("nameInput");
        const participantType = document.getElementById("participantType");
        const countDisplay = document.getElementById("countDisplay");
        const sendButton = document.getElementById("sendButton");
        const tapSurface = document.getElementById("tapSurface");
        const phoneTapSurface = document.getElementById("phoneTapSurface");
        const signal = document.getElementById("signal");
        const statusToast = document.getElementById("statusToast");
        const cleanButton = document.getElementById("cleanButton");
        const fullscreenButton = document.getElementById("fullscreenButton");
        const resetButton = document.getElementById("resetButton");

        let currentCount = DEFAULT_COUNT;
        let nextNameIndex = 0;
        let isSending = false;
        let statusTimer = 0;
        let signalTimer = 0;
        let cardTimer = 0;
        let doohReadyTimer = 0;

        function resizeFrames() {
            const phoneScale = Math.min(
                (phoneViewport.clientWidth - 30) / 430,
                (phoneViewport.clientHeight - 30) / 860,
                1,
            );
            const safePhoneScale = Math.max(0.2, phoneScale);
            phoneShell.style.transform = `scale(${safePhoneScale})`;
            phoneShell.style.left = `${Math.max(0, (phoneViewport.clientWidth - 430 * safePhoneScale) / 2)}px`;
            phoneShell.style.top = `${Math.max(0, (phoneViewport.clientHeight - 860 * safePhoneScale) / 2)}px`;

            const doohScale = Math.min(
                (doohViewport.clientWidth - 30) / 1280,
                (doohViewport.clientHeight - 30) / 720,
                1,
            );
            const safeDoohScale = Math.max(0.2, doohScale);
            doohShell.style.transform = `scale(${safeDoohScale})`;
            doohShell.style.left = `${Math.max(0, (doohViewport.clientWidth - 1280 * safeDoohScale) / 2)}px`;
            doohShell.style.top = `${Math.max(0, (doohViewport.clientHeight - 720 * safeDoohScale) / 2)}px`;
        }

        function updateCount() {
            countDisplay.textContent = `${currentCount.toLocaleString("ja-JP")}人`;
        }

        function showStatus(message, duration = 2300) {
            window.clearTimeout(statusTimer);
            statusToast.textContent = message;
            statusToast.classList.add("is-visible");
            statusTimer = window.setTimeout(() => statusToast.classList.remove("is-visible"), duration);
        }

        function pulseSignal() {
            window.clearTimeout(signalTimer);
            signal.classList.remove("is-active");
            requestAnimationFrame(() => signal.classList.add("is-active"));
            signalTimer = window.setTimeout(() => signal.classList.remove("is-active"), 1500);
        }

        function animatePhoneName(displayName) {
            window.clearTimeout(cardTimer);
            phoneSendName.textContent = displayName;
            phoneSendCard.classList.remove("is-sending");
            void phoneSendCard.offsetWidth;
            phoneSendCard.classList.add("is-sending");
            cardTimer = window.setTimeout(() => phoneSendCard.classList.remove("is-sending"), 1600);
        }

        function getDoohApi() {
            return doohFrame.contentWindow?.__inkDemo || null;
        }

        function waitForDoohApi(timeout = 30000) {
            const startedAt = performance.now();
            window.clearTimeout(doohReadyTimer);
            return new Promise((resolve, reject) => {
                const poll = () => {
                    const api = getDoohApi();
                    if (api?.applyLiveCount && api?.showThanks) {
                        resolve(api);
                        return;
                    }
                    if (performance.now() - startedAt >= timeout) {
                        reject(new Error("DOOH APIの準備に時間がかかっています"));
                        return;
                    }
                    doohReadyTimer = window.setTimeout(poll, 180);
                };
                poll();
            });
        }

        function resolveDisplayName() {
            const typed = nameInput.value.trim().slice(0, 24);
            if (typed) return typed;
            return AUTO_NAMES[nextNameIndex % AUTO_NAMES.length];
        }

        function prepareNextName() {
            const currentAutoName = AUTO_NAMES[nextNameIndex % AUTO_NAMES.length];
            if (!nameInput.value.trim() || nameInput.value.trim() === currentAutoName) {
                nextNameIndex += 1;
                nameInput.value = AUTO_NAMES[nextNameIndex % AUTO_NAMES.length];
            }
        }

        async function sendParticipant() {
            if (isSending) return;
            isSending = true;
            sendButton.disabled = true;
            tapSurface.disabled = true;
            phoneTapSurface.disabled = true;

            const displayName = resolveDisplayName();
            const isSupporter = participantType.value === "supporter";
            const nextCount = currentCount + 1;
            const swipeEventId = `showcase-tap-${Date.now()}`;

            try {
                const api = await waitForDoohApi();
                phoneShell.classList.add("is-color");
                pulseSignal();
                animatePhoneName(displayName);
                showStatus(`${displayName}さんの彩りをDOOHへ送信中…`, 2500);

                api.applyLiveCount(Math.max(0, nextCount - 1));

                window.setTimeout(() => {
                    getDoohApi()?.applyLiveCount?.(nextCount);
                    currentCount = nextCount;
                    updateCount();
                }, 420);

                window.setTimeout(() => {
                    const latestApi = getDoohApi();
                    if (isSupporter) {
                        latestApi?.setSupporterComments?.([{
                            id: swipeEventId,
                            name: displayName,
                            comment: "新宿を応援しています",
                            swipeEventId,
                            swipeCount: nextCount,
                            createdAt: Date.now(),
                        }]);
                    }
                    latestApi?.showThanks?.(displayName, {
                        swipeEventId,
                        swipeCount: nextCount,
                        isSupporter,
                        isReturning: false,
                        streakDays: 1,
                        totalDays: 1,
                    });
                    showStatus(`${displayName}さんをDOOHへ反映しました`, 2700);
                    prepareNextName();
                }, 1050);

                window.setTimeout(() => {
                    isSending = false;
                    sendButton.disabled = false;
                    tapSurface.disabled = false;
                    phoneTapSurface.disabled = false;
                }, 1900);
            } catch (error) {
                console.error("[showcase-tap] send failed", error);
                showStatus("DOOHの準備中です。少し待ってもう一度タップしてください", 3200);
                isSending = false;
                sendButton.disabled = false;
                tapSurface.disabled = false;
                phoneTapSurface.disabled = false;
            }
        }

        function loadFrames() {
            const cacheBust = Date.now();
            const participantUrl = new URL("/web/participant-flow-shared.html", location.origin);
            participantUrl.searchParams.set("debug", "1");
            participantUrl.searchParams.set("exp", "all");
            participantUrl.searchParams.set("demo-showcase", "1");
            participantUrl.searchParams.set("t", cacheBust);
            participantFrame.src = participantUrl.href;

            const doohUrl = new URL("/demo_v2.html", location.origin);
            doohUrl.searchParams.set("dev", "1");
            doohUrl.searchParams.set("clean", "1");
            doohUrl.searchParams.set("manual", "1");
            doohUrl.searchParams.set("demo-showcase", "1");
            doohUrl.searchParams.set("t", cacheBust);
            doohFrame.src = doohUrl.href;
        }

        function resetShowcase() {
            currentCount = DEFAULT_COUNT;
            nextNameIndex = 0;
            nameInput.value = AUTO_NAMES[0];
            participantType.value = "standard";
            phoneShell.classList.remove("is-color");
            phoneSendCard.classList.remove("is-sending");
            signal.classList.remove("is-active");
            updateCount();
            loadFrames();
            showStatus(`${DEFAULT_COUNT}人から開始します`, 1800);
        }

        function toggleCleanMode() {
            document.body.classList.toggle("is-clean");
            cleanButton.textContent = document.body.classList.contains("is-clean")
                ? "設定を表示"
                : "撮影モード";
            window.setTimeout(resizeFrames, 420);
        }

        tapSurface.addEventListener("click", sendParticipant);
        phoneTapSurface.addEventListener("click", sendParticipant);
        sendButton.addEventListener("click", sendParticipant);
        cleanButton.addEventListener("click", toggleCleanMode);
        resetButton.addEventListener("click", resetShowcase);

        fullscreenButton.addEventListener("click", async () => {
            if (document.fullscreenElement) {
                await document.exitFullscreen();
            } else {
                await document.documentElement.requestFullscreen();
            }
        });

        document.addEventListener("fullscreenchange", () => {
            fullscreenButton.textContent = document.fullscreenElement ? "全画面を終了" : "全画面";
            window.setTimeout(resizeFrames, 100);
        });

        document.addEventListener("keydown", (event) => {
            if (event.target instanceof HTMLInputElement || event.target instanceof HTMLSelectElement) return;
            if (["Space", "Enter", "ArrowRight"].includes(event.code)) {
                event.preventDefault();
                sendParticipant();
            }
            if (event.code === "KeyC") toggleCleanMode();
        });

        window.addEventListener("message", (event) => {
            if (event.origin !== location.origin || event.source !== participantFrame.contentWindow) return;
            if (event.data?.type === "dooh-research-participation-complete") {
                sendParticipant();
            }
        });

        window.addEventListener("resize", resizeFrames);
        participantFrame.addEventListener("load", resizeFrames);
        doohFrame.addEventListener("load", async () => {
            resizeFrames();
            try {
                const api = await waitForDoohApi();
                api.applyLiveCount(currentCount);
                showStatus("準備完了。DOOH画面をタップしてください", 2600);
            } catch (error) {
                console.warn("[showcase-tap] initial DOOH setup delayed", error);
            }
        });

        if (params.has("clean")) {
            document.body.classList.add("is-clean");
            cleanButton.textContent = "設定を表示";
        }

        updateCount();
        loadFrames();
        resizeFrames();
    </script>
</body>
</html>
