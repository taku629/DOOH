<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Shinjuku DOOH — Color Pull Study</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      --charge: 0;
      --ink: #73d9e8;
      --paper: #151919;
      --return-red: #e45652;
      --return-orange: #efa548;
      --return-green: #82ad73;
      --return-blue: #5b8fb5;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      overscroll-behavior: none;
    }

    body {
      display: grid;
      min-height: 100svh;
      place-items: center;
      padding: 18px;
      overflow: hidden;
      background:
        linear-gradient(116deg, transparent 0 48%, rgba(130,173,115,.08) 48% 48.3%, transparent 48.3%),
        radial-gradient(circle at 10% 20%, rgba(228,86,82,.09) 0 7px, transparent 8px),
        radial-gradient(circle at 90% 62%, rgba(91,143,181,.09) 0 6px, transparent 7px),
        #f4f3ef;
      color: var(--paper);
    }

    button { font: inherit; }

    .phone {
      position: relative;
      width: min(100%, 430px);
      height: min(880px, calc(100svh - 36px));
      min-height: 650px;
      overflow: hidden;
      border: 1px solid rgba(21,25,25,.12);
      border-radius: clamp(28px, 8vw, 42px);
      background:
        radial-gradient(circle at 10% 69%, rgba(91,143,181,calc(.035 + var(--charge) * .13)), transparent 25%),
        radial-gradient(circle at 92% 74%, rgba(228,86,82,calc(.03 + var(--charge) * .12)), transparent 28%),
        linear-gradient(165deg, rgba(255,255,255,.98), #f8f6f1 72%);
      box-shadow: 0 35px 90px rgba(46,52,49,.16);
      isolation: isolate;
      filter: saturate(calc(.55 + var(--charge) * .45));
      transition: filter 700ms ease;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .noise {
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: .025;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
    }

    .content {
      display: grid;
      height: 100%;
      grid-template-rows: auto minmax(0, 1fr) 270px;
      gap: 18px;
      padding: 25px 22px max(20px, env(safe-area-inset-bottom));
    }

    .phone::before {
      position: absolute;
      z-index: 2;
      top: 0;
      bottom: 0;
      left: 0;
      width: 5px;
      content: "";
      background: linear-gradient(
        var(--return-red) 0 25%,
        var(--return-orange) 25% 50%,
        var(--return-green) 50% 75%,
        var(--return-blue) 75%
      );
      opacity: calc(.34 + var(--charge) * .66);
    }

    header {
      display: grid;
      gap: 16px;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      gap: 9px;
      align-items: center;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 18px;
      height: 18px;
      border: 1px solid rgba(21,25,25,.6);
      border-radius: 50%;
      background: conic-gradient(from 45deg, var(--return-red), var(--return-orange), var(--return-green), var(--return-blue), var(--return-red));
      box-shadow: 0 0 calc(18px * var(--charge)) rgba(115,217,232,.45);
    }

    .status {
      display: flex;
      gap: 7px;
      align-items: center;
      color: rgba(21,25,25,.52);
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--return-green);
      box-shadow: 0 0 calc(11px * var(--charge)) #8de89d;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: rgba(21,25,25,.45);
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 330px;
      margin: 0;
      font-size: clamp(24px, 7vw, 34px);
      font-weight: 560;
      letter-spacing: -.05em;
      line-height: 1.14;
    }

    .intro {
      max-width: 320px;
      margin: 9px 0 0;
      color: rgba(21,25,25,.58);
      font-size: 12px;
      line-height: 1.75;
    }

    .preview {
      position: relative;
      min-height: 245px;
      overflow: hidden;
      border: 1px solid rgba(21,25,25,.12);
      border-radius: 23px;
      background: #ebece8;
      box-shadow: inset 0 0 60px rgba(255,255,255,.4), 0 14px 35px rgba(46,52,49,.09);
    }

    .preview::after {
      position: absolute;
      inset: 0;
      content: "";
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,.04), transparent 35%, rgba(0,0,0,.28));
    }

    .preview-meta {
      position: absolute;
      z-index: 3;
      top: 15px;
      right: 16px;
      left: 16px;
      display: flex;
      justify-content: space-between;
      color: rgba(21,25,25,.52);
      font-size: 9px;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .city {
      position: absolute;
      inset: 0;
      filter: grayscale(calc(1 - var(--charge))) contrast(1.08);
    }

    .sky {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 68% 30%, rgba(255,202,91,calc(var(--charge) * .55)), transparent 25%),
        linear-gradient(145deg, #f1f2ef, #d8dad6 60%);
    }

    .building {
      position: absolute;
      bottom: 0;
      width: 31%;
      border: 1px solid rgba(21,25,25,.1);
      background: #c7cac6;
    }

    .building::before {
      position: absolute;
      inset: 10px;
      content: "";
      background:
        repeating-linear-gradient(90deg, transparent 0 13px, rgba(21,25,25,.09) 13px 18px),
        repeating-linear-gradient(0deg, transparent 0 13px, rgba(21,25,25,.09) 13px 18px);
    }

    .building:nth-child(2) { left: -4%; height: 63%; transform: skewY(-4deg); }
    .building:nth-child(3) { left: 30%; width: 41%; height: 83%; }
    .building:nth-child(4) { right: -5%; height: 55%; transform: skewY(5deg); }

    .screen {
      position: absolute;
      z-index: 2;
      top: 31%;
      left: 38%;
      display: grid;
      width: 26%;
      height: 31%;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(21,25,25,.18);
      background:
        radial-gradient(circle, rgba(255,255,255,.8), transparent 18%),
        conic-gradient(from 210deg, #5fd8e8, #f6d462, #ff806f, #a6e477, #5fd8e8);
      color: rgba(19,22,21,.76);
      font-size: 8px;
      font-weight: 850;
      letter-spacing: .16em;
      opacity: calc(.15 + var(--charge) * .85);
      filter: saturate(calc(.1 + var(--charge) * .9)) brightness(calc(.7 + var(--charge) * .45));
      box-shadow: 0 0 calc(34px * var(--charge)) rgba(115,217,232,.6);
      transform: perspective(300px) rotateY(-4deg);
    }

    .screen-flash { animation: screenFlash 1.15s cubic-bezier(.2,.8,.2,1); }

    .interaction {
      position: relative;
      min-height: 0;
      touch-action: none;
      user-select: none;
      cursor: grab;
    }

    .phone.is-pulling .interaction {
      cursor: grabbing;
    }

    .guide {
      position: absolute;
      top: 28px;
      right: 0;
      left: 0;
      text-align: center;
      pointer-events: none;
    }

    .guide strong {
      display: block;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -.02em;
    }

    .guide small {
      display: block;
      margin-top: 5px;
      color: rgba(21,25,25,.45);
      font-size: 10px;
      letter-spacing: .06em;
    }

    .trajectory {
      position: absolute;
      top: 70px;
      left: 50%;
      width: 2px;
      height: calc(65px + 90px * var(--charge));
      transform: translateX(-50%);
      transform-origin: top;
      background: linear-gradient(180deg, transparent, rgba(21,25,25,.28), var(--return-blue));
      box-shadow: 0 0 calc(15px * var(--charge)) rgba(91,143,181,.55);
      opacity: calc(.18 + var(--charge) * .82);
    }

    .trajectory::before,
    .trajectory::after {
      position: absolute;
      left: 50%;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      content: "";
      background: rgba(91,143,181,.78);
      box-shadow: 0 0 9px rgba(91,143,181,.5);
    }

    .trajectory::before { top: 30%; }
    .trajectory::after { top: 65%; }

    .elastic {
      position: absolute;
      top: 125px;
      left: 50%;
      width: min(74%, 270px);
      height: 78px;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .elastic::before,
    .elastic::after {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      border-bottom: 2px solid rgba(91,143,181,calc(.28 + var(--charge) * .6));
      content: "";
      filter: drop-shadow(0 0 calc(7px * var(--charge)) rgba(91,143,181,.5));
    }

    .elastic::before {
      left: 0;
      border-left: 2px solid rgba(91,143,181,.5);
      border-radius: 0 0 0 100%;
    }

    .elastic::after {
      right: 0;
      border-right: 2px solid rgba(228,86,82,.45);
      border-radius: 0 0 100% 0;
    }

    .orb {
      position: absolute;
      z-index: 5;
      top: 115px;
      left: 50%;
      display: grid;
      width: 112px;
      height: 72px;
      place-items: center;
      border: 1px solid rgba(21,25,25,.13);
      border-radius: 999px;
      background:
        radial-gradient(circle at 35% 22%, rgba(255,255,255,.98), transparent 13%),
        linear-gradient(135deg, #dadcd8, #f4f3ef 45%, #bfc3bf);
      box-shadow:
        0 8px 0 rgba(82,89,85,.16),
        0 18px 35px rgba(46,52,49,.18),
        0 0 calc(32px * var(--charge)) rgba(91,143,181,.4);
      cursor: grab;
      transform: translate(-50%, var(--pull, 0px)) scale(calc(1 + var(--charge) * .05));
      will-change: transform;
    }

    .orb::after {
      width: 48px;
      height: 7px;
      border-radius: 999px;
      content: "";
      background: rgba(21,25,25,.24);
      box-shadow: 0 0 12px rgba(255,255,255,.5);
    }

    .orb.dragging { cursor: grabbing; }

    .orb.ready {
      background:
        radial-gradient(circle at 35% 22%, #fff, transparent 13%),
        conic-gradient(from 210deg, #5fd8e8, #f6d462, #ff806f, #a6e477, #5fd8e8);
    }

    .orb.launching { animation: launch .82s cubic-bezier(.18,.78,.2,1) forwards; }

    .state-label {
      position: absolute;
      right: 0;
      bottom: 8px;
      left: 0;
      color: rgba(21,25,25,.4);
      font-size: 9px;
      letter-spacing: .17em;
      text-align: center;
      text-transform: uppercase;
    }

    .particle {
      position: absolute;
      z-index: 6;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      pointer-events: none;
      background: var(--particle-color);
      box-shadow: 0 0 12px var(--particle-color);
      animation: particleFly .82s cubic-bezier(.2,.75,.25,1) forwards;
    }

    .send-space {
      position: relative;
      min-height: 0;
    }

    .send-space > span {
      position: absolute;
      top: 4px;
      right: 0;
      left: 0;
      color: rgba(21,25,25,.5);
      font-size: 9px;
      letter-spacing: .09em;
      text-align: center;
    }

    .send-space > i {
      position: absolute;
      top: 30px;
      bottom: -105px;
      left: 50%;
      width: 1px;
      background: linear-gradient(180deg, rgba(91,143,181,.06), rgba(239,165,72,.36) 72%, rgba(228,86,82,.55));
      box-shadow: 0 0 calc(16px * var(--charge)) rgba(239,165,72,.55);
    }

    .guide {
      top: auto;
      bottom: 4px;
    }

    .interaction {
      min-height: 250px;
    }

    .trajectory {
      top: 0;
      height: calc(62px + 105px * var(--charge));
    }

    .elastic {
      top: 31px;
    }

    .orb {
      top: 57px;
      width: 160px;
      height: 68px;
      align-content: center;
      gap: 2px;
      color: #151919;
    }

    .orb::after {
      display: none;
    }

    .orb strong,
    .orb small {
      display: block;
      pointer-events: none;
    }

    .orb strong {
      font-size: 17px;
      font-weight: 520;
      letter-spacing: .08em;
    }

    .orb small {
      color: rgba(21,25,25,.52);
      font-size: 9px;
    }

    .state-label {
      display: none;
    }

    .elastic {
      top: 66px;
      z-index: 3;
      width: min(88%, 300px);
      height: calc(100px + var(--pull, 0px));
    }

    .elastic::before,
    .elastic::after {
      display: none;
    }

    .elastic svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .elastic path {
      fill: none;
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .elastic-limb-shadow {
      fill: rgba(54,61,58,.16) !important;
      stroke: none;
      filter: blur(2px);
      transform: translateY(3px);
    }

    .elastic-limb {
      fill: url(#studyLimbGradient) !important;
      stroke: rgba(255,255,255,.58);
      stroke-width: .8;
      opacity: calc(.72 + var(--charge) * .28);
      filter: drop-shadow(0 4px 5px rgba(47,55,51,.18));
    }

    .elastic-limb-highlight {
      fill: none;
      stroke: rgba(255,255,255,.66);
      stroke-width: 1.1;
      opacity: .72;
    }

    .elastic-arc {
      stroke-width: 1.25;
      opacity: calc(.62 + var(--charge) * .38);
    }

    .elastic-string {
      stroke-width: 1.35;
      opacity: calc(.42 + var(--charge) * .42);
    }

    .elastic-blue {
      stroke: var(--return-blue);
      fill: var(--return-blue);
    }

    .elastic-warm {
      stroke: #e98e58;
      fill: #e98e58;
    }

    .elastic circle.elastic-blue,
    .elastic circle.elastic-warm {
      stroke: rgba(255,255,255,.9);
      stroke-width: 2;
      paint-order: stroke fill;
      filter: drop-shadow(0 2px 3px rgba(47,55,51,.25));
    }

    .elastic-anchor-ring {
      fill: rgba(255,255,255,.92);
      stroke: rgba(71,80,76,.2);
      stroke-width: 1.2;
      vector-effect: non-scaling-stroke;
      filter: drop-shadow(0 2px 4px rgba(47,55,51,.24));
    }

    .elastic-knot-halo {
      fill: rgba(239,165,72,calc(.12 + var(--charge) * .3));
      filter: blur(3px);
    }

    .elastic-knot {
      fill: #fffaf0;
      stroke: #d79a58;
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
    }

    .orb {
      overflow: hidden;
      isolation: isolate;
      border: 1px solid rgba(255,255,255,.92);
      background:
        linear-gradient(135deg, rgba(255,255,255,.98), rgba(249,247,240,.9)),
        linear-gradient(90deg, rgba(91,143,181,.18), rgba(239,165,72,.18), rgba(228,86,82,.16));
      box-shadow:
        0 1px 0 rgba(255,255,255,.9) inset,
        0 -9px 18px rgba(91,104,98,.07) inset,
        0 8px 0 rgba(86,92,88,.12),
        0 18px 34px rgba(46,52,49,.15),
        0 0 calc(30px * var(--charge)) rgba(239,165,72,.35);
    }

    .orb::before {
      position: absolute;
      z-index: -1;
      inset: 3px;
      border: 1px solid rgba(91,143,181,.13);
      border-radius: inherit;
      content: "";
      pointer-events: none;
    }

    .study-flight {
      position: absolute;
      z-index: 2;
      bottom: -74px;
      left: 50%;
      width: 70px;
      height: 162px;
      transform: translateX(-50%);
    }

    .study-flight-glow {
      position: absolute;
      inset: -125px -55px -14px;
      background: linear-gradient(180deg, transparent, rgba(239,165,72,.05) 20%, rgba(239,165,72,calc(.1 + var(--charge) * .2)) 72%, rgba(228,86,82,calc(.12 + var(--charge) * .25)));
      clip-path: polygon(46% 0,54% 0,100% 100%,0 100%);
      filter: blur(5px);
    }

    .study-chevron {
      position: absolute;
      left: 50%;
      width: 16px;
      height: 16px;
      border-top: 3px solid rgba(255,255,255,.94);
      border-left: 3px solid rgba(255,255,255,.94);
      filter: drop-shadow(0 1px 3px rgba(225,128,70,.38));
      transform: translateX(-50%) rotate(45deg);
    }

    .study-chevron:nth-of-type(2) { top: 9px; }
    .study-chevron:nth-of-type(3) { top: 32px; }
    .study-chevron:nth-of-type(4) { top: 55px; }
    .study-chevron:nth-of-type(5) { top: 78px; }

    .study-arrowhead {
      position: absolute;
      bottom: 3px;
      left: 50%;
      width: 0;
      height: 0;
      border-right: 10px solid transparent;
      border-bottom: 25px solid var(--return-blue);
      border-left: 10px solid transparent;
      filter: drop-shadow(0 3px 4px rgba(47,55,51,.22));
      transform: translateX(-50%);
    }

    .study-coach {
      position: absolute;
      z-index: 4;
      right: 0;
      bottom: 116px;
      left: 0;
      display: grid;
      gap: 9px;
      color: #4b4138;
      text-align: center;
    }

    .study-coach strong {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: .04em;
    }

    .study-coach small {
      justify-self: center;
      padding: 7px 22px;
      border-radius: 999px;
      background: rgba(239,165,72,.1);
      color: rgba(75,65,56,.72);
      font-size: 10px;
    }

    .study-finger {
      position: absolute;
      z-index: 8;
      top: calc(104px + var(--pull, 0px));
      left: calc(50% + 20px);
      width: 34px;
      height: 56px;
      border: 3px solid rgba(255,255,255,.92);
      border-radius: 15px 15px 18px 18px;
      box-shadow: 0 3px 10px rgba(228,86,82,.28);
      transform: rotate(-18deg);
      opacity: calc(.78 - var(--charge) * .78);
      pointer-events: none;
    }

    .study-finger::before {
      position: absolute;
      top: -38px;
      left: 9px;
      width: 11px;
      height: 45px;
      border: 3px solid rgba(255,255,255,.94);
      border-radius: 999px 999px 7px 7px;
      background: rgba(255,255,255,.16);
      content: "";
    }

    .study-finger i {
      position: absolute;
      top: -50px;
      left: 3px;
      width: 25px;
      height: 25px;
      border: 2px solid rgba(239,165,72,.58);
      border-radius: 50%;
      box-shadow: 0 0 0 8px rgba(239,165,72,.08);
    }

    .study-effects {
      position: absolute;
      z-index: 1;
      right: 7%;
      bottom: -155px;
      left: 7%;
      height: 220px;
      pointer-events: none;
    }

    .study-ink-field {
      position: absolute;
      z-index: 4;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: calc(var(--charge) * .96);
      filter: blur(.15px) saturate(1.2);
      mix-blend-mode: normal;
      -webkit-mask-image: linear-gradient(to top, #000 16%, #000 84%, transparent 100%);
      mask-image: linear-gradient(to top, #000 16%, #000 84%, transparent 100%);
    }

    .phone.is-ready .study-ink-field {
      opacity: 1;
      filter: blur(.35px) saturate(1.45) drop-shadow(0 0 13px rgba(239,165,72,.4));
      mix-blend-mode: normal;
    }

    .study-effects::before,
    .study-effects::after {
      position: absolute;
      top: calc(104px + var(--pull, 0px));
      left: 50%;
      border: 2px solid rgba(239,165,72,calc(.34 + var(--charge) * .58));
      border-radius: 50%;
      content: "";
      transform: translate(-50%,-50%) scale(calc(.78 + var(--charge) * .35));
      box-shadow:
        0 0 calc(28px + 42px * var(--charge)) rgba(239,165,72,.34),
        0 0 calc(70px * var(--charge)) rgba(228,86,82,.3) inset,
        0 0 0 calc(10px + 18px * var(--charge)) rgba(255,218,153,.1);
    }

    .study-effects::before { width: 124px; height: 124px; }
    .study-effects::after {
      width: 88px;
      height: 88px;
      border-color: rgba(91,143,181,calc(.3 + var(--charge) * .56));
    }

    .study-effects b,
    .study-effects i {
      position: absolute;
      display: block;
      opacity: calc(.48 + var(--charge) * .52);
      animation: studyInkDrift 2.4s ease-in-out infinite alternate;
    }

    .study-effects b {
      width: calc(5px + var(--charge) * 6px);
      height: calc(5px + var(--charge) * 6px);
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 calc(8px + 10px * var(--charge)) currentColor;
    }

    .study-effects i {
      width: calc(9px + var(--charge) * 5px);
      height: calc(9px + var(--charge) * 5px);
      border: 1.5px solid currentColor;
      background: color-mix(in srgb, currentColor 18%, transparent);
      box-shadow: 0 0 calc(8px + 14px * var(--charge)) currentColor;
      transform: rotate(45deg);
    }

    .study-effects b:nth-child(n + 5),
    .study-effects i:nth-of-type(n + 5) {
      display: none;
    }

    .study-effects b:nth-child(1) { top: 54%; left: 12%; color: var(--return-blue); }

      const elasticKnotHalo = document.querySelector(".elastic-knot-halo");
      const inkCanvas = document.querySelector("#inkField");
      const inkContext = inkCanvas.getContext("2d");

      const maximumPull = 124;
      const readyDistance = 64;
      let pointerId = null;
      let startY = 0;

      let renderedPull = 0;
      let targetPull = 0;
      let animationFrame = 0;
      let isLaunching = false;
      const inkParticles = [];
      const inkColors = ["91,143,181", "130,173,115", "239,165,72", "228,86,82", "139,125,180"];
      let inkCharge = 0;
      let inkLastSpawn = 0;

      function resizeInkCanvas() {
        const rect = phone.getBoundingClientRect();
        const ratio = Math.min(2, window.devicePixelRatio || 1);
        inkCanvas.width = Math.max(1, Math.round(rect.width * ratio));
        inkCanvas.height = Math.max(1, Math.round(rect.height * ratio));
        inkCanvas.style.width = `${rect.width}px`;
        inkCanvas.style.height = `${rect.height}px`;
        inkContext.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function addInkParticle(burst = false) {
        const phoneRect = phone.getBoundingClientRect();
        const orbRect = orb.getBoundingClientRect();
        const originX = orbRect.left - phoneRect.left + orbRect.width / 2;
        const originY = orbRect.top - phoneRect.top + orbRect.height / 2;
        const angle = Math.random() * Math.PI * 2;
        const radius = 18 + Math.random() * (burst ? 88 : 56);
        inkParticles.push({
          x: originX + Math.cos(angle) * radius,
          y: originY + Math.sin(angle) * radius * .55,
          vx: Math.cos(angle) * (burst ? 2.8 : .35),
          vy: burst ? -3.5 - Math.random() * 5 : -.35 - inkCharge * 1.4,
          life: 1,
          decay: burst ? .03 + Math.random() * .022 : .018 + Math.random() * .012,
          size: 2.2 + Math.random() * (2.2 + inkCharge * 2.4),
          color: inkColors[Math.floor(Math.random() * inkColors.length)],
          phase: Math.random() * Math.PI * 2,
        });
      }

      function drawInkField(time) {
        const rect = phone.getBoundingClientRect();
        inkContext.clearRect(0, 0, rect.width, rect.height);
        inkContext.globalCompositeOperation = "lighter";
        if (inkCharge > .08 && time - inkLastSpawn > 105 - inkCharge * 42) {
          addInkParticle();
          if (inkParticles.length > 22) inkParticles.splice(0, inkParticles.length - 22);
          inkLastSpawn = time;
        }
        inkParticles.forEach((particle) => {
          particle.phase += .045 + inkCharge * .06;
          particle.vx += Math.sin(particle.phase) * .018;
          particle.vy -= .006 + inkCharge * .018;
          particle.x += particle.vx;
          particle.y += particle.vy;
          particle.life -= particle.decay;
          const alpha = Math.max(0, particle.life) * (.1 + inkCharge * .28);
          const tail = 14 + inkCharge * 22;
          const gradient = inkContext.createLinearGradient(particle.x, particle.y + tail, particle.x, particle.y - tail);
          gradient.addColorStop(0, `rgba(${particle.color},0)`);
          gradient.addColorStop(1, `rgba(${particle.color},${alpha})`);
          inkContext.strokeStyle = gradient;
          inkContext.lineWidth = particle.size;
          inkContext.beginPath();
          inkContext.moveTo(particle.x - particle.vx * 3, particle.y - particle.vy * 5 + tail);
          inkContext.quadraticCurveTo(particle.x + Math.sin(particle.phase) * 7, particle.y + tail * .25, particle.x, particle.y - tail);
          inkContext.stroke();
        });
        for (let index = inkParticles.length - 1; index >= 0; index -= 1) {
          if (inkParticles[index].life <= 0 || inkParticles[index].y < -40) inkParticles.splice(index, 1);
        }
        requestAnimationFrame(drawInkField);
      }

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
      const easeOutCubic = value => 1 - Math.pow(1 - value, 3);

      function setCopy(progress, ready = false) {
        if (ready) {
          instruction.textContent = "\u96e2\u3057\u3066\u3001DOOH\u3078\u9001\u308b";
          subInstruction.textContent = "\u6307\u3092\u96e2\u3059\u3068\u767a\u5c04\u3057\u307e\u3059";
          stateLabel.textContent = "Ready - release";
        } else if (progress > .08) {
          instruction.textContent = "\u305d\u306e\u307e\u307e\u4e0b\u3078";
          subInstruction.textContent = "\u5f69\u304c\u305f\u307e\u3063\u3066\u3044\u307e\u3059";
          stateLabel.textContent = `Charging - ${Math.round(progress * 100)}%`;
        } else {
          instruction.textContent = "\u4e0b\u3078\u5f15\u3044\u3066\u3001\u96e2\u3059";
          subInstruction.textContent = "\u540d\u524d\u304c\u65b0\u5bbfDOOH\u3078\u5c4a\u304d\u307e\u3059";
          stateLabel.textContent = "Stand by - 0%";
        }
      }

      function render() {
        renderedPull += (targetPull - renderedPull) * (pointerId === null ? .17 : .32);
        if (Math.abs(targetPull - renderedPull) < .08) renderedPull = targetPull;

        const progress = clamp(renderedPull / readyDistance, 0, 1);
        phone.style.setProperty("--charge", easeOutCubic(progress).toFixed(3));
        inkCharge = easeOutCubic(progress);
        orb.style.setProperty("--pull", `${renderedPull.toFixed(2)}px`);
        interaction.style.setProperty("--pull", `${renderedPull.toFixed(2)}px`);
        const bowKnotY = 68 + renderedPull;
        elasticSvg?.setAttribute("viewBox", `0 0 300 ${100 + renderedPull}`);
        elasticLeftString?.setAttribute("d", `M9 57 L150 ${bowKnotY}`);
        elasticRightString?.setAttribute("d", `M291 57 L150 ${bowKnotY}`);
        elasticKnot?.setAttribute("cy", String(bowKnotY));
        elasticKnotHalo?.setAttribute("cy", String(bowKnotY));
        animationFrame = requestAnimationFrame(render);
      }

      function startDrag(event) {
        if (isLaunching || pointerId !== null) return;
        if (event.pointerType === "mouse" && event.button !== 0) return;
        event.preventDefault();
        pointerId = event.pointerId;
        startY = event.clientY;
        pullDistance = 0;
        orb.classList.add("dragging");
        phone.classList.add("is-pulling");
        interaction.setPointerCapture?.(pointerId);
      }

      function moveDrag(event) {
        if (event.pointerId !== pointerId || isLaunching) return;
        event.preventDefault();
        const rawDistance = Math.max(0, event.clientY - startY);
        pullDistance = maximumPull * (1 - Math.exp(-rawDistance / 120));
        targetPull = pullDistance;
        const progress = clamp(pullDistance / readyDistance, 0, 1);
        const ready = pullDistance >= readyDistance;
        orb.classList.toggle("ready", ready);
        phone.classList.toggle("is-ready", ready);
        setCopy(progress, ready);
        if (ready && !orb.dataset.readyBuzzed) {
          navigator.vibrate?.(18);
          orb.dataset.readyBuzzed = "true";
        }
        if (!ready) delete orb.dataset.readyBuzzed;
      }

      function endDrag(event) {
        if (event.pointerId !== pointerId || isLaunching) return;
        interaction.releasePointerCapture?.(pointerId);
        pointerId = null;
        orb.classList.remove("dragging");
        phone.classList.remove("is-pulling");
        if (pullDistance >= readyDistance) {
          launchColor();
        } else {
          targetPull = 0;
          orb.classList.remove("ready");
          phone.classList.remove("is-ready");
          setCopy(0);
        }
      }

      function createParticles() {
        const interactionRect = interaction.getBoundingClientRect();
        const orbRect = orb.getBoundingClientRect();
        const colors = ["#73d9e8", "#ff8468", "#f4c75e", "#a6e477"];
        for (let index = 0; index < 18; index += 1) {
          const particle = document.createElement("i");
          const angle = Math.random() * Math.PI * 2;
          const spread = 35 + Math.random() * 70;
          particle.className = "particle";
          particle.style.left = `${orbRect.left - interactionRect.left + orbRect.width / 2}px`;
          particle.style.top = `${orbRect.top - interactionRect.top + orbRect.height / 2}px`;
          particle.style.setProperty("--particle-color", colors[index % colors.length]);
          particle.style.setProperty("--dx", `${Math.cos(angle) * spread}px`);
          particle.style.setProperty("--dy", `${-150 - Math.random() * 170 + Math.sin(angle) * spread}px`);
          interaction.append(particle);
          particle.addEventListener("animationend", () => particle.remove(), { once: true });
        }
      }

      function launchColor() {
        isLaunching = true;
        orb.classList.add("launching");
        phone.classList.remove("is-pulling");
        createParticles();
        for (let index = 0; index < 12; index += 1) addInkParticle(true);
        navigator.vibrate?.([24, 32, 42]);
        instruction.textContent = "\u540d\u524d\u3092\u9001\u308a\u307e\u3057\u305f";
        subInstruction.textContent = "\u65b0\u5bbfDOOH\u306b\u307e\u3082\u306a\u304f\u53cd\u6620\u3055\u308c\u307e\u3059";
        stateLabel.textContent = "Live sync · complete";

        window.setTimeout(() => screen?.classList.add("screen-flash"), 330);
        window.setTimeout(() => {
          screen?.classList.remove("screen-flash");
          orb.classList.remove("launching", "ready");
          phone.classList.remove("is-ready");
          targetPull = 0;
          renderedPull = 0;
          pullDistance = 0;
          orb.style.opacity = "1";
          isLaunching = false;
        }, 1200);
        window.setTimeout(() => setCopy(0), 2450);
      }

      interaction.addEventListener("pointerdown", startDrag);
      interaction.addEventListener("pointermove", moveDrag, { passive: false });
      interaction.addEventListener("pointerup", endDrag);
      interaction.addEventListener("pointercancel", endDrag);
      render();
      resizeInkCanvas();
      window.addEventListener("resize", resizeInkCanvas);
      requestAnimationFrame(drawInkField);

      window.addEventListener("pagehide", () => cancelAnimationFrame(animationFrame), { once: true });
    })();
  </script>
</body>
</html>
