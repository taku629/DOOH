<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>新宿DOOH — City Color Restore Study</title>
  <style>
    html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#f8f8f5}
    iframe{display:block}
  </style>
</head>
<body>
  <iframe id="study" src="dooh-bow-city-light-study.html" title="新宿DOOH City Color Restore Study"></iframe>
  <script>
    const frame = document.querySelector("#study");

    const applyCityRestore = () => {
      const doc = frame.contentDocument;
      if (!doc || doc.querySelector("#city-restore-override")) return;
      doc.title = "新宿DOOH — City Color Restore Study";

      const style = doc.createElement("style");
      style.id = "city-restore-override";
      style.textContent = `
        /* 建物は最初から形が読める、濃いモノクロ */
        .city-canyon {
          opacity: calc(.42 + var(--c) * .28);
          mask-image: linear-gradient(
            to bottom,
            transparent 0,
            #000 15%,
            #000 90%,
            transparent 100%
          );
        }

        /* 引くほど、加工色ではなくBlender画像本来の色へ戻す */
        .city-canyon img {
          filter:
            grayscale(calc(1 - var(--c)))
            contrast(calc(1.28 + var(--c) * .1))
            brightness(calc(1.16 - var(--c) * .06))
            saturate(calc(.15 + var(--c) * 1.45));
          transform: scale(1.035);
          transition: filter .16s linear;
        }

        /* 中央の白い霞を弱め、コクーンタワーの外形を残す */
        .city-canyon::after {
          opacity: calc(.36 - var(--c) * .22);
          background:
            linear-gradient(
              90deg,
              rgba(251,251,249,.12),
              transparent 18% 82%,
              rgba(251,251,249,.12)
            ),
            radial-gradient(
              ellipse at 50% 47%,
              rgba(251,251,249,.36),
              transparent 22%
            );
        }

        /* 色ベタではなく、本来色の復元を補助する弱い反射光だけにする */
        .color-return {
          height: calc(var(--c) * 70%);
          opacity: calc(var(--c) * .18);
          background:
            radial-gradient(ellipse at 18% 82%, rgba(var(--blue),.3), transparent 43%),
            radial-gradient(ellipse at 82% 78%, rgba(var(--gold),.3), transparent 42%);
          mix-blend-mode: screen;
        }

        .light-cone {
          opacity: calc(.025 + var(--c) * .86);
          filter:
            saturate(calc(.2 + var(--c) * 1.3))
            brightness(calc(.88 + var(--c) * .34));
        }

        .phone.ready .city-canyon {
          opacity: .74;
        }
        .phone.ready .city-canyon img {
          filter: grayscale(0) contrast(1.4) brightness(1.08) saturate(1.65);
        }
      `;
      doc.head.appendChild(style);
    };

    frame.addEventListener("load", applyCityRestore);
    if (frame.contentDocument?.readyState === "complete") applyCityRestore();
  </script>
</body>
</html>
