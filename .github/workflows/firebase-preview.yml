name: Firebase Hosting PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: firebase-hosting-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy PR preview channel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root deps
        run: npm ci

      - name: Build admin bundle
        run: npm run build:admin

      - name: Deploy preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOOH_CA9C2 }}
          projectId: dooh-ca9c2
          expires: 7d
