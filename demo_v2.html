            });
            toolsPanel.appendChild(hideDevUiBtn);

            if (params.has("clean") || params.has("hide-tools")) {
                setDevUiHidden(true);
            }
        }
        const stage = document.getElementById("stage");
        const countNum = document.getElementById("countNum");
        const progressText = document.getElementById("progressText");
        const progressBar = document.getElementById("progressBar");
        const challengeLabel = document.getElementById("challengeLabel");
        const transitionCountdown = document.getElementById("transitionCountdown");
        const hint = document.getElementById("hint");
        const participationThanks = document.getElementById("participationThanks");
        const liveLabel = document.querySelector(".live > .label");
        const liveUnit = document.querySelector(".live > .value .unit");
        const baseVideo = document.querySelector(".base-video");
        if (baseVideo) {
            baseVideo.src = MOBILE_VIDEO_MODE
                ? baseVideo.dataset.srcMobile
                : baseVideo.dataset.srcDesktop;
            baseVideo.load();
        }
        const ctaCopy = document.querySelector(".cta-copy");
        const ctaTitle = document.querySelector(".cta-copy strong");
        const qrCaption = document.getElementById("qrCaption");
        const addBtn = document.getElementById("addBtn");
        const autoBtn = document.getElementById("autoBtn");
        const resetBtn = document.getElementById("resetBtn");
        const completeBtn = document.getElementById("completeBtn");
        const skipSceneBtn = document.getElementById("skipSceneBtn");
        const newParticipantTestBtn = document.getElementById("newParticipantTestBtn");
        const returningParticipantTestBtn = document.getElementById("returningParticipantTestBtn");
        const linkedNameTestBtn = document.getElementById("linkedNameTestBtn");
        const crowdTestBtn = document.getElementById("crowdTestBtn");
        const resetCheckBtn = document.getElementById("resetCheckBtn");
        const emergencyStopBtn = document.getElementById("emergencyStopBtn");
        const urlNote = document.getElementById("urlNote");

        urlNote?.classList.toggle("is-dev-visible", DEV);
        newParticipantTestBtn.hidden = !CONTROL_TOOLS_MODE;
        returningParticipantTestBtn.hidden = !CONTROL_TOOLS_MODE;
        linkedNameTestBtn.hidden = !CONTROL_TOOLS_MODE;
        crowdTestBtn.hidden = !CONTROL_TOOLS_MODE;
        resetCheckBtn.hidden = !CONTROL_TOOLS_MODE;
        emergencyStopBtn.hidden = !CONTROL_TOOLS_MODE;
        if (CONTROL_TOOLS_MODE) {
            completeBtn.hidden = false;
            skipSceneBtn.hidden = false;
        }

        // 飛沫レイヤーを生成（黒地は screen 合成で透過 → 明部だけ累積）
        // 偶数index=芯(XX-core.jpg)、奇数index=完成形(XX.jpg)。完成形が出たら芯は差し替えて消す
        const layers = [];
        for (let i = 1; i <= TOTAL / 2; i++) {
            for (const variant of ["-core", ""]) {
                const img = document.createElement("img");
                img.className = "ink-layer";
                img.alt = "";
                img.decoding = "async";
                img.dataset.shape = String(i - 1);          // 形の番号 0..8
                img.dataset.core = variant === "-core" ? "1" : "";
                stage.appendChild(img);
                layers.push(img);
            }
        }

        // 全飛沫が出揃った最後に重ねる仕上げの一枚
        const finalLayer = document.createElement("img");
        finalLayer.className = "ink-layer final-layer";
        finalLayer.src = "assets/ink/Shinjuku_11.png";
        finalLayer.alt = "";
        finalLayer.decoding = "async";
        stage.appendChild(finalLayer);

        const warmLayer = document.createElement("video");
        warmLayer.className = "ink-layer warm-layer";
        warmLayer.src = MOBILE_VIDEO_MODE
            ? "assets/video/clean-shinjuku-mobile.mp4"
            : "assets/video/clean-shinjuku.mp4";
        warmLayer.muted = true;
        warmLayer.loop = false;
        warmLayer.playsInline = true;
        warmLayer.preload = "auto";
        warmLayer.setAttribute("aria-hidden", "true");
        stage.appendChild(warmLayer);

        const idleLayer = document.createElement("video");
        idleLayer.className = "idle-layer";
        idleLayer.src = "assets/video/yellow-idle.mp4";
        idleLayer.muted = true;
        idleLayer.loop = false;
        idleLayer.playsInline = true;
        idleLayer.preload = "auto";
        idleLayer.setAttribute("aria-hidden", "true");
        stage.appendChild(idleLayer);

        // ============================================================
        // 実行時配置エンジン
        //   飛沫の形は shape-NN.png（切断辺を修復済みの透過PNG）。位置と大きさは毎回JSで決める。
        //   窓の中身は「動いている clean 映像」を mask で覗かせる。
        // ============================================================
        // 着弾の見せ方（?impact= で切替。DEVパネルの 白/映像 でも切替可）。
        // 窓のマスク（revealVideo側）は一切動かさず、上に重ねる層と小滴だけを
        // transform/opacity で動かす＝窓の中の映像は乱れない。
        // window: 窓のカラー映像そのものが飛沫形で弾けて着地する（既定）
        // white : 白いインクが弾ける
        // burst : 旧既定。窓のマスク自体が跳ねる（映像が歪む・比較用）
        // plate : 回復後の静止画が一瞬出る（旧実装・比較用）
        const IMPACT_STYLES = ["white", "window", "burst", "plate"];
        let IMPACT_STYLE = (() => {
            const v = new URLSearchParams(location.search).get("impact");
            return IMPACT_STYLES.includes(v) ? v : "window";
        })();

        // 着弾スタイルの試し切替（墨/白/映像）。選んだものは ?impact= にも同期する
        const impactStyleBtns = [...document.querySelectorAll(".impact-style-btn")];
        impactStyleBtns.forEach((b) => {
            b.hidden = !CONTROL_TOOLS_MODE;
            b.classList.toggle("is-on", b.dataset.impact === IMPACT_STYLE);
            b.addEventListener("click", (e) => {
                e.stopPropagation();
                IMPACT_STYLE = b.dataset.impact;
                impactStyleBtns.forEach((x) => x.classList.toggle("is-on", x.dataset.impact === IMPACT_STYLE));
                const u = new URL(location.href);
                u.searchParams.set("impact", IMPACT_STYLE);
                history.replaceState(null, "", u);
            });
        });
        const BURST_MS = { core: 420, full: 620 };
        const TARGET_NEW = 0.045;   // 1人ぶん(芯+完成形)で新しく開く面積 / 画面比
        const MIN_DIST = 240;       // 狙い同士の最小距離(フレームpx)
        const SOLVE_W = 240, SOLVE_H = 135;

        const revealVideo = document.createElement("video");
        revealVideo.className = "reveal-video";
        revealVideo.src = warmLayer.src;
        revealVideo.muted = true;
        revealVideo.loop = true;
        revealVideo.playsInline = true;
        revealVideo.preload = "auto";
        revealVideo.setAttribute("aria-hidden", "true");
        stage.insertBefore(revealVideo, warmLayer);
        revealVideo.play().catch(() => {});


        // 映像内の電子広告板（回復後フレームで実測した四隅・フレーム座標1920x1080）
        const BILLBOARD_QUAD = [[1000, 0], [1560, 0], [1555, 235], [1005, 103]];
        const BB_W = 600, BB_H = 190;   // 板のデザイン座標系（この矩形を四隅へ写す）

        // 4点対応から射影変換を解く（8元1次連立をガウス消去）
        function solveHomography(src, dst) {
            const A = [], b = [];
            for (let i = 0; i < 4; i++) {
                const [x, y] = src[i], [u, v] = dst[i];
                A.push([x, y, 1, 0, 0, 0, -x * u, -y * u]); b.push(u);
                A.push([0, 0, 0, x, y, 1, -x * v, -y * v]); b.push(v);
            }
            for (let i = 0; i < 8; i++) {
                let p = i;
                for (let r = i + 1; r < 8; r++) if (Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r;
                [A[i], A[p]] = [A[p], A[i]]; [b[i], b[p]] = [b[p], b[i]];
                for (let r = 0; r < 8; r++) {
                    if (r === i || A[r][i] === 0) continue;
                    const f = A[r][i] / A[i][i];
                    for (let c = i; c < 8; c++) A[r][c] -= f * A[i][c];
                    b[r] -= f * b[i];
                }
            }
            return b.map((v, i) => v / A[i][i]);   // [a,b,c,d,e,f,g,h]
        }

        function billboardMatrix() {
            const [kx, ky] = frameScale();
            const dst = BILLBOARD_QUAD.map(([x, y]) => [x * kx, y * ky]);
            const src = [[0, 0], [BB_W, 0], [BB_W, BB_H], [0, BB_H]];
            const [a, b2, c, d, e, f, g, h] = solveHomography(src, dst);
            return `matrix3d(${a},${d},0,${g}, ${b2},${e},0,${h}, 0,0,1,0, ${c},${f},0,1)`;
        }

        const billboard = document.createElement("div");
        billboard.className = "billboard";
        billboard.style.width = `${BB_W}px`;
        billboard.style.height = `${BB_H}px`;
        billboard.setAttribute("aria-hidden", "true");
        const billboardText = document.createElement("span");
        billboardText.className = "billboard-text";
        const billboardKicker = document.createElement("span");
        billboardKicker.className = "billboard-kicker";
        billboardKicker.textContent = "S U P P O R T E R";
        billboard.append(billboardText, billboardKicker);
        stage.appendChild(billboard);

        let layout = null;
        let shapeImgs = [];      // [i] = {full: Image, core: Image}
        let placements = [];     // [layerIndex] = {url, x, y, w, h, ox, oy}

        const loadImage = (src) =>
            new Promise((res, rej) => {
                const im = new Image();
                im.onload = () => res(im);
                im.onerror = rej;
                im.src = src;
            });

        function weightedPick(map, count, minDist, FW, FH, GX, GY) {
            const cells = [];
            for (let gy = 0; gy < GY; gy++)
                for (let gx = 0; gx < GX; gx++)
                    if (map[gy][gx] > 0.01) cells.push({ gx, gy, w: map[gy][gx] });
            const chosen = [];
            let guard = 0;
            while (chosen.length < count && guard++ < 800) {
                const total = cells.reduce((a, c) => a + c.w, 0);
                if (total <= 0) break;
                let r = Math.random() * total;
                let cell = cells[0];
                for (const c of cells) { r -= c.w; if (r <= 0) { cell = c; break; } }
                const x = (cell.gx + Math.random()) * (FW / GX);
                const y = (cell.gy + Math.random()) * (FH / GY);
                if (chosen.every((c) => Math.hypot(c.x - x, c.y - y) >= minDist)) chosen.push({ x, y });
            }
            // 距離条件で埋まらなければ緩めて補充
            while (chosen.length < count && cells.length) {
                const c = cells[Math.floor(Math.random() * cells.length)];
                chosen.push({ x: (c.gx + 0.5) * (FW / GX), y: (c.gy + 0.5) * (FH / GY) });
            }
            return chosen;
        }

        function planRound() {
            if (!layout) return;
            const [FW, FH] = layout.frame;
            const [GX, GY] = layout.grid;
            const people = weightedPick(layout.peopleMap, 6, MIN_DIST, FW, FH, GX, GY);
            const vines = weightedPick(layout.vineMap, 3, MIN_DIST, FW, FH, GX, GY);

            // 直前に開いた窓からいちばん遠い的を次に選ぶ。
            // 連続スワイプでも窓と名前が画面の反対側に出るので、名前が重なりにくい。
            const pool = [
                ...people.map((t) => ({ ...t, lift: 0.3, kind: "people" })),
                ...vines.map((t) => ({ ...t, lift: 0, kind: "scar" })),
            ];
            const targets = [pool.splice(Math.floor(Math.random() * pool.length), 1)[0]];
            while (pool.length) {
                const prev = targets[targets.length - 1];
                let bi = 0, bd = -1;
                pool.forEach((t, i) => {
                    const d = Math.hypot(t.x - prev.x, t.y - prev.y);
                    if (d > bd) { bd = d; bi = i; }
                });
                targets.push(pool.splice(bi, 1)[0]);
            }
            const order = [...layout.shapes.keys()].sort(() => Math.random() - 0.5);

            // 既に開いた窓を差し引いた正味の新規面積が一定になるよう scale を二分探索
            const cv = document.createElement("canvas");
            cv.width = SOLVE_W; cv.height = SOLVE_H;
            const ctx = cv.getContext("2d", { willReadFrequently: true });
            const sx = SOLVE_W / FW, sy = SOLVE_H / FH;
            const acc = new Uint8Array(SOLVE_W * SOLVE_H);
            const targetPx = TARGET_NEW * SOLVE_W * SOLVE_H;

            const rect = (shape, t, s) => ({
                w: shape.w * s, h: shape.h * s,
                x: t.x - shape.cx * s,
                y: t.y - shape.cy * s - shape.h * s * t.lift,
            });
            const newPixels = (img, shape, t, s) => {
                ctx.clearRect(0, 0, SOLVE_W, SOLVE_H);
                const r = rect(shape, t, s);
                ctx.drawImage(img, r.x * sx, r.y * sy, r.w * sx, r.h * sy);
                const d = ctx.getImageData(0, 0, SOLVE_W, SOLVE_H).data;
                let n = 0;
                for (let i = 0, p = 3; i < acc.length; i++, p += 4)
                    if (d[p] > 128 && !acc[i]) n++;
                return n;
            };
            const commit = (img, shape, t, s) => {
                ctx.clearRect(0, 0, SOLVE_W, SOLVE_H);
                const r = rect(shape, t, s);
                ctx.drawImage(img, r.x * sx, r.y * sy, r.w * sx, r.h * sy);
                const d = ctx.getImageData(0, 0, SOLVE_W, SOLVE_H).data;
                for (let i = 0, p = 3; i < acc.length; i++, p += 4) if (d[p] > 128) acc[i] = 1;
            };

            placements = [];
            targets.forEach((t, j) => {
                const si = order[j];
                const shape = layout.shapes[si];
                let lo = 0.05, hi = 2.6;
                for (let it = 0; it < 14; it++) {
                    const mid = (lo + hi) / 2;
                    if (newPixels(shapeImgs[si].full, shape, t, mid) < targetPx) lo = mid; else hi = mid;
                }
                const s = hi;
                const r = rect(shape, t, s);
                commit(shapeImgs[si].core, shape, t, s);
                commit(shapeImgs[si].full, shape, t, s);
                const kind = t.kind;
                for (const which of ["core", "full"]) {
                    const k = which === "core" ? 0.62 : 1;       // 芯は同じ形の小さい版
                    const w = r.w * k, h = r.h * k;
                    placements.push({
                        url: shapeImgs[si][which].src,
                        x: r.x + (r.w - w) / 2, y: r.y + (r.h - h) / 2, w, h,
                        ox: (t.x / FW) * 100, oy: (t.y / FH) * 100,
                        kind,
                    });
                }
            });
            lastMaskCss = "__replan__";
        }

        const frameScale = () => {
            const [FW, FH] = layout.frame;
            return [stage.clientWidth / FW, stage.clientHeight / FH];
        };

        // entries: [{ p, k }] k=飛沫の倍率(burst演出で1未満から跳ねる)。中心を保って拡縮する
        function maskCssFor(entries) {
            const [kx, ky] = frameScale();
            const rect = ({ p, k = 1 }) => {
                const w = p.w * k, h = p.h * k;
                const x = p.x + (p.w - w) / 2, y = p.y + (p.h - h) / 2;
                return [x * kx, y * ky, w * kx, h * ky];
            };
            return {
                image: entries.map((e) => `url("${e.p.url}")`).join(", "),
                position: entries.map((e) => { const r = rect(e); return `${r[0].toFixed(1)}px ${r[1].toFixed(1)}px`; }).join(", "),
                size: entries.map((e) => { const r = rect(e); return `${r[2].toFixed(1)}px ${r[3].toFixed(1)}px`; }).join(", "),
            };
        }

        // 窓のマスクを出すのを遅らせる（インクが覆いきってから窓が現れる順番を守る）
        const maskHoldUntil = new Map();   // layerIndex → performance.now() 基準の解禁時刻

        // window スタイル用の共有ビデオ。着弾のたびに窓側と同じ再生時刻へ合わせて使い回す。
        // （連打では前の着弾から奪われることがあるが、直後にフェードするので目立たない）
        let impactVideo = null;
        function acquireImpactVideo() {
            if (!impactVideo) {
                impactVideo = document.createElement("video");
                impactVideo.src = revealVideo.currentSrc || revealVideo.src;
                impactVideo.muted = true;
                impactVideo.loop = true;
                impactVideo.playsInline = true;
                impactVideo.preload = "auto";
                impactVideo.setAttribute("aria-hidden", "true");
            }
            try { impactVideo.currentTime = revealVideo.currentTime; } catch {}
            impactVideo.play().catch(() => {});
            return impactVideo;
        }

        function releaseImpact(el) {
            if (impactVideo && impactVideo.parentNode === el) {
                impactVideo.pause();
                impactVideo.remove();
            }
            el.remove();
        }

        // 着弾点から飛び散る小滴。transform/opacity のみ＝映像の描画を乱さない
        const DROPLET_FILL = {
            white: "radial-gradient(circle at 40% 35%, #ffffff, #cfd6dd 70%)",
            window: "radial-gradient(circle at 40% 35%, #ffd9a0, #d99a55 70%)",
            plate: "radial-gradient(circle at 40% 35%, #ffd9a0, #d99a55 70%)",
        };
        function spawnDroplets(p) {
            const fill = DROPLET_FILL[IMPACT_STYLE];
            if (!fill) return;
            const cx = (stage.clientWidth * p.ox) / 100;
            const cy = (stage.clientHeight * p.oy) / 100;
            const n = 5 + Math.floor(Math.random() * 4);
            for (let i = 0; i < n; i++) {
                const d = document.createElement("div");
                d.className = "ink-droplet";
                const size = 5 + Math.random() * 12;
                d.style.width = d.style.height = `${size.toFixed(1)}px`;
                d.style.left = `${(cx - size / 2).toFixed(1)}px`;
                d.style.top = `${(cy - size / 2).toFixed(1)}px`;
                d.style.background = fill;
                stage.appendChild(d);
                const ang = Math.random() * Math.PI * 2;
                const dist = 46 + Math.random() * 110;
                const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
                d.animate(
                    [
                        { transform: "translate(0, 0) scale(1)", opacity: 0.95, offset: 0 },
                        { transform: `translate(${(dx * 0.7).toFixed(1)}px, ${(dy * 0.7 - 12).toFixed(1)}px) scale(0.8)`, opacity: 0.9, offset: 0.55 },
                        { transform: `translate(${dx.toFixed(1)}px, ${(dy + 18).toFixed(1)}px) scale(0.3)`, opacity: 0, offset: 1 },
                    ],
                    { duration: 560 + Math.random() * 260, easing: "cubic-bezier(0.16, 0.8, 0.4, 1)", fill: "forwards" }
                ).finished.then(() => d.remove()).catch(() => d.remove());
            }
        }

        // 開いた窓の跳ね。0.55 → 1.06 → 1.0
        const burstAt = new Map();
        const easeOut = (u) => 1 - (1 - u) * (1 - u);
        function burstScale(i) {
            const rec = burstAt.get(i);
            if (!rec) return 1;
            const t = (performance.now() - rec.start) / rec.dur;
            if (t >= 1) { burstAt.delete(i); return 1; }
            if (t < 0.55) return 0.55 + (1.06 - 0.55) * easeOut(t / 0.55);
            return 1.06 + (1.0 - 1.06) * easeOut((t - 0.55) / 0.45);
        }

        const IMPACT_NAME_TTL_MS = 2000;   // これより古い名前は飛沫に付けない
        let impactName = null;
        window.__setImpactName = (n, options = {}) => {
            const raw = String(n ?? "").trim();
            if (raw && raw !== "匿名サポーター") impactName = { raw, options, at: Date.now() };
        };

        // 参加イベントは名前しか運ばない。支援者コメントは別フィードなので名前で突き合わせる
        function supporterCommentFor(name) {
            const hit = supporterCommentRotation.find((e) => e?.name === name && e?.comment);
            return hit ? hit.comment : "";
        }

        function takeImpactMeta() {
            if (!impactName || Date.now() - impactName.at > IMPACT_NAME_TTL_MS) return null;
            const meta = impactName;
            impactName = null;
            return meta;
        }

        // 名前ロール・QR・カウンター・タイトル・DEV操作パネルの上に名前を出さない
        const HUD_SELECTORS = [".thanks", ".cta", ".dock .live", ".brandbar", ".supporter-comment-wall", ".tools"];

        function hudRects() {
            return HUD_SELECTORS.flatMap((sel) => [...document.querySelectorAll(sel)])
                .filter((el) => el.offsetParent !== null || getComputedStyle(el).display !== "none")
                .map((el) => el.getBoundingClientRect())
                .filter((r) => r.width > 0 && r.height > 0);
        }

        // 表示中の他の名前も障害物にする。これで名前どうしは絶対に重ならない
        function blockerRects(exclude) {
            return hudRects().concat(
                activeNames.filter((n) => n !== exclude).map((n) => n.getBoundingClientRect())
            );
        }

        // 名前は出現時に自分の高さの±12%ぶん上下に跳ねる。その振れ幅を余白で吸収する
        const overlaps = (a, b, pad = 28) =>
            a.left < b.right + pad && a.right > b.left - pad &&
            a.top < b.bottom + pad && a.bottom > b.top - pad;

        function placeNameAvoidingHud(el, ox, oy) {
            const blockers = blockerRects(el);
            const put = (x, y) => {
                el.style.left = `${x}%`;
                el.style.top = `${y}%`;
                return el.getBoundingClientRect();
            };
            const clampX = (x) => Math.min(78, Math.max(22, x));
            const clampY = (y) => Math.min(82, Math.max(16, y));   // 上端に張り付かせない
            const free = (r) => !blockers.some((b) => overlaps(r, b));

            const x0 = clampX(ox), y0 = clampY(oy);
            if (free(put(x0, y0))) return;

            // 元の着弾点にいちばん近い空き場所を探す（方向に優先順位をつけない）
            let best = null;
            for (let d = 6; d <= 44; d += 6) {
                for (let deg = 0; deg < 360; deg += 30) {
                    const rad = (deg * Math.PI) / 180;
                    const x = clampX(x0 + Math.cos(rad) * d * 1.35);   // 横は少し広く探る
                    const y = clampY(y0 + Math.sin(rad) * d);
                    if (!free(put(x, y))) continue;
                    const dist = Math.hypot(x - x0, y - y0);
                    if (!best || dist < best.dist) best = { x, y, dist };
                }
                if (best) break;   // 半径が近い順に探しているので最初に見つかった環で確定
            }
            if (best) { put(best.x, best.y); return true; }
            put(50, 34);
            return false;   // 空きがなかった
        }

        const activeNames = [];
        const MAX_NAMES = 3;   // 同時に立てる名前の上限
        const queuedLinkedNames = [];
        let queuedLinkedNameTimer = null;

        function dismissName(el, fast = true) {
            const i = activeNames.indexOf(el);
            if (i >= 0) activeNames.splice(i, 1);
            el.getAnimations().forEach((a) => a.cancel());
            el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: fast ? 180 : 400, fill: "forwards" })
                .finished.then(() => el.remove()).catch(() => el.remove());
        }

        function showImpactName(p, meta) {
            if (!meta) return;
            const { raw, options } = meta;
            while (activeNames.length >= MAX_NAMES) dismissName(activeNames[0]);
            const el = document.createElement("div");
            el.className = "impact-name";
            // 通算参加者は文言を増やさず、色だけで区別する。
            const returning = options?.isReturning === true && hasStreakColor(options);
            el.classList.toggle("is-returning", returning);
            if (returning) applyStreakClass(el, options);

            const comment = supporterCommentFor(raw);
            el.classList.toggle("is-supporter", Boolean(comment));
            if (comment) {
                const sigil = document.createElement("span");
                sigil.className = "supporter-sigil";
                sigil.setAttribute("aria-hidden", "true");
                el.appendChild(sigil);
            }
            const line = document.createElement("span");
            line.className = "impact-person-name";
            line.textContent = `${raw}さん`;
            el.appendChild(line);
            if (comment) {
                const c = document.createElement("span");
                c.className = "impact-comment";
                c.textContent = comment;
                el.appendChild(c);
            }
            stage.appendChild(el);
            activeNames.push(el);
            if (!placeNameAvoidingHud(el, p.ox, p.oy - 7)) {
                // どこにも置けない＝古い名前が塞いでいる。いちばん古いのを畳んでやり直す
                if (activeNames.length > 1) {
                    dismissName(activeNames[0]);
                    placeNameAvoidingHud(el, p.ox, p.oy - 7);
                }
            }
            el.animate(
                [
                    { opacity: 0, transform: "translate(-50%, -35%) scale(0.86)", offset: 0 },
                    { opacity: 1, transform: "translate(-50%, -50%) scale(1)", offset: 0.16 },
                    { opacity: 1, transform: "translate(-50%, -50%) scale(1)", offset: 0.76 },
                    { opacity: 0, transform: "translate(-50%, -62%) scale(1.02)", offset: 1 },
                ],
                { duration: comment ? 8000 : (options?.linked === true ? 5500 : 2800), easing: "cubic-bezier(0.22, 1, 0.36, 1)", fill: "forwards" }
            ).finished
                .then(() => {
                    const i = activeNames.indexOf(el);
                    if (i >= 0) activeNames.splice(i, 1);
                    el.remove();
                })
                .catch(() => el.remove());
        }

        function billboardFlash(name) {
            // 最後の1人の名前待ち中は表示し、完成映像が始まった後だけ割り込みを止める。
            if (!name || celebrationActive) return;
            billboardText.textContent = name;
            billboard.style.transform = billboardMatrix();
            billboard.classList.remove("is-flash", "is-lit");
            void billboard.offsetWidth;
            billboard.classList.add("is-flash");
        }

        // 同じ形を2枚重ね、内側を数px縮めて引き算する = 輪郭だけが残る
        function spawnOutline(p, options = {}) {
            const el = document.createElement("div");
            el.className = "ink-outline";
            el.classList.toggle("is-name-linked", options.linked === true);
            el.classList.toggle("is-supporter", options.isSupporter === true);
            const [kx, ky] = frameScale();
            const w = p.w * kx, h = p.h * ky, x = p.x * kx, y = p.y * ky;
            const t = 3;  // 線の太さ(px)
            const image = `url("${p.url}"), url("${p.url}")`;
            const size = `${w.toFixed(1)}px ${h.toFixed(1)}px, ${(w - 2 * t).toFixed(1)}px ${(h - 2 * t).toFixed(1)}px`;
            const pos = `${x.toFixed(1)}px ${y.toFixed(1)}px, ${(x + t).toFixed(1)}px ${(y + t).toFixed(1)}px`;
            for (const k of ["webkitMaskImage", "maskImage"]) el.style[k] = image;
            for (const k of ["webkitMaskSize", "maskSize"]) el.style[k] = size;
            for (const k of ["webkitMaskPosition", "maskPosition"]) el.style[k] = pos;
            // mask-image の先頭が最前面。演算子は「自分より下の層」に対して適用される。
            // したがって「大きい形 subtract 小さい形」= 輪郭。順序を逆にすると塗りつぶしになる。
            el.style.maskComposite = "subtract, add";
            el.style.transformOrigin = `${p.ox}% ${p.oy}%`;
            stage.insertBefore(el, warmLayer);

            const frames = options.linked === true
                ? [
                    { opacity: 0, transform: "scale(0.94)", offset: 0 },
                    { opacity: 1, transform: "scale(1.035)", offset: 0.16 },
                    { opacity: 0.62, transform: "scale(0.995)", offset: 0.38 },
                    { opacity: 1, transform: "scale(1.025)", offset: 0.62 },
                    { opacity: 0, transform: "scale(1.06)", offset: 1 },
                  ]
                : [
                    { opacity: 0, transform: "scale(0.97)", offset: 0 },
                    { opacity: 0.95, transform: "scale(1.01)", offset: 0.18 },
                    { opacity: 0.55, transform: "scale(1)", offset: 0.4 },
                    { opacity: 0, transform: "scale(1.03)", offset: 1 },
                  ];
            el.animate(frames, {
                duration: options.linked === true ? 2600 : 1100,
                easing: "cubic-bezier(0.22, 1, 0.36, 1)",
                fill: "forwards",
            }).finished.then(() => el.remove()).catch(() => el.remove());
        }

        function relightParticipation(name, options = {}) {
            const raw = String(name ?? "").trim().slice(0, 24);
            const swipeCount = Math.floor(Number(options?.swipeCount));
            if (!isRealName(raw) || !Number.isFinite(swipeCount) || swipeCount <= 0) {
                return false;
            }

            const layerIndex = ((swipeCount - 1) % TOTAL + TOTAL) % TOTAL;
            const p = placements[layerIndex];
            if (!p) return false;

            noteParticipationActivity();
            // データ側の完了処理は待たせない。直列化するのは共有画面の視覚演出だけ。
            resolvePendingCompletionWithName(swipeCount);
            queuedLinkedNames.push({ name: raw, options: { ...options }, p });
            if (queuedLinkedNames.length > 30) queuedLinkedNames.shift();
            flushQueuedLinkedNames();
            return true;
        }

        function playQueuedLinkedName({ name: raw, options, p }) {
            const isSupporter = options.isSupporter === true || Boolean(supporterCommentFor(raw));
            spawnNameBeacon(p);
            window.setTimeout(() => {
                beginLinkedNameReveal(isSupporter ? 8000 : 5500);
                spawnOutline(p, { linked: true, isSupporter });
                showImpactName(p, { raw, options: { ...options, linked: true, isSupporter } });
                if (isSupporter) {
                    // 支援者は同じインクと街中の電子看板の両方へ表示する。
                    billboardFlash(raw);
                }
            }, 2000);
        }

        let linkedNameRevealDepth = 0;
        function beginLinkedNameReveal(durationMs) {
            linkedNameRevealDepth += 1;
            document.body.classList.add("is-linked-name-reveal");
            window.setTimeout(() => {
                linkedNameRevealDepth = Math.max(0, linkedNameRevealDepth - 1);
                if (linkedNameRevealDepth === 0) document.body.classList.remove("is-linked-name-reveal");
            }, durationMs);
        }

        function spawnNameBeacon(p) {
            const el = document.createElement("div");
            el.className = "ink-name-beacon";
            el.style.left = `${p.ox}%`;
            el.style.top = `${p.oy}%`;
            stage.appendChild(el);
            window.setTimeout(() => {
                if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
                    const echo = el.cloneNode(true);
                    stage.appendChild(echo);
                    window.setTimeout(() => echo.remove(), 760);
                }
            }, 900);
            window.setTimeout(() => el.remove(), 760);
        }

        function flushQueuedLinkedNames() {
            if (celebrationActive || queuedLinkedNameTimer || queuedLinkedNames.length === 0) return;
            const next = queuedLinkedNames.shift();
            playQueuedLinkedName(next);
            queuedLinkedNameTimer = window.setTimeout(() => {
                queuedLinkedNameTimer = null;
                flushQueuedLinkedNames();
            }, 2000);
        }

        function spawnImpact(layerIndex) {
            const p = placements[layerIndex];
            if (!p) return;
            const meta = takeImpactMeta();
            const isSupporter = Boolean(
                meta?.options?.isSupporter === true ||
                (meta?.raw && supporterCommentFor(meta.raw))
            );
            if (meta) showImpactName(p, {
                ...meta,
                options: { ...meta.options, isSupporter },
            });
            else spawnOutline(p);
            if (isSupporter && meta?.raw) billboardFlash(meta.raw);

            if (IMPACT_STYLE === "burst") {
                // 中間層を作らない。窓そのものを跳ねさせる
                burstAt.set(layerIndex, {
                    start: performance.now(),
                    dur: layerIndex % 2 === 0 ? BURST_MS.core : BURST_MS.full,
                });
                return;
            }

            const el = document.createElement("div");
            el.className = `ink-impact is-${IMPACT_STYLE}`;
            // 常連なら、落ちるインクをその人の色に染める。支援者なら金にする
            if (meta?.options?.isReturning === true && hasStreakColor(meta.options)) {
                el.classList.add("is-streak");
                applyStreakClass(el, meta.options);
            }
            if (isSupporter) el.classList.add("is-supporter");
            const css = maskCssFor([{ p, k: 1 }]);
            for (const prop of ["webkitMaskImage", "maskImage"]) el.style[prop] = css.image;
            for (const prop of ["webkitMaskPosition", "maskPosition"]) el.style[prop] = css.position;
            for (const prop of ["webkitMaskSize", "maskSize"]) el.style[prop] = css.size;
            el.style.transformOrigin = `${p.ox}% ${p.oy}%`;
            if (IMPACT_STYLE === "window") el.appendChild(acquireImpactVideo());
            stage.insertBefore(el, warmLayer);

            const isCore = layerIndex % 2 === 0;
            const dur = isCore ? 440 : 680;
            // インクが窓を覆いきるまで窓のマスクを出さない（着弾→溶けて窓が現れる、の順番）。
            // window スタイルは着地の瞬間に下の窓と同じ絵で重なるので、着地まで待つ
            const coverAt = IMPACT_STYLE === "window" ? dur : dur * 0.42;
            maskHoldUntil.set(layerIndex, performance.now() + coverAt);
            spawnDroplets(p);

            // blur は毎フレーム再ラスタライズになるので使わない（transform/opacity のみ）
            const frames = isCore
                ? [
                    { transform: "scale(0.12) rotate(-8deg)", opacity: 0, offset: 0 },
                    { transform: "scale(1.28) rotate(2deg)", opacity: 1, offset: 0.42 },
                    { transform: "scale(0.94) rotate(-1deg)", opacity: 1, offset: 0.72 },
                    { transform: "scale(1) rotate(0deg)", opacity: 1, offset: 1 },
                  ]
                : [
                    { transform: "scale(0.55) rotate(-3deg)", opacity: 0, offset: 0 },
                    { transform: "scale(1.10) rotate(1deg)", opacity: 1, offset: 0.5 },
                    { transform: "scale(0.97) rotate(0deg)", opacity: 1, offset: 0.8 },
                    { transform: "scale(1) rotate(0deg)", opacity: 1, offset: 1 },
                  ];
            el.animate(frames, {
                duration: dur,
                easing: "cubic-bezier(0.18, 1.25, 0.32, 1)",
                fill: "forwards",
            }).finished
                .then(() => el.animate(
                    [
                        { opacity: 1, transform: "scale(1)" },
                        { opacity: 0, transform: "scale(1.04)" },
                    ],
                    { duration: 620, delay: 160, fill: "forwards" }).finished)
                .then(() => releaseImpact(el))
                .catch(() => releaseImpact(el));
        }

        let lastMaskCss = "";
        let seenRevealed = null;
        let lastRevealedCount = 0;
        // 起動直後は保存済みの参加数が復元されるので、それを新規参加と誤認して弾けさせない
        const IMPACTS_LIVE_AFTER = Date.now() + 2000;

        const QUIET_MS = 20_000;   // これだけ参加が無ければ「静かな時間」= 過去コメントの出番
        const COMMENT_DELAY_MS = 1500;   // 反転してからコメントを出すまでの間
        if (!window.__lastParticipationAt) window.__lastParticipationAt = Date.now();
        let wasCelebrating = false;
        let commentDelayTimer = null;

        function currentSupporter() {
            return supporterCommentRotation[supporterCommentIndex] ?? null;
        }

        function onCelebrationStart() {
            // 過去の支援者名（例：はる）を達成時に自動選出しない。
            billboard.classList.remove("is-lit", "is-flash");
        }

        function onCelebrationEnd() {
            billboard.classList.remove("is-lit", "is-flash");
            window.clearTimeout(commentDelayTimer);
            document.body.classList.remove("comment-ready");
        }

        function syncRevealMask() {
            const celebrating = stage.classList.contains("is-complete");
            if (celebrating !== wasCelebrating) {
                wasCelebrating = celebrating;
                celebrating ? onCelebrationStart() : onCelebrationEnd();
            }
            const lastAt = window.__lastParticipationAt ?? 0;
            document.body.classList.toggle("is-celebrating", celebrating);
            const isQuiet = !celebrating && Date.now() - lastAt > QUIET_MS;
            document.body.classList.toggle("is-quiet", isQuiet);
            syncSupporterCommentHistory(isQuiet && !idleVideoActive);
            if (!layout) return;
            const onIdx = layers.map((l, i) => (l.classList.contains("is-revealed") ? i : -1))
                .filter((i) => i >= 0);

            // 1周終わって0に戻ったら、次の回の配置を引き直す
            if (onIdx.length === 0 && lastRevealedCount > 0) planRound();
            lastRevealedCount = onIdx.length;

            if (seenRevealed === null || Date.now() < IMPACTS_LIVE_AFTER) {
                seenRevealed = new Set(onIdx);
            } else {
                for (const i of onIdx) if (!seenRevealed.has(i)) spawnImpact(i);
                seenRevealed = new Set(onIdx);
            }

            const now = performance.now();
            for (const [i, t] of maskHoldUntil) if (t <= now) maskHoldUntil.delete(i);
            const entries = onIdx
                .filter((i) => placements[i] && !maskHoldUntil.has(i))
                .map((i) => ({ p: placements[i], k: burstScale(i) }));
            const css = entries.length ? maskCssFor(entries) : { image: "", position: "", size: "" };
            const key = css.image + "|" + css.position + "|" + css.size;
            if (key !== lastMaskCss) {
                lastMaskCss = key;
                for (const prop of ["webkitMaskImage", "maskImage"]) revealVideo.style[prop] = css.image;
                for (const prop of ["webkitMaskPosition", "maskPosition"]) revealVideo.style[prop] = css.position;
                for (const prop of ["webkitMaskSize", "maskSize"]) revealVideo.style[prop] = css.size;
                revealVideo.classList.toggle("has-mask", entries.length > 0);
                if (revealVideo.paused) revealVideo.play().catch(() => {});
            }
        }

        (async () => {
            document.body.classList.toggle("dooh-dev", DEV);
            layout = await fetch("assets/ink-people/layout.json").then((r) => r.json());
            // ここより上は同期実行。supporterCommentRotation などの宣言はまだ TDZ なので触れない
            if (DEV && supporterCommentRotation.length === 0) {
                setSupporterComments([
                    { name: "さくら", comment: "新宿がまた、誰かの帰り道になりますように。" },
                    { name: "タクミ", comment: "夜のこの街を、少しだけ明るくしたい。" },
                    { name: "ケンタ", comment: "十年ぶりに東口に降りた。まだ好きだった。" },
                ]);
            }
            // shape-NN-core.png は make-ink-people-assets.py が切断辺を修復済みの飛沫
            // （元素材の直線カットは揺らぎ＋小滴に置き換わっている）。
            // 芯=同じ形の 62%、完成形=100% として大小で二段階を表す。
            shapeImgs = await Promise.all(
                layout.shapes.map(async (_, i) => {
                    const img = await loadImage(`assets/ink-people/shape-${String(i + 1).padStart(2, "0")}-core.png`);
                    return { full: img, core: img };
                })
            );
            await loadImage("assets/ink-people/plate.jpg");
            planRound();
            window.addEventListener("resize", () => {
                lastMaskCss = "__resize__";
                if (billboard.classList.contains("is-lit")) billboard.style.transform = billboardMatrix();
            });
            (function tick() { syncRevealMask(); requestAnimationFrame(tick); })();
            console.log(`[ink] 実行時配置 ready / impact=${IMPACT_STYLE}`);
        })();

            // 旧イベント（totalDays 未保持）は streakDays で補完する。
            const totalDays = Math.max(1, Number(options.totalDays) || Number(options.streakDays) || 1);
            if (totalDays < 2) return "";

        function addToDonorNameRotation(name, options = {}) {
            const entry = {

                isReturning: options.isReturning === true,
                isSupporter: options.isSupporter === true,
                streakDays: Math.max(1, Number(options.streakDays) || 1),
                totalDays: Math.max(1, Number(options.totalDays) || Number(options.streakDays) || 1),
                tickerFont: typeof options.tickerFont === "string" ? options.tickerFont : "",
                createdAt: Number(options.createdAt) || 0,
                swipeEventId: typeof options.swipeEventId === "string" ? options.swipeEventId : "",
                swipeCount: Math.max(0, Math.floor(Number(options.swipeCount) || 0)),
            };
            const existingIndex = donorNameRotation.findIndex((current) => {
                const sameVisitor = Boolean(entry.visitorId && current.visitorId === entry.visitorId);
                const sameDisplayName = String(current.name).trim() === String(entry.name).trim();
                return sameVisitor || sameDisplayName;
            });
            if (existingIndex >= 0) {
                donorNameRotation.splice(existingIndex, 1);
            }
            donorNameRotation.push(entry);
            donorNameRotation.sort((a, b) =>
                b.totalDays - a.totalDays ||
                b.createdAt - a.createdAt
            );
            return entry;

        const TICKER_FONT_CLASSES = [

            const requested = String(entry.tickerFont || "").trim();
            const requestedClass = `ticker-font-${requested}`;
            if (TICKER_FONT_CLASSES.includes(requestedClass)) {
                return requestedClass;
            }
            const source = String(entry.visitorId || entry.name || "supporter");
            let hash = 0;
            for (let index = 0; index < source.length; index += 1) {
                hash = (hash * 31 + source.charCodeAt(index)) >>> 0;
            }
            return TICKER_FONT_CLASSES[hash % TICKER_FONT_CLASSES.length];

        function appendTickerItems(group, entries, priorityEntry = null) {

                name.classList.toggle("is-latest", entry === priorityEntry);
                name.classList.toggle("is-supporter", entry.isSupporter === true || Boolean(supporterCommentFor(entry.name)));

                name.textContent = `${entry.name}さん`;
