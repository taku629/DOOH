<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- ホーム画面に追加して起動するとブラウザUIなしの全画面（プロジェクター表示用） -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="新宿DOOH" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#050606" />
    <title>新宿インク演出デモ</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.skypack.dev" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=EB+Garamond:wght@500;600;700&family=Hanken+Grotesk:wght@400;600;700&family=M+PLUS+Rounded+1c:wght@500;700&family=Noto+Sans+JP:wght@500;700&family=Shippori+Mincho:wght@600;700&family=Yusei+Magic&display=swap" rel="stylesheet" />
    <style>
        /* モノクロ大理石テーマ（theme-men.css / SHINJUKU GIVE に準拠） */
        :root {
            --ink: #151919;
            --ink-strong: #050606;
            --ink-2: #5c5f60;
            --silver: #c8c8c8;
            --line: rgba(21, 25, 25, 0.14);
            --line-soft: rgba(21, 25, 25, 0.08);
            --font-sans: "Hanken Grotesk", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
            --font-serif: "EB Garamond", "Noto Sans JP", serif;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            color: var(--ink);
            font-family: var(--font-sans);
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* 大理石の壁（参加サイトと同じ床面） */
        body {
            background:
                radial-gradient(ellipse at 16% 8%, rgba(255, 255, 255, 0.96) 0 12%, transparent 34%),
                radial-gradient(ellipse at 82% 18%, rgba(230, 230, 230, 0.5) 0 14%, transparent 36%),
                radial-gradient(ellipse at 42% 88%, rgba(190, 190, 190, 0.18) 0 14%, transparent 38%),
                linear-gradient(118deg, transparent 0 29%, rgba(21, 21, 21, 0.052) 30%, transparent 33% 100%),
                linear-gradient(128deg, transparent 0 47%, rgba(21, 21, 21, 0.12) 48%, rgba(21, 21, 21, 0.03) 49%, transparent 51% 100%),
                linear-gradient(24deg, transparent 0 64%, rgba(48, 48, 48, 0.07) 65%, transparent 68% 100%),
                #f8f8f8;
        }

        /* ステージ：画面全体が新宿の写真。黒地に飛沫を screen で累積リビール */
        .stage {
            position: fixed;
            inset: 0;
            background: #050606;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
            isolation: isolate;
        }

        /* 待機画面：荒廃した新宿動画をそのまま全画面表示 */
        .base-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
        }

        .base-video {
            filter: brightness(0.82) contrast(1.06) saturate(0.92);
        }

        .ink-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            /* 全画面いっぱいに新宿を表示 */
            object-fit: cover;
            z-index: 1;
            opacity: 0;
            /* 黒背景を透過させ、飛沫の明部だけを累積させる */
            mix-blend-mode: screen;
            will-change: transform, opacity, filter;
            pointer-events: none;
        }

        .ink-layer.is-revealed { opacity: 1; }

        /* 実行時配置版: 18枚のimgは「どの飛沫が出ているか」の状態だけを持つ */
        img.ink-layer:not(.final-layer) { display: none; }

        .reveal-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 400ms ease;
            /* 窓の中は「回復した新宿そのもの」。反転後の warm-layer と同一の発色にする */
            filter: sepia(0.08) saturate(1.08) brightness(0.96) contrast(1.02);
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            mask-composite: add;
            -webkit-mask-composite: source-over;
        }

        .reveal-video.has-mask { opacity: 1; }

        /* 着弾。跳ねて消えたあと、下の窓（動くclean映像）が残る */
        .ink-impact {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
        }

        .ink-impact.is-plate {
            background: url("assets/ink-people/plate.jpg") center / cover no-repeat;
            filter: sepia(0.08) saturate(1.08) brightness(0.96);
        }

        /* 墨: 廃墟が暗いので、冷たいハローを付けて存在を見せる */
        .ink-impact.is-ink {
            background: radial-gradient(circle at 46% 42%, #2b3138 0%, #14171b 55%, #08090b 100%);
            filter: drop-shadow(0 0 26px rgba(180, 205, 230, 0.38));
        }

        /* 参加者の名前は、着弾した飛沫のところに数秒だけ立つ */
        .impact-name {
            position: absolute;
            z-index: 2;
            transform: translate(-50%, -50%);
            font-family: var(--font-sans);
            font-weight: 700;
            font-size: clamp(1.5rem, 2.7vw, 3.1rem);
            letter-spacing: 0.02em;
            color: #fff;
            text-shadow: 0 4px 26px rgba(0, 0, 0, 0.8), 0 1px 4px rgba(0, 0, 0, 0.6);
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            text-align: center;
        }

        /* 明るい窓の上でも沈まないよう、文字の背後に太い縁を描く */
        .impact-name > span {
            paint-order: stroke fill;
            -webkit-text-stroke: 10px rgba(6, 9, 12, 0.86);
        }

        .impact-name .impact-comment { -webkit-text-stroke-width: 6px; }
        .impact-name .impact-badge { -webkit-text-stroke-width: 5px; }

        /* ---- DOOHとしての整理: 常設は「あと◯人」とQRだけ ---- */
        /* 名前ティッカー / ありがとうスタック / URL / 「第N回 彩リレー」を常設から外す */
        #thanks,
        #participationThanks,
        .url-note,
        .challenge-label { display: none !important; }

        /* 運用者向けの操作説明は本番に出さない */
        .hint { display: none; }
        body.dooh-dev .hint { display: block; }

        /* 累計人数と支援者コメントは、18人達成の祝祭のときだけ */
        .dock .live .label,
        .dock .live .value {
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 700ms ease, transform 700ms ease;
        }

        body.is-celebrating .dock .live .label,
        body.is-celebrating .dock .live .value {
            opacity: 1;
            transform: none;
        }

        /* 映像の中の電子広告板。反転の瞬間に点灯し、支援者の名前を掲げる */
        .billboard {
            position: absolute;
            left: 0;
            top: 0;
            z-index: 5;
            transform-origin: 0 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            background: linear-gradient(160deg, rgba(18, 32, 48, 0.92), rgba(10, 18, 30, 0.96));
            box-shadow: inset 0 0 60px rgba(120, 200, 255, 0.28);
        }

        .billboard.is-lit { animation: billboard-on 1100ms cubic-bezier(0.2, 0.9, 0.3, 1) forwards; }

        /* 支援者のスワイプでは、板が一瞬だけ灯って落ちる（街はまだ直っていない） */
        .billboard.is-flash { animation: billboard-flash 1250ms ease-out forwards; }

        @keyframes billboard-flash {
            0%   { opacity: 0; }
            8%   { opacity: 0.9; }
            16%  { opacity: 0.15; }
            26%  { opacity: 0.8; }
            60%  { opacity: 0.7; }
            100% { opacity: 0; }
        }

        @keyframes billboard-on {
            0%   { opacity: 0; }
            18%  { opacity: 0.85; }
            26%  { opacity: 0.1; }
            38%  { opacity: 0.95; }
            46%  { opacity: 0.35; }
            100% { opacity: 1; }
        }

        .billboard-text {
            font-family: var(--font-sans);
            font-weight: 800;
            font-size: 96px;
            line-height: 1;
            letter-spacing: 0.06em;
            color: #eaf6ff;
            text-shadow: 0 0 18px rgba(140, 210, 255, 0.9), 0 0 48px rgba(90, 170, 255, 0.55);
            white-space: nowrap;
        }

        .billboard-kicker {
            position: absolute;
            bottom: 10px;
            font-size: 26px;
            letter-spacing: 0.5em;
            color: rgba(190, 225, 255, 0.75);
        }

        /* 匿名参加者への返し: その人が開けた窓の輪郭が一瞬だけ光る */
        .ink-outline {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            background: #ffffff;
            mix-blend-mode: screen;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
        }

        /* 支援者バッジと、本人のスワイプに乗る一言コメント */
        .impact-badge {
            display: block;
            font-size: 0.42em;
            letter-spacing: 0.28em;
            font-weight: 600;
            color: #e7c877;
            margin-bottom: 0.35em;
        }

        .impact-comment {
            display: block;
            margin-top: 0.42em;
            font-size: 0.52em;
            font-weight: 500;
            line-height: 1.45;
            color: rgba(255, 255, 255, 0.94);
            max-width: 22em;
            white-space: normal;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            padding-top: 0.4em;
        }

        .impact-name.is-supporter {
            text-align: center;
            text-shadow: 0 4px 26px rgba(0, 0, 0, 0.9), 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        /* 常連の一撃は、その人の色に染まったインクになる（彩＝人） */
        .ink-impact.is-streak {
            background-color: var(--returning-color, #ffc56d);
            background-blend-mode: color;
        }

        /* 支援者の一撃は金。常連色より優先する */
        .ink-impact.is-supporter,
        .ink-impact.is-streak.is-supporter {
            background-color: #e7c877;
            background-blend-mode: color;
            box-shadow: 0 0 90px rgba(231, 200, 119, 0.35);
        }

        /* 常連参加者は名前が streak 色で立つ（従来ピル/ティッカーが担っていた表現） */
        .impact-name.is-returning {
            color: var(--returning-color, #ffc56d);
            text-shadow: 0 4px 26px rgba(0, 0, 0, 0.8), 0 0 22px var(--returning-color, #ffc56d);
        }

        /* 支援者コメントは「祝祭」と「誰も参加していない静かな時間」に出す。
           映像が主役のリレー進行中だけ引っ込む。 */
        /* 静かな時間はすぐ、祝祭では反転から1.5秒おいてから出す（視線を割らない） */
        body:not(.is-quiet):not(.comment-ready) .supporter-comment-wall { display: none !important; }

        /* 祝祭中は映像が静かなので、コメントを主役として大きく読ませる */
        body.is-celebrating .supporter-comment-text {
            font-size: clamp(1.25rem, 2.1vw, 2.3rem);
            line-height: 1.45;
        }

        /* 仕上げの一枚：飛沫ではなく完成版の新宿をくっきり最前面に重ねる */
        .final-layer {
            z-index: 2;
            mix-blend-mode: normal;
        }

        .warm-layer {
            z-index: 3;
            opacity: 0;
            mix-blend-mode: normal;
            filter: sepia(0.08) saturate(1.08) brightness(0.96) contrast(1.02);
            transition: opacity 1800ms ease, filter 1800ms ease;
        }

        .warm-layer.is-revealed {
            opacity: 1;
            filter: sepia(0.12) saturate(1.12) brightness(1.02) contrast(1.04);
        }

        .idle-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 4;
            pointer-events: none;
            opacity: 0;
            filter: saturate(1.04) brightness(0.98) contrast(1.01);
            transition: opacity 900ms ease;
        }

        .idle-layer.is-visible {
            opacity: 1;
        }

        /* 全点灯時に画面全体をふわっと持ち上げる（白〜銀のモノクロ光） */
        .stage.is-complete::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 46%, rgba(255, 255, 255, 0.16), transparent 58%),
                radial-gradient(circle at 50% 46%, rgba(200, 200, 200, 0.12), transparent 72%);
            mix-blend-mode: screen;
            animation: glowPulse 3.2s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* ===== ロワーサード：上下のグラデーションで画像を覆わず文字を載せる ===== */
        .scrim {
            position: fixed;
            left: 0;
            right: 0;
            z-index: 3;
            pointer-events: none;
        }

        .scrim-top {
            top: 0;
            height: 22vh;
            background: linear-gradient(to bottom, rgba(5, 6, 6, 0.62), rgba(5, 6, 6, 0) 100%);
        }

        .scrim-bottom {
            bottom: 0;
            height: 42vh;
            background: linear-gradient(to top, rgba(5, 6, 6, 0.9) 0%, rgba(5, 6, 6, 0.62) 26%, rgba(5, 6, 6, 0) 100%);
        }

        /* ブランド（左上） */
        .brandbar {
            position: fixed;
            top: clamp(20px, 2.6vw, 44px);
            left: clamp(22px, 2.8vw, 52px);
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: clamp(6px, 0.6vw, 10px);
            font-family: var(--font-serif);
            font-weight: 600;
            letter-spacing: 0.06em;
            font-size: clamp(1.35rem, 2.2vw, 2.25rem);
            color: #fff;
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6);
        }

        .brandbar-title {
            display: inline-flex;
            align-items: center;
            gap: clamp(12px, 1vw, 20px);
        }

        .brandbar-title::before {
            content: "";
            width: clamp(13px, 1.1vw, 20px);
            height: clamp(13px, 1.1vw, 20px);
            border-radius: 999px;
            background: #fff;
            box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.16), 0 0 16px rgba(255, 255, 255, 0.6);
            animation: livePulse 1.6s ease-in-out infinite;
        }

        @keyframes livePulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.7); opacity: 0.55; }
        }

        /* 操作ヒント／LIVE状態（ブランドの下） */
        /* タイトルの下の行（LIVE — 参加証投影中） */
        .hint {
            font-family: var(--font-sans);
            font-size: clamp(0.9rem, 1.25vw, 1.15rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.72);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
            transition: opacity 400ms ease;
            pointer-events: none;
        }

        /* 下部ドック：左＝参加カウント／右＝QR＋CTA */
        .dock {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 5;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: clamp(24px, 4vw, 80px);
            padding: clamp(24px, 3.4vw, 64px) clamp(26px, 3.4vw, 68px);
            pointer-events: none;
        }

        .live { position: relative; min-width: 0; color: #fff; }

        .live > .label,
        .live > .value,
        .cta,
        .thanks {
            transition: opacity 900ms ease, transform 900ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 完成映像の切替中は、固定情報を残しつつ映像へ視線を譲る。 */
        body.is-scene-focus .live > .label,
        body.is-scene-focus .live > .value {
            opacity: 0.28;
            transform: translateY(8px);
        }

        body.is-scene-focus .cta {
            opacity: 0.42;
            transform: translateY(8px) scale(0.96);
        }

        body.is-scene-focus .thanks {
            opacity: 0.08;
            transform: translateY(-4px);
        }

        body.is-scene-focus .supporter-comment-wall {
            opacity: 0.96;
            transform: translateY(0) scale(1.02);
            border-color: rgba(255, 255, 255, 0.28);
            box-shadow: 0 18px 52px rgba(0, 0, 0, 0.3), 0 0 24px rgba(255, 255, 255, 0.08);
        }

        /* 複数の寄付者名を連結して右から左へ流し続ける放送テロップ。
           左上が「タイトル＋LIVE行」の2段になったぶん開始位置を下げている。 */
        .thanks {
            position: fixed;
            top: clamp(126px, 15vh, 190px);
            left: 0;
            right: 0;
            z-index: 7;
            margin: 0;
            overflow: hidden;
            font-family: var(--font-sans);
            font-weight: 700;
            font-size: clamp(1rem, 1.55vw, 1.55rem);
            color: rgba(255, 255, 255, 0.82);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.42);
            pointer-events: none;
        }

        .thanks-track {
            display: flex;
            width: max-content;
            will-change: transform;
            animation: donor-ticker var(--ticker-duration, 36s) linear infinite;
        }

        .thanks-group {
            display: flex;
            align-items: center;
            gap: 1em;
            flex: none;
            min-width: 100vw;
            box-sizing: border-box;
            padding: clamp(9px, 0.8vw, 14px) clamp(28px, 3.4vw, 64px);
            border-block: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(15, 18, 18, 0.38);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            white-space: nowrap;
        }

        .ticker-name {
            color: rgba(255, 255, 255, 0.82);
            font-feature-settings: "palt" 1;
            font-synthesis: none;
            line-height: 1.25;
        }

        .ticker-font-noto {
            font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
        }

        .ticker-font-rounded {
            font-family: "M PLUS Rounded 1c", "Noto Sans JP", sans-serif;
            font-size: 0.98em;
        }

        .ticker-font-mincho {
            font-family: "Shippori Mincho", "Noto Serif JP", serif;
            font-size: 1.04em;
            font-weight: 700;
        }

        .ticker-font-dot {
            font-family: "DotGothic16", "Noto Sans JP", monospace;
            font-size: 0.9em;
            letter-spacing: 0.035em;
        }

        .ticker-font-yusei {
            font-family: "Yusei Magic", "Noto Sans JP", sans-serif;
            font-size: 0.98em;
            letter-spacing: 0.02em;
        }

        .ticker-name.is-returning.streak-2,
        .ticker-name.is-returning.streak-3,
        .ticker-name.is-returning.streak-4,
        .ticker-name.is-returning.streak-5,
        .ticker-name.is-returning.streak-6,
        .ticker-name.is-returning.streak-7 {
            color: var(--returning-color, #ffc56d);
            text-shadow: 0 0 10px color-mix(in srgb, var(--returning-color, #ffc56d) 58%, transparent);
        }

        .ticker-name.is-latest {
            padding: 3px 9px;
            border: 1px solid rgba(255, 255, 255, 0.52);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.18);
        }

        .streak-2 { --returning-color: #ffc56d; }
        .streak-3 { --returning-color: #ff8a80; }
        .streak-4 { --returning-color: #f48fb1; }
        .streak-5 { --returning-color: #c5a3ff; }
        .streak-6 { --returning-color: #80d8ff; }
        .streak-7 { --returning-color: #7ee2b8; }

        .ticker-separator {
            color: rgba(255, 255, 255, 0.62);
        }

        @keyframes donor-ticker {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* 参加した瞬間だけ、寄付者名テロップとは別に表示するお礼通知。 */
        .participation-thanks {
            position: absolute;
            bottom: calc(100% + 4px);
            left: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: clamp(7px, 0.7vw, 12px);
            width: min(64vw, 900px);
            color: #fff;
            font-family: var(--font-serif);
            pointer-events: none;
        }

        .participation-thanks-item {
            display: inline-flex;
            align-items: center;
            gap: clamp(10px, 0.9vw, 16px);
            max-width: 100%;
            padding: clamp(8px, 0.8vw, 13px) clamp(14px, 1.35vw, 24px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            background: rgba(15, 18, 18, 0.54);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            font-size: clamp(1rem, 1.55vw, 1.55rem);
            font-weight: 600;
            line-height: 1.25;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.6);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.14);
            white-space: nowrap;
            animation: participation-stack-in 420ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .participation-thanks-item::before {
            content: "";
            width: clamp(9px, 0.8vw, 14px);
            height: clamp(9px, 0.8vw, 14px);
            flex: none;
            border-radius: 999px;
            background: currentColor;
            box-shadow: 0 0 10px currentColor;

        .participation-thanks-item.is-returning.streak-2,
        .participation-thanks-item.is-returning.streak-3,
        .participation-thanks-item.is-returning.streak-4,
        .participation-thanks-item.is-returning.streak-5,
        .participation-thanks-item.is-returning.streak-6,
        .participation-thanks-item.is-returning.streak-7 {
            color: var(--returning-color, #ffc56d);
            text-shadow: 0 2px 16px color-mix(in srgb, var(--returning-color, #ffc56d) 48%, #000);
        }

        .participation-thanks-item.is-leaving {
            animation: participation-stack-out 460ms ease-in both;
        }

        @keyframes participation-stack-in {
            from { opacity: 0; transform: translateY(18px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes participation-stack-out {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-16px); }
        }

        .supporter-comment-wall {
            position: fixed;
            /* 名前テロップ(top 15vh + 帯の高さ約64px)の下に必ず収まる位置 */
            top: clamp(216px, 23vh, 290px);
            right: clamp(26px, 3.4vw, 68px);
            z-index: 6;
            width: min(38vw, 620px);
            min-width: 360px;
            padding: clamp(15px, 1.35vw, 24px) clamp(20px, 1.8vw, 34px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: clamp(16px, 1.45vw, 24px);
            background: linear-gradient(135deg, rgba(15, 18, 18, 0.7), rgba(15, 18, 18, 0.46));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            box-shadow: 0 14px 38px rgba(0, 0, 0, 0.22);
            pointer-events: none;
            transition: opacity 900ms ease, transform 900ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        .supporter-comment-wall[hidden] {
            display: none;
        }

        .supporter-comment-wall.is-switching {
            animation: supporter-comment-in 520ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .supporter-comment-kicker {
            display: block;
            margin-bottom: 5px;
            font-size: clamp(0.76rem, 1vw, 1rem);
            font-weight: 700;
            letter-spacing: 0.16em;
            color: rgba(255, 255, 255, 0.64);
        }

        .supporter-comment-text {
            margin: 0;
            font-family: var(--font-serif);
            font-size: clamp(1.28rem, 1.85vw, 2rem);
            font-weight: 600;
            line-height: 1.32;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.55);
        }

        .supporter-comment-name {
            display: block;
            margin-top: 7px;
            font-size: clamp(0.82rem, 1.08vw, 1.1rem);
            font-weight: 700;
            color: rgba(255, 255, 255, 0.72);
        }

        @keyframes supporter-comment-in {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 900px) {
            .supporter-comment-wall {
                top: clamp(196px, 21vh, 240px);
                right: clamp(18px, 3vw, 28px);
                width: min(42vw, 360px);
                min-width: 240px;
            }
        }

        .stage.is-returning-pulse::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 4;
            pointer-events: none;
            background:
                radial-gradient(circle at 30% 70%, color-mix(in srgb, var(--returning-color, #ffc56d) 34%, transparent), transparent 38%),
                radial-gradient(circle at 70% 30%, color-mix(in srgb, var(--returning-color, #ffc56d) 20%, transparent), transparent 46%);
            mix-blend-mode: screen;
            animation: returningPulse 2600ms ease-out both;
        }

        @keyframes returningPulse {
            0% { opacity: 0; }
            25% { opacity: 1; }
            100% { opacity: 0; }
        }

        .live .value span.num { display: inline-block; }

        body.is-live-broadcast .thanks,
        body.is-live-broadcast .supporter-comment-wall {
            display: none !important;
        }

        body.is-live-broadcast .participation-thanks {
            left: clamp(26px, 3.4vw, 68px);
            bottom: clamp(200px, 19vw, 330px);
        }

        body.is-live-broadcast .cta-copy strong {
            font-size: clamp(1.5rem, 2.55vw, 2.7rem);
        }

        .live .label {
            display: block;
            font-size: clamp(0.95rem, 1.35vw, 1.28rem);
            font-weight: 700;
            letter-spacing: 0.24em;
            text-transform: uppercase;

            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
        }

        .live .value {
            display: flex;
            align-items: baseline;
            gap: 0.18em;
            margin: 2px 0 14px;
            font-family: var(--font-serif);
            font-weight: 600;

            letter-spacing: -0.01em;

        }

        .live .value span.unit {
            font-family: var(--font-sans);
            font-size: 0.26em;
            font-weight: 700;
            letter-spacing: 0.08em;

        }

        .progress-wrap { width: min(620px, 58vw); }

        .progress-text {
            margin: 0 0 10px;
            font-family: var(--font-serif);
            font-size: clamp(1.45rem, 2.7vw, 2.45rem);
            font-weight: 600;
            color: #fff;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.6);
        }

        .progress-text.is-complete { color: #fff; }

        .transition-countdown {
            min-height: 1.4em;
            margin: -2px 0 10px;
            font-size: clamp(0.95rem, 1.35vw, 1.25rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.82);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.58);

        .transition-countdown:empty {

        .challenge-label {
            display: block;
            margin-bottom: 6px;
            font-size: clamp(0.86rem, 1.18vw, 1.08rem);
            font-weight: 700;
            letter-spacing: 0.16em;
            color: rgba(255, 255, 255, 0.7);
        }

        .progress-bar {
            height: clamp(10px, 0.8vw, 15px);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.18);
            overflow: hidden;
        }

        .progress-bar span {
            display: block;
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: linear-gradient(90deg, #ffffff, #c8c8c8);
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.5);
            transition: width 600ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ===== QR＋CTA（右下：視線の終着点・既存DOOHと同じ参加リンク） ===== */
        .cta {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: clamp(18px, 1.8vw, 32px);
            pointer-events: auto;
        }

        .cta-copy { text-align: right; color: #fff; }

        .cta-copy strong {
            display: block;
            font-family: var(--font-serif);
            font-weight: 600;
            font-size: clamp(1.65rem, 2.75vw, 2.9rem);
            line-height: 1.1;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.6);
            transition: opacity 360ms ease, transform 360ms ease;
        }

        .cta-copy small {
            display: block;
            margin-top: 8px;
            font-size: clamp(1.05rem, 1.45vw, 1.42rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.82);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
            transition: opacity 360ms ease, transform 360ms ease;
        }

        .cta-copy.is-changing strong,
        .cta-copy.is-changing small {
            opacity: 0;
            transform: translateY(4px);
        }

        .qr-code {
            width: clamp(190px, 18vw, 300px);
            padding: clamp(13px, 1vw, 18px);
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5);
            line-height: 0;
        }

        /* 正方形のQRを等比表示。qrcodeライブラリが付ける inline style を !important で上書き */
        .qr-code canvas, .qr-code img {
            display: block;
            width: 100% !important;
            height: auto !important;
            aspect-ratio: 1;
        }

        /* QR遷移先の確認用。通常表示では隠し、?dev のときだけ表示する。 */
        .url-note {
            display: none;
            position: fixed;
            left: clamp(26px, 3.4vw, 68px);
            bottom: clamp(10px, 1.2vw, 18px);
            z-index: 5;
            font-size: clamp(0.8rem, 1.05vw, 1rem);
            letter-spacing: 0.02em;
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
        }

        .url-note.is-dev-visible {
            display: block;
        }

        /* 操作系（デモ用ツール）：右上 */
        .tools {
            position: fixed;
            top: clamp(16px, 2.4vw, 36px);
            right: clamp(16px, 2.4vw, 36px);
            z-index: 6;
            display: none;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
            max-width: min(92vw, 820px);
        }

        body.is-manual-mode .tools {
            display: flex;
        }

        .tools button {
            pointer-events: auto;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid rgba(21, 25, 25, 0.18);
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--ink);
            font-family: var(--font-sans);
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(21, 25, 25, 0.08);
            transition: transform 120ms ease, border-color 160ms ease, background 160ms ease;
        }

        .tools button:hover { border-color: var(--ink); }
        .tools button:active { transform: scale(0.94); }
        .tools button.is-on {
            border-color: var(--ink);
            background: var(--ink);
            color: #fff;
        }

        .tools button.is-danger {
            border-color: rgba(190, 30, 30, 0.28);
            background: rgba(190, 30, 30, 0.88);
            color: #fff;
        }

        .tools button.is-running {
            border-color: rgba(21, 25, 25, 0.4);
            background: rgba(21, 25, 25, 0.88);
            color: #fff;
        }

        body.is-live-broadcast .tools,
        body.is-live-broadcast .hint,
        body.is-live-broadcast .url-note {
            display: none !important;
        }

        body.is-dooh-phone-preview {
            background: #050606;
        }

        body.is-dooh-phone-preview::before {
            content: "横向きにするとDOOH全体が見やすくなります";
            position: fixed;
            top: max(10px, env(safe-area-inset-top));
            left: 50%;
            z-index: 8;
            display: none;
            width: min(92vw, 420px);
            padding: 9px 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            background: rgba(5, 6, 6, 0.68);
            color: rgba(255, 255, 255, 0.88);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.02em;
            text-align: center;
            transform: translateX(-50%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
            pointer-events: none;
        }

        body.is-dooh-phone-preview .hint {
            display: none;
        }

        body.is-dooh-phone-preview .base-video {
            filter: brightness(0.96) contrast(1.1) saturate(1.04);
        }

        body.is-dooh-phone-preview .brandbar,
        body.is-dooh-phone-preview .cta,
        body.is-dooh-phone-preview .thanks,
        body.is-dooh-phone-preview .participation-thanks,
        body.is-dooh-phone-preview .supporter-comment-wall,
        body.is-dooh-phone-preview .progress-wrap,
        body.is-dooh-phone-preview .scrim-top {
            display: none !important;
        }

        body.is-dooh-phone-preview .scrim-bottom {
            height: 24vh;
            background: linear-gradient(to top, rgba(5, 6, 6, 0.78), rgba(5, 6, 6, 0));
        }

        body.is-dooh-phone-preview .dock {
            justify-content: flex-start;
            padding: clamp(14px, 3vw, 24px) clamp(16px, 3.6vw, 28px);
        }

        body.is-dooh-phone-preview .live {
            padding: 12px 16px 13px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 18px;
            background: rgba(5, 6, 6, 0.34);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        body.is-dooh-phone-preview .live > .label {
            font-size: clamp(0.64rem, 1.8vw, 0.8rem);
            letter-spacing: 0.18em;
            color: rgba(255, 255, 255, 0.78);
        }

        body.is-dooh-phone-preview .live > .value {
            margin: 4px 0 0;
            font-size: clamp(2.1rem, 10vw, 4rem);
        }

        body.is-dooh-phone-preview .tools {
            top: auto;
            right: max(12px, env(safe-area-inset-right));
            bottom: max(12px, env(safe-area-inset-bottom));
            left: auto;
            width: auto;
            justify-content: flex-end;
            gap: 0;
            padding: 7px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            background: rgba(5, 6, 6, 0.58);
            transform: none;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 16px 46px rgba(0, 0, 0, 0.35);
        }

        body.is-dooh-phone-preview .tools button {
            min-width: auto;
            padding: 10px 16px;
            border-color: rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.9);
            font-size: 13px;
        }

        body.is-dooh-phone-preview .tools button:not(#addBtn) {
            display: none !important;
        }

        @media (orientation: portrait) {
            body.is-dooh-phone-preview::before {
                display: block;
            }

            body.is-dooh-phone-preview .dock {
                padding-bottom: max(72px, calc(env(safe-area-inset-bottom) + 68px));
            }
        }

        @media (orientation: landscape) and (max-height: 540px) {
            body.is-dooh-phone-preview .tools {
                right: max(10px, env(safe-area-inset-right));
                bottom: max(10px, env(safe-area-inset-bottom));
                padding: 7px;
                border-radius: 999px;
            }

            body.is-dooh-phone-preview .tools button {
                padding: 9px 14px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <main class="stage" id="stage" aria-label="新宿インク演出デモ">
        <video
            class="base-layer base-video"
            data-src-desktop="assets/video/karasu.mp4"
            data-src-mobile="assets/video/karasu-mobile.mp4"
            poster="assets/ink/Shinjuku_06_0-00-00-00_1.jpg"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
            aria-hidden="true"
        ></video>
    </main>

    <div class="scrim scrim-top" aria-hidden="true"></div>
    <div class="scrim scrim-bottom" aria-hidden="true"></div>

    <div class="brandbar">
        <div class="brandbar-title">彩宿 — 新宿を彩る</div>
        <div class="hint" id="hint">画面クリック / スペースキー で参加者 +1</div>
    </div>
    <div class="dock">
        <div class="live">
            <div class="participation-thanks" id="participationThanks" aria-live="polite"></div>
            <p class="thanks" id="thanks" aria-hidden="true"></p>
            <section class="supporter-comment-wall" id="supporterCommentWall" aria-live="polite" hidden>
                <span class="supporter-comment-kicker">クラファン支援者からのメッセージ</span>
                <p class="supporter-comment-text" id="supporterCommentText"></p>
                <small class="supporter-comment-name" id="supporterCommentName"></small>
            </section>
            <span class="label">累計参加者</span>
            <span class="value"><span class="unit"></span><span class="num" id="countNum">0人</span></span>
            <div class="progress-wrap">
                <span class="challenge-label" id="challengeLabel">第1回 彩リレー</span>
                <p class="progress-text" id="progressText">あと18人で取り組みが見えてくる</p>
                <p class="transition-countdown" id="transitionCountdown" aria-live="polite"></p>
                <div class="progress-bar"><span id="progressBar"></span></div>
            </div>
        </div>

        <aside class="cta" aria-label="スマホ参加QR案内">
            <div class="cta-copy">
                <strong>スマホで応援に参加</strong>
                <small id="qrCaption">無料の参加アクションで反映</small>
            </div>
            <div class="qr-code" id="qrCode" aria-hidden="true">QR</div>
        </aside>
    </div>

    <div class="url-note" id="urlNote">https://dooh-ca9c2.web.app/men</div>

    <div class="tools">
        <button id="addBtn" type="button">＋ 1人参加</button>
        <button id="completeBtn" type="button" hidden>達成まで進める</button>
        <button id="skipSceneBtn" type="button" hidden>⏭ 次の場面へ</button>
        <button id="newParticipantTestBtn" type="button" hidden>新規参加を再現</button>
        <button id="returningParticipantTestBtn" type="button" hidden>通算2〜7日参加を再現</button>
        <button id="crowdTestBtn" type="button" hidden>50人同時参加を再現</button>
        <button id="resetCheckBtn" type="button" hidden>映像リセット確認</button>
        <button id="emergencyStopBtn" class="is-danger" type="button" hidden>緊急停止</button>
        <button id="autoBtn" type="button">▶ 自動</button>
        <button id="resetBtn" type="button">↺ リセット</button>
    </div>

    <script>
        // 1チャレンジ=18人。飛沫9種×2段階（芯で着弾→広がって完成）で18ステップを構成する
        const TOTAL = 18;
        // ?dev で開くと、Firebase連動中でも手動ツールで動作確認できる（QR不要）
        const params = new URLSearchParams(location.search);
        const DONATION_PER_PERSON_YEN = 100; // 1参加あたりのデモ募金額（publishSwipeComplete の donationAmountYen と一致）
        const DEV = params.has("dev");
        const DEMO_MODE = params.has("demo");
        const DOOH_PHONE_PREVIEW = params.has("phone") || params.has("phone-dooh") || params.has("mobile-dooh");
        const AUTO_COUNT_MODE = params.has("autoCount") || params.has("auto-count") || params.has("autoplay");
        const MANUAL_ONLY_MODE = params.has("manual") || params.has("offline") || AUTO_COUNT_MODE;
        const MOBILE_VIDEO_MODE = DOOH_PHONE_PREVIEW
            || window.matchMedia("(max-width: 900px)").matches
            || window.matchMedia("(pointer: coarse) and (max-width: 1180px)").matches;
        const LIVE_BROADCAST_MODE = params.has("live") || params.has("youtube") || params.has("broadcast");
        const MANUAL_MODE = DEV || DEMO_MODE || DOOH_PHONE_PREVIEW;
        // DEV検証用の人物。支援者(さくら/タクミ/ケンタ)・常連・新規・匿名がひと回りで出る
        const DEV_PERSONAS = [
            { name: "タクミ" },                                        // 支援者・新規
            { name: "ゆうと", isReturning: true, totalDays: 7 },        // 常連7日
            null,                                                      // 匿名
            { name: "さくら", isReturning: true, totalDays: 3 },        // 支援者かつ常連
            { name: "みなみ" },                                        // 新規
            null,                                                      // 匿名
            { name: "ケンタ" },                                        // 支援者
            { name: "あおい", isReturning: true, totalDays: 2 },        // 常連2日
            null,                                                      // 匿名
        ];
        const CONTROL_TOOLS_MODE = DEV || params.has("ops") || params.has("control") || DOOH_PHONE_PREVIEW;
        document.body.classList.toggle("is-manual-mode", CONTROL_TOOLS_MODE);
        document.body.classList.toggle("is-live-broadcast", LIVE_BROADCAST_MODE);
        document.body.classList.toggle("is-dooh-phone-preview", DOOH_PHONE_PREVIEW);
        document.body.classList.toggle("is-mobile-video", MOBILE_VIDEO_MODE);
        const stage = document.getElementById("stage");
        const countNum = document.getElementById("countNum");
        const progressText = document.getElementById("progressText");
        const progressBar = document.getElementById("progressBar");
        const challengeLabel = document.getElementById("challengeLabel");
        const transitionCountdown = document.getElementById("transitionCountdown");
        const hint = document.getElementById("hint");
        const participationThanks = document.getElementById("participationThanks");
        const liveLabel = document.querySelector(".live > .label");
        const liveUnit = document.querySelector(".live > .value .unit");
        const baseVideo = document.querySelector(".base-video");
        if (baseVideo) {
            baseVideo.src = MOBILE_VIDEO_MODE
                ? baseVideo.dataset.srcMobile
                : baseVideo.dataset.srcDesktop;
            baseVideo.load();
        }
        const ctaCopy = document.querySelector(".cta-copy");
        const ctaTitle = document.querySelector(".cta-copy strong");
        const qrCaption = document.getElementById("qrCaption");
        const addBtn = document.getElementById("addBtn");
        const autoBtn = document.getElementById("autoBtn");
        const resetBtn = document.getElementById("resetBtn");
        const completeBtn = document.getElementById("completeBtn");
        const skipSceneBtn = document.getElementById("skipSceneBtn");
        const newParticipantTestBtn = document.getElementById("newParticipantTestBtn");
        const returningParticipantTestBtn = document.getElementById("returningParticipantTestBtn");
        const crowdTestBtn = document.getElementById("crowdTestBtn");
        const resetCheckBtn = document.getElementById("resetCheckBtn");
        const emergencyStopBtn = document.getElementById("emergencyStopBtn");
        const urlNote = document.getElementById("urlNote");

        urlNote?.classList.toggle("is-dev-visible", DEV);
        newParticipantTestBtn.hidden = !CONTROL_TOOLS_MODE;
        returningParticipantTestBtn.hidden = !CONTROL_TOOLS_MODE;
        crowdTestBtn.hidden = !CONTROL_TOOLS_MODE;
        resetCheckBtn.hidden = !CONTROL_TOOLS_MODE;
        emergencyStopBtn.hidden = !CONTROL_TOOLS_MODE;
        if (CONTROL_TOOLS_MODE) {
            completeBtn.hidden = false;
            skipSceneBtn.hidden = false;
        }

        // 飛沫レイヤーを生成（黒地は screen 合成で透過 → 明部だけ累積）
        // 偶数index=芯(XX-core.jpg)、奇数index=完成形(XX.jpg)。完成形が出たら芯は差し替えて消す
        const layers = [];
        for (let i = 1; i <= TOTAL / 2; i++) {
            for (const variant of ["-core", ""]) {
                const img = document.createElement("img");
                img.className = "ink-layer";
                img.alt = "";
                img.decoding = "async";
                img.dataset.shape = String(i - 1);          // 形の番号 0..8
                img.dataset.core = variant === "-core" ? "1" : "";
                stage.appendChild(img);
                layers.push(img);
            }
        }

        // 全飛沫が出揃った最後に重ねる仕上げの一枚
        const finalLayer = document.createElement("img");
        finalLayer.className = "ink-layer final-layer";
        finalLayer.src = "assets/ink/Shinjuku_11.png";
        finalLayer.alt = "";
        finalLayer.decoding = "async";
        stage.appendChild(finalLayer);

        const warmLayer = document.createElement("video");
        warmLayer.className = "ink-layer warm-layer";
        warmLayer.src = MOBILE_VIDEO_MODE
            ? "assets/video/clean-shinjuku-mobile.mp4"
            : "assets/video/clean-shinjuku.mp4";
        warmLayer.muted = true;
        warmLayer.loop = false;
        warmLayer.playsInline = true;
        warmLayer.preload = "auto";
        warmLayer.setAttribute("aria-hidden", "true");
        stage.appendChild(warmLayer);

        const idleLayer = document.createElement("video");
        idleLayer.className = "idle-layer";
        idleLayer.src = "assets/video/yellow-idle.mp4";
        idleLayer.muted = true;
        idleLayer.loop = false;
        idleLayer.playsInline = true;
        idleLayer.preload = "auto";
        idleLayer.setAttribute("aria-hidden", "true");
        stage.appendChild(idleLayer);

        // ============================================================
        // 実行時配置エンジン
        //   飛沫の形は shape-NN.png（切り詰めた透過PNG）。位置と大きさは毎回JSで決める。
        //   窓の中身は「動いている clean 映像」を mask で覗かせる。
        //   ?impact=plate（既定・現行の質感） / ?impact=ink（白いインクが弾ける）
        // ============================================================
        // burst: 中間層なし。窓そのものが飛沫の形に裂けて開く（既定）
        // ink  : 墨が落ちて、消えると窓が残る
        // plate: 回復後の静止画が飛沫の形で一瞬出る（旧実装・比較用）
        const IMPACT_STYLE = (() => {
            const v = new URLSearchParams(location.search).get("impact");
            return ["burst", "ink", "plate"].includes(v) ? v : "burst";
        })();
        const BURST_MS = { core: 420, full: 620 };
        const TARGET_NEW = 0.045;   // 1人ぶん(芯+完成形)で新しく開く面積 / 画面比
        const MIN_DIST = 240;       // 狙い同士の最小距離(フレームpx)
        const SOLVE_W = 240, SOLVE_H = 135;

        const revealVideo = document.createElement("video");
        revealVideo.className = "reveal-video";
        revealVideo.src = warmLayer.src;
        revealVideo.muted = true;
        revealVideo.loop = true;
        revealVideo.playsInline = true;
        revealVideo.preload = "auto";
        revealVideo.setAttribute("aria-hidden", "true");
        stage.insertBefore(revealVideo, warmLayer);
        revealVideo.play().catch(() => {});


        // 映像内の電子広告板（回復後フレームで実測した四隅・フレーム座標1920x1080）
        const BILLBOARD_QUAD = [[1000, 0], [1560, 0], [1555, 235], [1005, 103]];
        const BB_W = 600, BB_H = 190;   // 板のデザイン座標系（この矩形を四隅へ写す）

        // 4点対応から射影変換を解く（8元1次連立をガウス消去）
        function solveHomography(src, dst) {
            const A = [], b = [];
            for (let i = 0; i < 4; i++) {
                const [x, y] = src[i], [u, v] = dst[i];
                A.push([x, y, 1, 0, 0, 0, -x * u, -y * u]); b.push(u);
                A.push([0, 0, 0, x, y, 1, -x * v, -y * v]); b.push(v);
            }
            for (let i = 0; i < 8; i++) {
                let p = i;
                for (let r = i + 1; r < 8; r++) if (Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r;
                [A[i], A[p]] = [A[p], A[i]]; [b[i], b[p]] = [b[p], b[i]];
                for (let r = 0; r < 8; r++) {
                    if (r === i || A[r][i] === 0) continue;
                    const f = A[r][i] / A[i][i];
                    for (let c = i; c < 8; c++) A[r][c] -= f * A[i][c];
                    b[r] -= f * b[i];
                }
            }
            return b.map((v, i) => v / A[i][i]);   // [a,b,c,d,e,f,g,h]
        }

        function billboardMatrix() {
            const [kx, ky] = frameScale();
            const dst = BILLBOARD_QUAD.map(([x, y]) => [x * kx, y * ky]);
            const src = [[0, 0], [BB_W, 0], [BB_W, BB_H], [0, BB_H]];
            const [a, b2, c, d, e, f, g, h] = solveHomography(src, dst);
            return `matrix3d(${a},${d},0,${g}, ${b2},${e},0,${h}, 0,0,1,0, ${c},${f},0,1)`;
        }

        const billboard = document.createElement("div");
        billboard.className = "billboard";
        billboard.style.width = `${BB_W}px`;
        billboard.style.height = `${BB_H}px`;
        billboard.setAttribute("aria-hidden", "true");
        const billboardText = document.createElement("span");
        billboardText.className = "billboard-text";
        const billboardKicker = document.createElement("span");
        billboardKicker.className = "billboard-kicker";
        billboardKicker.textContent = "S U P P O R T E R";
        billboard.append(billboardText, billboardKicker);
        stage.appendChild(billboard);

        let layout = null;
        let shapeImgs = [];      // [i] = {full: Image, core: Image}
        let placements = [];     // [layerIndex] = {url, x, y, w, h, ox, oy}

        const loadImage = (src) =>
            new Promise((res, rej) => {
                const im = new Image();
                im.onload = () => res(im);
                im.onerror = rej;
                im.src = src;
            });

        function weightedPick(map, count, minDist, FW, FH, GX, GY) {
            const cells = [];
            for (let gy = 0; gy < GY; gy++)
                for (let gx = 0; gx < GX; gx++)
                    if (map[gy][gx] > 0.01) cells.push({ gx, gy, w: map[gy][gx] });
            const chosen = [];
            let guard = 0;
            while (chosen.length < count && guard++ < 800) {
                const total = cells.reduce((a, c) => a + c.w, 0);
                if (total <= 0) break;
                let r = Math.random() * total;
                let cell = cells[0];
                for (const c of cells) { r -= c.w; if (r <= 0) { cell = c; break; } }
                const x = (cell.gx + Math.random()) * (FW / GX);
                const y = (cell.gy + Math.random()) * (FH / GY);
                if (chosen.every((c) => Math.hypot(c.x - x, c.y - y) >= minDist)) chosen.push({ x, y });
            }
            // 距離条件で埋まらなければ緩めて補充
            while (chosen.length < count && cells.length) {
                const c = cells[Math.floor(Math.random() * cells.length)];
                chosen.push({ x: (c.gx + 0.5) * (FW / GX), y: (c.gy + 0.5) * (FH / GY) });
            }
            return chosen;
        }

        function planRound() {
            if (!layout) return;
            const [FW, FH] = layout.frame;
            const [GX, GY] = layout.grid;
            const people = weightedPick(layout.peopleMap, 6, MIN_DIST, FW, FH, GX, GY);
            const vines = weightedPick(layout.vineMap, 3, MIN_DIST, FW, FH, GX, GY);

            // 直前に開いた窓からいちばん遠い的を次に選ぶ。
            // 連続スワイプでも窓と名前が画面の反対側に出るので、名前が重なりにくい。
            const pool = [
                ...people.map((t) => ({ ...t, lift: 0.3, kind: "people" })),
                ...vines.map((t) => ({ ...t, lift: 0, kind: "scar" })),
            ];
            const targets = [pool.splice(Math.floor(Math.random() * pool.length), 1)[0]];
            while (pool.length) {
                const prev = targets[targets.length - 1];
                let bi = 0, bd = -1;
                pool.forEach((t, i) => {
                    const d = Math.hypot(t.x - prev.x, t.y - prev.y);
                    if (d > bd) { bd = d; bi = i; }
                });
                targets.push(pool.splice(bi, 1)[0]);
            }
            const order = [...layout.shapes.keys()].sort(() => Math.random() - 0.5);

            // 既に開いた窓を差し引いた正味の新規面積が一定になるよう scale を二分探索
            const cv = document.createElement("canvas");
            cv.width = SOLVE_W; cv.height = SOLVE_H;
            const ctx = cv.getContext("2d", { willReadFrequently: true });
            const sx = SOLVE_W / FW, sy = SOLVE_H / FH;
            const acc = new Uint8Array(SOLVE_W * SOLVE_H);
            const targetPx = TARGET_NEW * SOLVE_W * SOLVE_H;

            const rect = (shape, t, s) => ({
                w: shape.w * s, h: shape.h * s,
                x: t.x - shape.cx * s,
                y: t.y - shape.cy * s - shape.h * s * t.lift,
            });
            const newPixels = (img, shape, t, s) => {
                ctx.clearRect(0, 0, SOLVE_W, SOLVE_H);
                const r = rect(shape, t, s);
                ctx.drawImage(img, r.x * sx, r.y * sy, r.w * sx, r.h * sy);
                const d = ctx.getImageData(0, 0, SOLVE_W, SOLVE_H).data;
                let n = 0;
                for (let i = 0, p = 3; i < acc.length; i++, p += 4)
                    if (d[p] > 128 && !acc[i]) n++;
                return n;
            };
            const commit = (img, shape, t, s) => {
                ctx.clearRect(0, 0, SOLVE_W, SOLVE_H);
                const r = rect(shape, t, s);
                ctx.drawImage(img, r.x * sx, r.y * sy, r.w * sx, r.h * sy);
                const d = ctx.getImageData(0, 0, SOLVE_W, SOLVE_H).data;
                for (let i = 0, p = 3; i < acc.length; i++, p += 4) if (d[p] > 128) acc[i] = 1;
            };

            placements = [];
            targets.forEach((t, j) => {
                const si = order[j];
                const shape = layout.shapes[si];
                let lo = 0.05, hi = 2.6;
                for (let it = 0; it < 14; it++) {
                    const mid = (lo + hi) / 2;
                    if (newPixels(shapeImgs[si].full, shape, t, mid) < targetPx) lo = mid; else hi = mid;
                }
                const s = hi;
                const r = rect(shape, t, s);
                commit(shapeImgs[si].core, shape, t, s);
                commit(shapeImgs[si].full, shape, t, s);
                const kind = t.kind;
                for (const which of ["core", "full"]) {
                    const k = which === "core" ? 0.62 : 1;       // 芯は同じ形の小さい版
                    const w = r.w * k, h = r.h * k;
                    placements.push({
                        url: shapeImgs[si][which].src,
                        x: r.x + (r.w - w) / 2, y: r.y + (r.h - h) / 2, w, h,
                        ox: (t.x / FW) * 100, oy: (t.y / FH) * 100,
                        kind,
                    });
                }
            });
            lastMaskCss = "__replan__";
        }

        const frameScale = () => {
            const [FW, FH] = layout.frame;
            return [stage.clientWidth / FW, stage.clientHeight / FH];
        };

        // entries: [{ p, k }] k=飛沫の倍率(burst演出で1未満から跳ねる)。中心を保って拡縮する
        function maskCssFor(entries) {
            const [kx, ky] = frameScale();
            const rect = ({ p, k = 1 }) => {
                const w = p.w * k, h = p.h * k;
                const x = p.x + (p.w - w) / 2, y = p.y + (p.h - h) / 2;
                return [x * kx, y * ky, w * kx, h * ky];
            };
            return {
                image: entries.map((e) => `url("${e.p.url}")`).join(", "),
                position: entries.map((e) => { const r = rect(e); return `${r[0].toFixed(1)}px ${r[1].toFixed(1)}px`; }).join(", "),
                size: entries.map((e) => { const r = rect(e); return `${r[2].toFixed(1)}px ${r[3].toFixed(1)}px`; }).join(", "),
            };
        }

        // 開いた窓の跳ね。0.55 → 1.06 → 1.0
        const burstAt = new Map();
        const easeOut = (u) => 1 - (1 - u) * (1 - u);
        function burstScale(i) {
            const rec = burstAt.get(i);
            if (!rec) return 1;
            const t = (performance.now() - rec.start) / rec.dur;
            if (t >= 1) { burstAt.delete(i); return 1; }
            if (t < 0.55) return 0.55 + (1.06 - 0.55) * easeOut(t / 0.55);
            return 1.06 + (1.0 - 1.06) * easeOut((t - 0.55) / 0.45);
        }

        const IMPACT_NAME_TTL_MS = 2000;   // これより古い名前は飛沫に付けない
        let impactName = null;
        window.__setImpactName = (n, options = {}) => {
            const raw = String(n ?? "").trim();
            if (raw && raw !== "匿名サポーター") impactName = { raw, options, at: Date.now() };
        };

        // 参加イベントは名前しか運ばない。支援者コメントは別フィードなので名前で突き合わせる
        function supporterCommentFor(name) {
            const hit = supporterCommentRotation.find((e) => e?.name === name && e?.comment);
            return hit ? hit.comment : "";
        }

        function takeImpactMeta() {
            if (!impactName || Date.now() - impactName.at > IMPACT_NAME_TTL_MS) return null;
            const meta = impactName;
            impactName = null;
            return meta;
        }

        // QR・カウンター・タイトル・DEV操作パネルの上に名前を出さない
        const HUD_SELECTORS = [".cta", ".dock .live", ".brandbar", ".supporter-comment-wall", ".tools"];

        function hudRects() {
            return HUD_SELECTORS.flatMap((sel) => [...document.querySelectorAll(sel)])
                .filter((el) => el.offsetParent !== null || getComputedStyle(el).display !== "none")
                .map((el) => el.getBoundingClientRect())
                .filter((r) => r.width > 0 && r.height > 0);
        }

        // 表示中の他の名前も障害物にする。これで名前どうしは絶対に重ならない
        function blockerRects(exclude) {
            return hudRects().concat(
                activeNames.filter((n) => n !== exclude).map((n) => n.getBoundingClientRect())
            );
        }

        // 名前は出現時に自分の高さの±12%ぶん上下に跳ねる。その振れ幅を余白で吸収する
        const overlaps = (a, b, pad = 28) =>
            a.left < b.right + pad && a.right > b.left - pad &&
            a.top < b.bottom + pad && a.bottom > b.top - pad;

        function placeNameAvoidingHud(el, ox, oy) {
            const blockers = blockerRects(el);
            const put = (x, y) => {
                el.style.left = `${x}%`;
                el.style.top = `${y}%`;
                return el.getBoundingClientRect();
            };
            const clampX = (x) => Math.min(78, Math.max(22, x));
            const clampY = (y) => Math.min(82, Math.max(16, y));   // 上端に張り付かせない
            const free = (r) => !blockers.some((b) => overlaps(r, b));

            const x0 = clampX(ox), y0 = clampY(oy);
            if (free(put(x0, y0))) return;

            // 元の着弾点にいちばん近い空き場所を探す（方向に優先順位をつけない）
            let best = null;
            for (let d = 6; d <= 44; d += 6) {
                for (let deg = 0; deg < 360; deg += 30) {
                    const rad = (deg * Math.PI) / 180;
                    const x = clampX(x0 + Math.cos(rad) * d * 1.35);   // 横は少し広く探る
                    const y = clampY(y0 + Math.sin(rad) * d);
                    if (!free(put(x, y))) continue;
                    const dist = Math.hypot(x - x0, y - y0);
                    if (!best || dist < best.dist) best = { x, y, dist };
                }
                if (best) break;   // 半径が近い順に探しているので最初に見つかった環で確定
            }
            if (best) { put(best.x, best.y); return true; }
            put(50, 34);
            return false;   // 空きがなかった
        }

        const activeNames = [];
        const MAX_NAMES = 3;   // 同時に立てる名前の上限

        function dismissName(el, fast = true) {
            const i = activeNames.indexOf(el);
            if (i >= 0) activeNames.splice(i, 1);
            el.getAnimations().forEach((a) => a.cancel());
            el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: fast ? 180 : 400, fill: "forwards" })
                .finished.then(() => el.remove()).catch(() => el.remove());
        }

        function showImpactName(p, meta) {
            if (!meta) return;
            const { raw, options } = meta;
            while (activeNames.length >= MAX_NAMES) dismissName(activeNames[0]);
            const el = document.createElement("div");
            el.className = "impact-name";
            // 常連は「おかえりなさい」＋通算日数の色。従来ピルが持っていた情報をここへ移す
            const returning = options?.isReturning === true && hasStreakColor(options);
            el.classList.toggle("is-returning", returning);
            if (returning) applyStreakClass(el, options);

            const comment = supporterCommentFor(raw);
            el.classList.toggle("is-supporter", Boolean(comment));
            if (comment) {
                const badge = document.createElement("span");
                badge.className = "impact-badge";
                badge.textContent = "支 援 者";
                el.appendChild(badge);
            }
            const line = document.createElement("span");
            line.textContent = returning ? `おかえりなさい、${raw}さん` : `${raw}さん`;
            el.appendChild(line);
            if (comment) {
                const c = document.createElement("span");
                c.className = "impact-comment";
                c.textContent = comment;
                el.appendChild(c);
            }
            stage.appendChild(el);
            activeNames.push(el);
            if (!placeNameAvoidingHud(el, p.ox, p.oy - 7)) {
                // どこにも置けない＝古い名前が塞いでいる。いちばん古いのを畳んでやり直す
                if (activeNames.length > 1) {
                    dismissName(activeNames[0]);
                    placeNameAvoidingHud(el, p.ox, p.oy - 7);
                }
            }
            el.animate(
                [
                    { opacity: 0, transform: "translate(-50%, -35%) scale(0.86)", offset: 0 },
                    { opacity: 1, transform: "translate(-50%, -50%) scale(1)", offset: 0.16 },
                    { opacity: 1, transform: "translate(-50%, -50%) scale(1)", offset: 0.76 },
                    { opacity: 0, transform: "translate(-50%, -62%) scale(1.02)", offset: 1 },
                ],
                { duration: comment ? 5200 : 2800, easing: "cubic-bezier(0.22, 1, 0.36, 1)", fill: "forwards" }
            ).finished
                .then(() => {
                    const i = activeNames.indexOf(el);
                    if (i >= 0) activeNames.splice(i, 1);
                    el.remove();
                })
                .catch(() => el.remove());
        }

        function billboardFlash(name) {
            if (!name || stage.classList.contains("is-complete")) return;
            billboardText.textContent = name;
            billboard.style.transform = billboardMatrix();
            billboard.classList.remove("is-flash", "is-lit");
            void billboard.offsetWidth;
            billboard.classList.add("is-flash");
        }

        // 同じ形を2枚重ね、内側を数px縮めて引き算する = 輪郭だけが残る
        function spawnOutline(p) {
            const el = document.createElement("div");
            el.className = "ink-outline";
            const [kx, ky] = frameScale();
            const w = p.w * kx, h = p.h * ky, x = p.x * kx, y = p.y * ky;
            const t = 3;  // 線の太さ(px)
            const image = `url("${p.url}"), url("${p.url}")`;
            const size = `${w.toFixed(1)}px ${h.toFixed(1)}px, ${(w - 2 * t).toFixed(1)}px ${(h - 2 * t).toFixed(1)}px`;
            const pos = `${x.toFixed(1)}px ${y.toFixed(1)}px, ${(x + t).toFixed(1)}px ${(y + t).toFixed(1)}px`;
            for (const k of ["webkitMaskImage", "maskImage"]) el.style[k] = image;
            for (const k of ["webkitMaskSize", "maskSize"]) el.style[k] = size;
            for (const k of ["webkitMaskPosition", "maskPosition"]) el.style[k] = pos;
            // mask-image の先頭が最前面。演算子は「自分より下の層」に対して適用される。
            // したがって「大きい形 subtract 小さい形」= 輪郭。順序を逆にすると塗りつぶしになる。
            el.style.maskComposite = "subtract, add";
            el.style.transformOrigin = `${p.ox}% ${p.oy}%`;
            stage.insertBefore(el, warmLayer);

            el.animate(
                [
                    { opacity: 0, transform: "scale(0.97)", offset: 0 },
                    { opacity: 0.95, transform: "scale(1.01)", offset: 0.18 },
                    { opacity: 0.55, transform: "scale(1)", offset: 0.4 },
                    { opacity: 0, transform: "scale(1.03)", offset: 1 },
                ],
                { duration: 1100, easing: "cubic-bezier(0.22, 1, 0.36, 1)", fill: "forwards" }
            ).finished.then(() => el.remove()).catch(() => el.remove());
        }

        function spawnImpact(layerIndex) {
            const p = placements[layerIndex];
            if (!p) return;
            const meta = takeImpactMeta();
            const isSupporter = Boolean(meta?.raw && supporterCommentFor(meta.raw));
            if (meta) showImpactName(p, meta);
            else spawnOutline(p);
            if (isSupporter && meta?.raw) billboardFlash(meta.raw);

            if (IMPACT_STYLE === "burst") {
                // 中間層を作らない。窓そのものを跳ねさせる
                burstAt.set(layerIndex, {
                    start: performance.now(),
                    dur: layerIndex % 2 === 0 ? BURST_MS.core : BURST_MS.full,
                });
                return;
            }

            const el = document.createElement("div");
            el.className = `ink-impact is-${IMPACT_STYLE}`;
            // 常連なら、落ちるインクをその人の色に染める。支援者なら金にする
            if (meta?.options?.isReturning === true && hasStreakColor(meta.options)) {
                el.classList.add("is-streak");
                applyStreakClass(el, meta.options);
            }
            if (isSupporter && IMPACT_STYLE === "plate") el.classList.add("is-supporter");
            const css = maskCssFor([{ p, k: 1 }]);
            for (const prop of ["webkitMaskImage", "maskImage"]) el.style[prop] = css.image;
            for (const prop of ["webkitMaskPosition", "maskPosition"]) el.style[prop] = css.position;
            for (const prop of ["webkitMaskSize", "maskSize"]) el.style[prop] = css.size;
            el.style.transformOrigin = `${p.ox}% ${p.oy}%`;
