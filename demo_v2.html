        function renderDonorTicker(priorityEntry = null) {
            if (!thanks || donorNameRotation.length === 0) {
                thanks?.replaceChildren();
                return;
            }

            const orderedEntriesWithDuplicates = priorityEntry
                ? [priorityEntry, ...donorNameRotation.filter((entry) => entry !== priorityEntry)]
                : donorNameRotation;
            const seenNames = new Set();
            const entries = orderedEntriesWithDuplicates.filter((entry) => {
                const normalizedName = String(entry?.name ?? "").trim();
                if (!normalizedName || seenNames.has(normalizedName)) return false;
                seenNames.add(normalizedName);
                return true;
            });
            const track = document.createElement("span");
            track.className = "thanks-track";
            track.style.setProperty("--ticker-duration", `${Math.max(24, entries.length * 2.1)}s`);

            for (let i = 0; i < 2; i += 1) {
                const group = document.createElement("span");
                group.className = "thanks-group";
                appendTickerItems(group, entries, priorityEntry);
                track.appendChild(group);
            }
            thanks.replaceChildren(track);
        }

        function resumeDonorTicker() {
            if (donorNameRotation.length === 0) return;
            renderDonorTicker();
        }

        function processNameNotificationQueue() {
            if (nameNotificationTimer || nameNotificationQueue.length === 0) return;
            const next = nameNotificationQueue.shift();
            latestDonorEntry = next;
            renderDonorTicker(latestDonorEntry);
            nameNotificationTimer = window.setTimeout(() => {
                nameNotificationTimer = null;
                latestDonorEntry = null;
                renderDonorTicker();
                processNameNotificationQueue();
            }, NAME_NOTIFICATION_MS);
        }

        function showThanks(name, options = {}) {
            if (LIVE_BROADCAST_MODE) {
                showParticipationThanks("", options);
                return;
            }
            const raw = String(name ?? "").trim().slice(0, 24);
            if (!isRealName(raw)) return;
            const swipeEventId = String(options?.swipeEventId ?? "").trim();
            const swipeCount = Math.floor(Number(options?.swipeCount));
            const effectKey = swipeEventId
                ? `swipe:${swipeEventId}`
                : `name:${raw}:${Number.isFinite(swipeCount) ? swipeCount : ""}`;
            const now = Date.now();
            const previousEffectAt = recentNameEffectAt.get(effectKey) ?? 0;
            if (now - previousEffectAt < NAME_EFFECT_DEDUPE_MS) return;
            recentNameEffectAt.set(effectKey, now);
            for (const [key, createdAt] of recentNameEffectAt) {
                if (now - createdAt >= NAME_EFFECT_DEDUPE_MS) recentNameEffectAt.delete(key);
            }
            // 新着名は最初にインク（支援者は電子看板も）へ出し、消えてから名前ロールへ移す。
            // 同じ名前が同時に2人いるように見える状態を防ぐ。
            relightParticipation(raw, options);
            showSupporterCommentForParticipant(raw, options);
            window.setTimeout(() => {
                const entry = addToDonorNameRotation(raw, options);
                nameNotificationQueue.push(entry);
                if (nameNotificationQueue.length > 120) {
                    nameNotificationQueue.splice(0, nameNotificationQueue.length - 120);
                }
                renderDonorTicker(latestDonorEntry);
                processNameNotificationQueue();
            }, NAME_TO_TICKER_DELAY_MS);
        }

        function setDonorNameRotation(names) {
            donorNameRotation.length = 0;
            latestDonorEntry = null;
            window.clearTimeout(nameNotificationTimer);
            nameNotificationTimer = null;
            nameNotificationQueue.length = 0;
            if (LIVE_BROADCAST_MODE) {
                thanks?.replaceChildren();
                return;
            }
            names.forEach((entry) => {
                const raw = String(entry?.name ?? entry ?? "").trim().slice(0, 24);
                if (isRealName(raw)) addToDonorNameRotation(raw, entry);
            });
            renderDonorTicker();
        }

        function removeParticipationThanksItem(item) {
            if (!item?.isConnected || item.classList.contains("is-leaving")) return;
            item.classList.add("is-leaving");
            window.setTimeout(() => item.remove(), 480);
        }

        function renderParticipationThanks(name, options = {}) {
            if (!participationThanks) return;
            const raw = String(name ?? "").trim().slice(0, 24);
            const liveBroadcastText = "応援アクションが届きました";
            const isReturning = options.isReturning === true;
            const shouldColorReturning = isReturning && hasStreakColor(options);
            const item = document.createElement("div");
            item.className = "participation-thanks-item";
            item.classList.toggle("is-returning", shouldColorReturning);
            applyStreakClass(item, options);
            applyStreakClass(stage, options);
            item.textContent = LIVE_BROADCAST_MODE
                ? liveBroadcastText
                : isRealName(raw)
                    ? `${raw}さん、ご参加ありがとうございます`
                    : "ご参加ありがとうございます";
            participationThanks.appendChild(item);
            const visibleItems = [...participationThanks.children]
                .filter((child) => !child.classList.contains("is-leaving"));
            if (visibleItems.length > PARTICIPATION_STACK_MAX_VISIBLE) {
                removeParticipationThanksItem(visibleItems[0]);
            }
            stage.classList.remove("is-returning-pulse");
            if (shouldColorReturning) {
                void stage.offsetWidth;
                stage.classList.add("is-returning-pulse");
                window.setTimeout(() => stage.classList.remove("is-returning-pulse"), 2700);
            }
            window.setTimeout(() => removeParticipationThanksItem(item), PARTICIPATION_STACK_VISIBLE_MS);
        }

        function processParticipationStackQueue() {
            if (participationStackTimer || participationStackQueue.length === 0) return;
            const next = participationStackQueue.shift();
            renderParticipationThanks(next.name, next.options);
            participationStackTimer = window.setTimeout(() => {
                participationStackTimer = null;
                processParticipationStackQueue();
            }, PARTICIPATION_STACK_ARRIVAL_MS);
        }

        function showParticipationThanks(name, options = {}) {
            // 着弾エフェクトへ名前を渡す。購読が二重に発火してもズレないよう
            // 「直近の1件だけ・鮮度つき」で持つ（FIFOだとイベント数と飛沫数がずれる）
            if (options?.skipImpact !== true) {
                window.__setImpactName?.(name, options);
            }
            showSupporterCommentForParticipant(name);
            participationStackQueue.push({ name, options });
            if (participationStackQueue.length > 120) {
                participationStackQueue.splice(0, participationStackQueue.length - 120);
            }
            processParticipationStackQueue();
        }

        function normalizeSupporterCommentForDisplay(entry = {}) {
            const comment = String(entry?.comment ?? "").trim().slice(0, 60);
            const name = String(entry?.name ?? "").trim().slice(0, 24);
            if (!comment) {
                return null;
            }
            return {
                comment,
                name: isRealName(name) ? name : "",
                swipeEventId: String(entry?.swipeEventId ?? "").trim(),
                swipeCount: Math.max(0, Math.floor(Number(entry?.swipeCount) || 0)),
                createdAt: Number(entry?.createdAt) || 0,
                id: String(entry?.id ?? entry?.codeHash ?? comment),
            };
        }

        function renderSupporterComment(priorityEntry = null) {
            if (!supporterCommentWall || !supporterCommentText || supporterCommentRotation.length === 0) {
                if (supporterCommentWall) supporterCommentWall.hidden = true;
                return;
            }

            let entry = priorityEntry;
            if (!entry) {
                const next = window.SupporterCommentRotation.takeNext(supporterCommentFairState);
                supporterCommentFairState = next.state;
                entry = next.entry;
                supporterCommentRotation.length = 0;
                supporterCommentRotation.push(...supporterCommentFairState.order);
                supporterCommentIndex = Math.max(0, supporterCommentFairState.cursor - 1);
                saveSupporterCommentRotationState();
            } else {
                supporterCommentIndex = Math.max(0, supporterCommentRotation.findIndex((item) => item.id === entry.id));
            }
            if (!entry) return;
            supporterCommentText.textContent = entry.comment;
            supporterCommentName.textContent = entry.name ? `${entry.name}さんより` : "";
            supporterCommentWall.hidden = false;
            supporterCommentWall.classList.remove("is-switching");
            void supporterCommentWall.offsetWidth;
            supporterCommentWall.classList.add("is-switching");
        }

        function startSupporterCommentTicker() {
            if (supporterCommentTimer) {
                window.clearInterval(supporterCommentTimer);
                supporterCommentTimer = null;
            }
            if (supporterCommentRotation.length === 0) {
                if (supporterCommentWall) supporterCommentWall.hidden = true;
                return;
            }
            renderSupporterComment();
            if (supporterCommentRotation.length > 1) {
                supporterCommentTimer = window.setInterval(() => {
                    // 画面に出ていない間は順番を進めない（見えない秒で持ち時間を消費させない）
                    const visible = document.body.classList.contains("supporter-comment-history-active");
                    if (!visible) return;
                    renderSupporterComment();
                }, SUPPORTER_COMMENT_ROTATION_MS);
            }
        }

        function syncSupporterCommentHistory(active) {
            const shouldShow = Boolean(
                active &&
                !idleVideoActive &&
                supporterCommentRotation.length > 0 &&
                !document.body.classList.contains("supporter-comment-active")
            );
            const wasShowing = document.body.classList.contains("supporter-comment-history-active");
            document.body.classList.toggle("supporter-comment-history-active", shouldShow);
            if (shouldShow && !wasShowing) {
                startSupporterCommentTicker();
            } else if (!shouldShow && wasShowing && supporterCommentWall) {
                supporterCommentWall.hidden = true;
            }
        }

        function setSupporterComments(comments = []) {
            supporterCommentRotation.length = 0;
            if (LIVE_BROADCAST_MODE) {
                supporterCommentIndex = 0;
                if (supporterCommentWall) supporterCommentWall.hidden = true;
                return;
            }
            const normalized = comments
                .map(normalizeSupporterCommentForDisplay)
                .filter(Boolean)
                .sort((a, b) => b.createdAt - a.createdAt || b.id.localeCompare(a.id));
            supporterCommentFairState = window.SupporterCommentRotation.reconcile(
                supporterCommentFairState,
                normalized
            );
            supporterCommentRotation.push(...supporterCommentFairState.order);
            supporterCommentIndex = Math.max(0, supporterCommentFairState.cursor - 1);
            saveSupporterCommentRotationState();
            if (supporterCommentWall) supporterCommentWall.hidden = true;
            renderDonorTicker(latestDonorEntry);
            syncSupporterCommentHistory(
                document.body.classList.contains("is-quiet") && !idleVideoActive,
            );
            if (pendingSupporterCommentRequest) {
                if (Date.now() <= pendingSupporterCommentRequest.expiresAt) {
                    showSupporterCommentForParticipant(
                        pendingSupporterCommentRequest.name,
                        pendingSupporterCommentRequest.options,
                    );
                } else {
                    pendingSupporterCommentRequest = null;
                }
            }
        }

        function showSupporterCommentForParticipant(name, options = {}) {
            const normalizedName = String(name ?? "").trim().slice(0, 24);
            const swipeEventId = String(options?.swipeEventId ?? "").trim();
            const index = supporterCommentRotation.findIndex(
                (entry) => entry?.comment && (
                    (swipeEventId && entry?.swipeEventId === swipeEventId) ||
                    (!swipeEventId && normalizedName && entry?.name === normalizedName)
                )
            );
            if (index < 0) {
                if (options?.isSupporter === true && (swipeEventId || normalizedName)) {
                    pendingSupporterCommentRequest = {
                        name: normalizedName,
                        options: { ...options, swipeEventId },
                        expiresAt: Date.now() + SUPPORTER_COMMENT_WAIT_MS,
                    };
                }
                return false;
            }
            pendingSupporterCommentRequest = null;
            supporterCommentIndex = index;
            renderSupporterComment(supporterCommentRotation[index]);
            document.body.classList.add("supporter-comment-active");
            window.clearTimeout(supporterEventTimer);
            supporterEventTimer = window.setTimeout(() => {
                document.body.classList.remove("supporter-comment-active");
                if (supporterCommentWall) supporterCommentWall.hidden = true;
            }, SUPPORTER_COMMENT_ROTATION_MS);
            return true;
        }

        // カウントを軽く弾ませてライブ感を出す
        function pulseCount() {
            countNum.animate(
                [
                    { transform: "scale(1)" },
                    { transform: "scale(1.16)", offset: 0.3 },
                    { transform: "scale(1)" },
                ],
                { duration: 650, easing: "cubic-bezier(0.18, 1.2, 0.32, 1)" }
            );
        }

        // 飛沫を1つ飛ばす（人数カウントとは独立）
        function triggerSplat(options = {}) {
            if (!options.force && celebrationActive) {
                queuedRevealCount += 1;
                splat(finalLayer);
                return;
            }
            if (!options.force && completionNameGraceTimer) {
                queuedRevealCount += 1;
                splat(finalLayer);
                return;
            }
            if (!options.force && queuedReplayHoldTimer) {
                queuedRevealCount += 1;
                return;
            }

            if (revealed < TOTAL) {
                // 次の飛沫を飛び散らせて新しい範囲を出す
                const el = layers[revealed];
                el.classList.add("is-revealed");
                if (revealed % 2 === 1) {
                    // 完成形が出たら同じ飛沫の芯は差し替えて消す（screen二重合成で白飛びするため）
                    layers[revealed - 1].classList.remove("is-revealed");
                }
                splat(el);
                revealed += 1;
                if (revealed >= TOTAL) {
                    // 最後のスワイプへ名前を後付けできる猶予を置いてから完成映像へ進む。
                    startPendingCompletion();
                }
                updateHud(); // 進捗バー/テキストを飛沫ごとに更新（ライブ連動の連続表示にも対応）
            } else {
                // 全点灯後も参加するたびに既存の飛沫（完成形）を弾けさせて反応させる
                splat(layers[Math.floor(Math.random() * (TOTAL / 2)) * 2 + 1]);
            }
        }

        // 手動トリガー（オフラインデモ用）。Firebase連動中は無効。
        function addParticipant() {
            if (liveActive && !MANUAL_MODE) return;
            noteParticipationActivity();
            const persona = DEV ? createRandomDevPersona() : null;
            count += 1;
            triggerSplat();
            updateHud();
            pulseCount();
            if (persona) {
                showThanks(persona.name, {
                    ...persona,
                    swipeCount: count,
                    createdAt: Date.now(),
                });
            } else {
                showParticipationThanks();
            }
            if (hint && count === 1) hint.style.opacity = "0";
        }

        function completeCurrentChallenge() {
            if (celebrationActive) {
                return;
            }

            noteParticipationActivity();
            const remaining = Math.max(1, TOTAL - revealed);
            count += remaining;
            for (let i = 0; i < remaining; i += 1) {
                triggerSplat();
            }
            updateHud();
            pulseCount();
        }

        // 飛沫の出方を target 枚に合わせる（実カウントのリセット/巻き戻し対応）
        function rebuildReveal(target) {
            revealed = Math.max(0, Math.min(TOTAL, target));
            layers.forEach((el, i) => {
                el.getAnimations().forEach((a) => a.cancel());
                // 芯(偶数index)は「最新ステップのときだけ」表示。完成形(奇数index)は出たら残る
                const visible = i % 2 === 0 ? i === revealed - 1 : i < revealed;
                el.classList.toggle("is-revealed", visible);
            });
            finalLayer.getAnimations().forEach((a) => a.cancel());
            finalLayer.classList.toggle("is-revealed", revealed >= TOTAL || celebrationActive);
            finalLayer.style.opacity = revealed >= TOTAL || celebrationActive ? "" : "0";
        }

        // Firebaseの実カウントを反映：増えた分だけ飛沫を飛ばす
        function applyLiveCount(next, options = {}) {
            const n = Math.max(0, Number(next) || 0);
            const delta = n - count;
            recordDemoEvent("live-count", { next: n, delta });
            // DEVモードでは手動操作中の表示を、低い/同値のライブ値で巻き戻さない
            if (MANUAL_MODE && delta <= 0) return;

            if (delta > 0) {
                noteParticipationActivity();
            }

            // 初回同期は基本的に過去の参加を再演せず、累計人数から現在の回と進捗を直接復元する。
            // ただし「直近の参加でちょうど18人達成した」ケースは、DOOH側の接続遅れや再読み込みで
            // 達成演出を取り逃がすため、一度だけ完成映像を再生する。
            if (!liveCountInitialized) {
                liveCountInitialized = true;
                count = n;
                visualizedLiveCount = n;
                clearCelebrationTimers();
                celebrationActive = false;
                setSceneFocus(false);
                celebrationStartedAt = 0;
                activeChallengeNumber = 0;
                warmLayer.classList.remove("is-revealed");
                finalLayer.classList.remove("is-revealed");
                rebuildReveal(n % TOTAL);
                updateHud();
                if (options.replayInitialCompletion === true && n > 0 && n % TOTAL === 0) {
                    window.setTimeout(() => {
                        if (!celebrationActive && count === n) {
                            startCelebration();
                        }
                    }, 450);
                }
                return;
            }

            count = n;

            if (delta > 0) {
                pulseCount();
                if (!liveVisualTimer) {
                    liveVisualTimer = window.setInterval(() => {
                        if (visualizedLiveCount >= count) {
                            window.clearInterval(liveVisualTimer);
                            liveVisualTimer = null;
                            if (hint && !DEV) hint.textContent = "● LIVE — 参加証投影中";
                            return;
                        }
                        if (celebrationActive || completionNameGraceTimer || queuedReplayHoldTimer) {
                            if (hint && !DEV) {
                                const pending = Math.max(0, count - visualizedLiveCount);
                                hint.textContent = pending > 0
                                    ? `● LIVE — あと${pending}人の参加を待機中`
                                    : "● LIVE — 参加証投影中";
                            }
                            return;
                        }
                        visualizedLiveCount += 1;
                        triggerSplat();
                        if (hint && !DEV) {
                            const pending = Math.max(0, count - visualizedLiveCount);
                            hint.textContent = pending > 0
                                ? `● LIVE — あと${pending}人の参加を順番に反映中`
                                : "● LIVE — 参加証投影中";
                        }
                    }, LIVE_REVEAL_INTERVAL_MS);
                }
            } else if (delta < 0) {
                if (liveVisualTimer) window.clearInterval(liveVisualTimer);
                liveVisualTimer = null;
                visualizedLiveCount = n;
                queuedRevealCount = 0;
                clearQueuedReplayTimer();
                clearCelebrationTimers();
                celebrationActive = false;
                setSceneFocus(false);
                celebrationStartedAt = 0;
                activeChallengeNumber = 0;
                warmLayer.classList.remove("is-revealed");
                try {
                    warmLayer.pause();
                    warmLayer.currentTime = 0;
                } catch {}
                rebuildReveal(n % TOTAL); // サーバ側でカウントがリセットされた場合
            }

            updateHud();
        }

        // 連動開始：手動ツールを隠して実カウント主導に切り替え
        function activateLive() {
            if (liveActive) return;
            liveActive = true;
            if (!DEV && autoTimer) {
                clearInterval(autoTimer);
                autoTimer = null;
            }
            if (!CONTROL_TOOLS_MODE) document.querySelector(".tools")?.style.setProperty("display", "none");
            if (hint) {
                hint.textContent = DEV
                    ? "● LIVE（DEV：手動 / 📡本番+1 で確認）"
                    : "● LIVE — 参加証投影中";
                hint.style.opacity = "1";
            }
        }

        function clearOperationTimers() {
            if (resetCheckTimer) window.clearTimeout(resetCheckTimer);
            if (resetCheckAddTimer) window.clearInterval(resetCheckAddTimer);
            if (crowdTestTimer) window.clearInterval(crowdTestTimer);
            resetCheckTimer = null;
            resetCheckAddTimer = null;
            crowdTestTimer = null;
        }

        function setOperationStatus(message) {
            if (!hint || !message) return;
            hint.textContent = message;
            hint.style.opacity = "1";
        }

        function returnVisualToWaitingState({
            resetCount = false,
            resetLiveState = false,
            message = "映像を待機状態に戻しました",
        } = {}) {
            clearOperationTimers();
            if (autoTimer) {
                clearInterval(autoTimer);
                autoTimer = null;
                autoBtn.classList.remove("is-on");
                autoBtn.textContent = "▶ 自動";
            }
            if (liveVisualTimer) window.clearInterval(liveVisualTimer);
            liveVisualTimer = null;
            clearQueuedReplayTimer();
            clearCelebrationTimers();
            clearIdleVideoTimers();
            if (resetCount) {
                count = 0;
            }
            liveCountInitialized = resetLiveState ? false : liveCountInitialized;
            visualizedLiveCount = count;
            queuedRevealCount = 0;
            setIdleVideoMode(false);
            celebrationActive = false;
            setSceneFocus(false);
            celebrationStartedAt = 0;
            activeChallengeNumber = 0;
            layers.forEach((el) => {
                el.getAnimations().forEach((a) => a.cancel());
                el.classList.remove("is-revealed");
            });
            finalLayer.getAnimations().forEach((a) => a.cancel());
            finalLayer.classList.remove("is-revealed");
            finalLayer.style.opacity = "0";
            warmLayer.classList.remove("is-revealed");
            idleLayer.classList.remove("is-visible");
            try {
                warmLayer.pause();
                warmLayer.currentTime = 0;
                idleLayer.pause();
                idleLayer.currentTime = 0;
            } catch {}
            rebuildReveal(0);
            keepBaseVideoMoving();
            updateHud();
            scheduleIdleVideo();
            setOperationStatus(message);
        }

        function reset() {
            returnVisualToWaitingState({
                resetCount: true,
                resetLiveState: true,
                message: "リセットしました。画面クリック / スペースキー で参加者 +1",
            });
        }

        function stopAutoCountDemo() {
            if (!autoTimer) return;
            clearInterval(autoTimer);
            autoTimer = null;
            autoBtn.classList.remove("is-on");
            autoBtn.textContent = "▶ 自動";
        }

        function startAutoCountDemo({ immediate = true } = {}) {
            if (autoTimer) return;
            autoBtn.classList.add("is-on");
            autoBtn.textContent = "⏸ 停止";
            if (AUTO_COUNT_MODE && hint) {
                hint.textContent = `● AUTO DEMO — ${Math.round(AUTO_COUNT_INTERVAL_MS / 100) / 10}秒ごとに自動参加`;
                hint.style.opacity = "1";
            }
            if (immediate) addParticipant();
            autoTimer = setInterval(addParticipant, AUTO_COUNT_INTERVAL_MS);
        }

        function toggleAuto() {
            if (autoTimer) {
                stopAutoCountDemo();
                return;
            }
            startAutoCountDemo();
        }

        // 操作：ステージのどこでも参加 +1。配信モードでは視聴用画面なので無効化する。
        if (!LIVE_BROADCAST_MODE) {
            stage.addEventListener("click", addParticipant);
        }

        addBtn.addEventListener("click", (e) => { e.stopPropagation(); addParticipant(); });
        completeBtn.addEventListener("click", (e) => { e.stopPropagation(); completeCurrentChallenge(); });
        skipSceneBtn.addEventListener("click", (e) => { e.stopPropagation(); skipScene(); });
        newParticipantTestBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            const testNames = ["タクヤ", "ミナ", "はる", "あおい"];
            showThanks(testNames[donorNameTestIndex % testNames.length], { isReturning: false, streakDays: 1, totalDays: 1 });
            donorNameTestIndex += 1;
        });
        let returningParticipantTestDay = 2;
        returningParticipantTestBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            showThanks("さくら", {
                isReturning: true,
                // 連続ではなく通算日数で色が進むことを確認するため streak はリセット相当にする。
                isConsecutiveReturn: false,
                streakDays: 1,
                totalDays: returningParticipantTestDay,
            });
            returningParticipantTestDay = returningParticipantTestDay >= 7
                ? 2
                : returningParticipantTestDay + 1;
        });
        linkedNameTestBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            relightParticipation("太郎", {
                swipeCount: Math.max(1, count),
                isSupporter: true,
            });
        });
        function simulateCrowd(size = 50) {
            const safeSize = Math.max(1, Math.min(100, Math.floor(Number(size) || 50)));
            clearOperationTimers();
            crowdTestBtn.classList.add("is-running");
            crowdTestBtn.disabled = true;
            setOperationStatus(`${safeSize}人同時参加を再現中：順番に映像へ反映します`);
            if (!liveCountInitialized) {
                liveCountInitialized = true;
                visualizedLiveCount = count;
            }
            applyLiveCount(count + safeSize);
            for (let index = 1; index <= safeSize; index += 1) {
                showThanks(`テスト${String(index).padStart(2, "0")}`, {
                    isReturning: index % 5 === 0,
                    streakDays: index % 5 === 0 ? 2 : 1,
                    totalDays: index % 5 === 0 ? 2 : 1,
                    createdAt: Date.now() + index,
                });
            }
            crowdTestTimer = window.setInterval(() => {
                const pending = Math.max(0, count - visualizedLiveCount);
                if (pending <= 0 && !celebrationActive && !queuedReplayHoldTimer && !queuedReplayTimer) {
                    window.clearInterval(crowdTestTimer);
                    crowdTestTimer = null;
                    crowdTestBtn.classList.remove("is-running");
                    crowdTestBtn.disabled = false;
                    setOperationStatus(`${safeSize}人同時参加の再現完了：映像は待機状態へ戻りました`);
                } else {
                    setOperationStatus(`${safeSize}人同時参加を再現中：未反映 ${pending}人`);
                }
            }, 700);
        }

        function runResetCycleCheck() {
            resetCheckBtn.classList.add("is-running");
            resetCheckBtn.disabled = true;
            returnVisualToWaitingState({
                resetCount: true,
                resetLiveState: true,
                message: "映像リセット確認中：18人達成演出を再生します",
            });
            let added = 0;
            resetCheckAddTimer = window.setInterval(() => {
                added += 1;
                addParticipant();
                if (added >= TOTAL) {
                    window.clearInterval(resetCheckAddTimer);
                    resetCheckAddTimer = null;
                }
            }, 120);
            resetCheckTimer = window.setTimeout(() => {
                const ok = !celebrationActive
                    && revealed === 0
                    && !warmLayer.classList.contains("is-revealed")
                    && !finalLayer.classList.contains("is-revealed")
                    && !queuedReplayHoldTimer
                    && !queuedReplayTimer;
                resetCheckBtn.classList.remove("is-running");
                resetCheckBtn.disabled = false;
                resetCheckTimer = null;
                if (ok) {
                    setOperationStatus("映像リセットOK：達成後に荒廃した新宿へ戻っています");
                } else {
                    returnVisualToWaitingState({
                        message: "映像リセットNGを検知したため、待機状態へ復帰しました",
                    });
                }
            }, (TOTAL * 140) + CLEAN_VIDEO_MAX_MS + 2600);
        }

        function emergencyStop() {
            crowdTestBtn.classList.remove("is-running");
            crowdTestBtn.disabled = false;
            resetCheckBtn.classList.remove("is-running");
            resetCheckBtn.disabled = false;
            returnVisualToWaitingState({
                resetCount: false,
                resetLiveState: false,
                message: "緊急停止：カウントは維持したまま待機画面へ戻しました",
            });
        }

        crowdTestBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            simulateCrowd(50);
        });
        resetCheckBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            runResetCycleCheck();
        });
        emergencyStopBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            emergencyStop();
        });
        autoBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleAuto(); });
        resetBtn.addEventListener("click", (e) => { e.stopPropagation(); reset(); });

        document.addEventListener("keydown", (e) => {
            if (LIVE_BROADCAST_MODE) {
                return;
            }
            if (DEV && e.code === "KeyH") {
                e.preventDefault();
                setDevUiHidden(!document.body.classList.contains("dev-ui-hidden"));
            } else if (e.code === "Space" || e.code === "Enter" || e.code === "ArrowRight") {
                e.preventDefault();
                addParticipant();
            } else if (e.code === "KeyA") {
                toggleAuto();
            } else if (e.code === "KeyR") {
                reset();
            }
        });

        updateHud();
        scheduleIdleVideo();
        if (AUTO_COUNT_MODE) {
            window.setTimeout(() => {
                startAutoCountDemo({ immediate: true });
            }, AUTO_COUNT_START_DELAY_MS);
        }

        // Firebase連動スクリプト（module）から呼べるように公開
        window.__inkDemo = {
            activateLive,
            applyLiveCount,
            showThanks,
            showParticipationThanks,
            relightParticipation,
            setDonorNameRotation,
            resumeDonorTicker,
            setSupporterComments,
            simulateCrowd,
            emergencyStop,
            runResetCycleCheck,
            startAutoCountDemo,
            stopAutoCountDemo,
            skipScene,
            completeCurrentChallenge,
            setCelebrationPersistence: (callback) => {
                celebrationPersistence = typeof callback === "function" ? callback : null;
            },
            getDebugLog: () => demoDebugLog.slice(),
            getDebugState: () => ({
                count,
                revealed,
                visualizedLiveCount,
                queuedRevealCount,
                celebrationActive,
                idleVideoActive,
            }),
        };
    </script>

    <script type="module">
        // 実際のスマホ参加（Firebase）に連動：index.html と同じチャンネルを購読
        import { getLastCelebratedCount, getRecentNameAnnouncements, setLastCelebratedCount, subscribeToParticipantCount, subscribeToNameAnnouncements, subscribeToSwipeCompletes, subscribeToSupporterComments, publishSwipeComplete } from "./src/firebase-bridge.js?v=20260714-linked-ink-1";
        import { isInappropriateName } from "./src/name-filter.js";
        import { getChannelForTheme, resolveTheme } from "./src/theme-router.js";

        const theme = resolveTheme({ defaultTheme: "day" });
        const searchParams = new URLSearchParams(location.search);
        const isDevMode = searchParams.has("dev");
        const isDoohPhonePreview = searchParams.has("phone") || searchParams.has("phone-dooh") || searchParams.has("mobile-dooh");
        const isAutoCountMode = searchParams.has("autoCount") || searchParams.has("auto-count") || searchParams.has("autoplay");
        const isManualOnlyMode = searchParams.has("manual") || searchParams.has("offline") || isAutoCountMode;
        const isLiveBroadcastMode = searchParams.has("live") || searchParams.has("youtube") || searchParams.has("broadcast");
        const channel = isLiveBroadcastMode
            ? "youtube"
            : searchParams.get("channel") === "research" && searchParams.get("team-test") === "1"
                ? "research"
                : getChannelForTheme(theme, "default");
        let initialCountHandled = false;

        async function shouldReplayInitialCompletion(liveCount) {
            const count = Math.max(0, Number(liveCount) || 0);
            if (count <= 0 || count % 18 !== 0) {
                return false;
            }
            try {
                // swipeイベントは連番countを持たない(participantCountをincrementで採番)ため、
                // 「直近1時間以内に最後のスワイプがあったか」だけで判定する
                const lastCelebratedCount = await getLastCelebratedCount({ channel });
                return count > lastCelebratedCount;
            } catch (error) {
                console.info("[demo] celebration replay state read skipped:", error);
                return false;
            }
        }

        // ?dev のときだけ「本番+1」ボタンを出す：QRと同じFirebaseイベントを1件送って連動確認できる
        window.__inkDemo?.setCelebrationPersistence((count) =>
            setLastCelebratedCount(count, { channel }).catch((error) => {
                console.info("[demo] celebration state write skipped:", error);
            })
        );

        if (isDevMode) {
            const tools = document.querySelector(".tools");
            const liveBtn = document.createElement("button");
            liveBtn.type = "button";
            liveBtn.textContent = "📡 本番+1";
            liveBtn.title = "実際のQR参加と同じFirebaseイベントをDEV用に1件送る";
            liveBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                publishSwipeComplete({ channel, source: "dev-demo", donationAmountYen: 100 })
                    .catch((error) => console.warn("[demo] dev swipe failed:", error));
            });
            tools?.appendChild(liveBtn);
        }

        if (!isManualOnlyMode) {
            subscribeToParticipantCount(async (liveCount) => {
                // 最初のスナップショットが届いた＝Firebase接続済み → 連動モードへ
                // カウント＋インクはスワイプ時に即反応
                window.__inkDemo?.activateLive();
                const isInitialCount = !initialCountHandled;
                initialCountHandled = true;
                const replayInitialCompletion = isInitialCount
                    ? await shouldReplayInitialCompletion(liveCount)
                    : false;
                window.__inkDemo?.applyLiveCount(liveCount, { replayInitialCompletion });
            }, { channel }).catch((error) => {
                console.info("[demo] live sync disabled (offline/manual):", error);
            });

        }

        if (!isLiveBroadcastMode && !isManualOnlyMode) {
            getRecentNameAnnouncements({ channel, all: true })
                .then((events) => {
                    const validEvents = events
                        .map((event) => ({ ...event, name: String(event?.name ?? "").trim() }))
                        .filter((event) => event.name && !isInappropriateName(event.name));
                    window.__inkDemo?.setDonorNameRotation(validEvents);
                })
                .catch((error) => {
                    console.info("[demo] donor history disabled (offline/manual):", error);
                });

            // 新しい寄付者名は巡回表示より優先し、以後の巡回リストにも追加する。
            subscribeToNameAnnouncements((event) => {
                if (!isInappropriateName(String(event?.name ?? ""))) {
                    window.__inkDemo?.showThanks(event?.name, event);
                }
            }, { channel }).catch((error) => {
                console.info("[demo] name feed disabled (offline/manual):", error);
            });

            subscribeToSupporterComments((comments) => {
                const validComments = comments.filter((event) =>
                    !isInappropriateName(String(event?.comment ?? "")) &&
                    !isInappropriateName(String(event?.name ?? ""))
                );
                window.__inkDemo?.setSupporterComments(validComments);
            }, { channel }).catch((error) => {
                console.info("[demo] supporter comment feed disabled (offline/manual):", error);
            });
        }

        if (!isManualOnlyMode) {
            subscribeToSwipeCompletes((event) => {
                window.__inkDemo?.showParticipationThanks(event?.name, event);
            }, { channel }).catch((error) => {
                console.info("[demo] returning participant feed disabled (offline/manual):", error);
            });
        }
    </script>

    <script type="module">
        // 男女共通の参加入口へ統一。本番とRSでホストが混ざらないよう、
        // DOOH画面を開いているホストに合わせて /join を生成する。
        const PARTICIPANT_ORIGIN = /^https?:$/.test(location.protocol)
            && /^(dooh-ca9c2|shinjuku-dooh-live|shinjuku-dooh-rs)\.web\.app$/.test(location.hostname)
            ? location.origin
            : "https://shinjuku-dooh-live.web.app";
        const JOIN_URL = `${PARTICIPANT_ORIGIN}/join`;
        const qrSearchParams = new URLSearchParams(location.search);
        const QR_YOUTUBE_MODE = qrSearchParams.has("youtube") || qrSearchParams.has("live") || qrSearchParams.has("broadcast");
        const qrCode = document.getElementById("qrCode");
        const urlNote = document.getElementById("urlNote");

        const { default: QRCode } = await import("https://cdn.skypack.dev/qrcode@1.5.3");

        function pickParticipantUrl() {
            const baseUrl = JOIN_URL;
            if (!QR_YOUTUBE_MODE) {
                return baseUrl;
            }
            const url = new URL(baseUrl);
            url.searchParams.set("mode", "youtube");
            return url.toString();
        }

        async function renderQr() {
            const url = pickParticipantUrl();
            if (urlNote) urlNote.textContent = url;
            try {
                const canvas = await QRCode.toCanvas(url, {
                    width: 240,
                    margin: 1,
                    errorCorrectionLevel: "M",
                    color: { dark: "#151919", light: "#ffffff" },
                });
                qrCode?.replaceChildren(canvas);
            } catch (error) {
                console.warn("QR generation failed:", error);
            }
        }

        function scheduleNextHourly() {
            const now = new Date();
            const next = new Date(now);
            next.setHours(now.getHours() + 1, 0, 0, 50);
            const delay = next.getTime() - now.getTime();
            setTimeout(async () => {
                await renderQr();
                scheduleNextHourly();
            }, delay);
        }

        await renderQr();
        scheduleNextHourly();
    </script>
