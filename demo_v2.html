<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- ホーム画面に追加して起動するとブラウザUIなしの全画面（プロジェクター表示用） -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="新宿DOOH" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#050606" />
    <title>新宿インク演出デモ</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.skypack.dev" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=EB+Garamond:wght@500;600;700&family=Hanken+Grotesk:wght@400;600;700&family=M+PLUS+Rounded+1c:wght@500;700&family=Noto+Sans+JP:wght@500;700&family=Shippori+Mincho:wght@600;700&family=Yusei+Magic&display=swap" rel="stylesheet" />
    <style>
        /* モノクロ大理石テーマ（theme-men.css / SHINJUKU GIVE に準拠） */
        :root {
            --ink: #151919;
            --ink-strong: #050606;
            --ink-2: #5c5f60;
            --silver: #c8c8c8;
            --line: rgba(21, 25, 25, 0.14);
            --line-soft: rgba(21, 25, 25, 0.08);
            --font-sans: "Hanken Grotesk", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
            --font-serif: "EB Garamond", "Noto Sans JP", serif;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            color: var(--ink);
            font-family: var(--font-sans);
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* 大理石の壁（参加サイトと同じ床面） */
        body {
            background:
                radial-gradient(ellipse at 16% 8%, rgba(255, 255, 255, 0.96) 0 12%, transparent 34%),
                radial-gradient(ellipse at 82% 18%, rgba(230, 230, 230, 0.5) 0 14%, transparent 36%),
                radial-gradient(ellipse at 42% 88%, rgba(190, 190, 190, 0.18) 0 14%, transparent 38%),
                linear-gradient(118deg, transparent 0 29%, rgba(21, 21, 21, 0.052) 30%, transparent 33% 100%),
                linear-gradient(128deg, transparent 0 47%, rgba(21, 21, 21, 0.12) 48%, rgba(21, 21, 21, 0.03) 49%, transparent 51% 100%),
                linear-gradient(24deg, transparent 0 64%, rgba(48, 48, 48, 0.07) 65%, transparent 68% 100%),
                #f8f8f8;
        }

        /* ステージ：画面全体が新宿の写真。黒地に飛沫を screen で累積リビール */
        .stage {
            position: fixed;
            inset: 0;
            background: #050606;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
            isolation: isolate;
        }

        /* 待機画面：荒廃した新宿動画をそのまま全画面表示 */
        .base-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
        }

        .base-video {
            filter: brightness(0.82) contrast(1.06) saturate(0.92);
        }

        .ink-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            /* 全画面いっぱいに新宿を表示 */
            object-fit: cover;
            z-index: 1;
            opacity: 0;
            /* 黒背景を透過させ、飛沫の明部だけを累積させる */
            mix-blend-mode: screen;
            will-change: transform, opacity, filter;
            pointer-events: none;
        }

        .ink-layer.is-revealed { opacity: 1; }

        /* 実行時配置版: 18枚のimgは「どの飛沫が出ているか」の状態だけを持つ */
        img.ink-layer:not(.final-layer) { display: none; }

        .reveal-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 400ms ease;
            /* 窓の中は「回復した新宿そのもの」。反転後の warm-layer と同一の発色にする */
            filter: sepia(0.08) saturate(1.08) brightness(0.96) contrast(1.02);
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            mask-composite: add;
            -webkit-mask-composite: source-over;
        }

        .reveal-video.has-mask { opacity: 1; }

        /* 着弾。跳ねて消えたあと、下の窓（動くclean映像）が残る */
        .ink-impact {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
        }

        .ink-impact.is-plate {
            background: url("assets/ink-people/plate.jpg") center / cover no-repeat;
            filter: sepia(0.08) saturate(1.08) brightness(0.96);
        }

        /* 白インク: 暗い廃墟の上でいちばん遠くまで届く */
        .ink-impact.is-white {
            background: radial-gradient(circle at 46% 42%, #ffffff 0%, #f1f3f5 55%, #d9dee3 100%);
            filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.32));
        }

        /* 映像: 色を付けず、窓の中身（回復した新宿）そのものが飛沫形で弾けて着地する */
        .ink-impact.is-window video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* 窓（.reveal-video）と同じ発色に合わせ、フェード時の継ぎ目を消す */
            filter: sepia(0.08) saturate(1.08) brightness(0.96) contrast(1.02);
        }

        /* 着弾で飛び散る小滴。transform/opacity だけで動かす＝映像の描画を乱さない */
        .ink-droplet {
            position: absolute;
            z-index: 1;
            border-radius: 50%;
            pointer-events: none;
            will-change: transform, opacity;
        }

        /* 参加者の名前は、着弾した飛沫のところに数秒だけ立つ */
        .impact-name {
            position: absolute;
            z-index: 2;
            transform: translate(-50%, -50%);
            font-family: var(--font-sans);
            font-weight: 700;
            font-size: clamp(1.5rem, 2.7vw, 3.1rem);
            letter-spacing: 0.02em;
            color: #fff;
            text-shadow: 0 4px 26px rgba(0, 0, 0, 0.8), 0 1px 4px rgba(0, 0, 0, 0.6);
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            text-align: center;
        }

        /* 明るい窓の上でも沈まないよう、文字の背後に太い縁を描く */
        .impact-name > span {
            paint-order: stroke fill;
            -webkit-text-stroke: 10px rgba(6, 9, 12, 0.86);
        }

        .impact-name .impact-comment { -webkit-text-stroke-width: 6px; }
        .impact-name .supporter-sigil { -webkit-text-stroke-width: 0; }

        /* ---- DOOHとしての整理: 名前ロール・「あと◯人」・QRを常設 ---- */
        /* ありがとうスタック / URL / 「第N回 彩リレー」は常設から外す */
        #participationThanks,
        .url-note,
        .challenge-label { display: none !important; }

        /* 運用者向けの操作説明は本番に出さない */
        .hint { display: none; }
        body.dooh-dev .hint { display: block; }

        /* 累計人数はDOOHの現在地として常設する */
        .dock .live .label,
        .dock .live .value {
            opacity: 1;
            transform: none;
            transition: opacity 700ms ease, transform 700ms ease;
        }

        body.is-celebrating .dock .live .label,
        body.is-celebrating .dock .live .value {
            opacity: 1;
            transform: none;
        }

        /* 映像の中の電子広告板。反転の瞬間に点灯し、支援者の名前を掲げる */
        .billboard {
            position: absolute;
            left: 0;
            top: 0;
            z-index: 5;
            transform-origin: 0 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            background: linear-gradient(160deg, rgba(18, 32, 48, 0.92), rgba(10, 18, 30, 0.96));
            box-shadow: inset 0 0 60px rgba(120, 200, 255, 0.28);
        }

        .billboard.is-lit { animation: billboard-on 1100ms cubic-bezier(0.2, 0.9, 0.3, 1) forwards; }

        /* 支援者のスワイプでは、板が一瞬だけ灯って落ちる（街はまだ直っていない） */
        .billboard.is-flash { animation: billboard-flash 1250ms ease-out forwards; }

        @keyframes billboard-flash {
            0%   { opacity: 0; }
            8%   { opacity: 0.9; }
            16%  { opacity: 0.15; }
            26%  { opacity: 0.8; }
            60%  { opacity: 0.7; }
            100% { opacity: 0; }
        }

        @keyframes billboard-on {
            0%   { opacity: 0; }
            18%  { opacity: 0.85; }
            26%  { opacity: 0.1; }
            38%  { opacity: 0.95; }
            46%  { opacity: 0.35; }
            100% { opacity: 1; }
        }

        .billboard-text {
            font-family: var(--font-sans);
            font-weight: 800;
            font-size: 96px;
            line-height: 1;
            letter-spacing: 0.06em;
            color: #eaf6ff;
            text-shadow: 0 0 18px rgba(140, 210, 255, 0.9), 0 0 48px rgba(90, 170, 255, 0.55);
            white-space: nowrap;
        }

        .billboard-kicker {
            position: absolute;
            bottom: 10px;
            font-size: 26px;
            letter-spacing: 0.5em;
            color: rgba(190, 225, 255, 0.75);
        }

        /* 匿名参加者への返し: その人が開けた窓の輪郭が一瞬だけ光る */
        .ink-outline {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            background: #ffffff;
            mix-blend-mode: screen;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
        }

        .ink-outline.is-name-linked {
            z-index: 4;
            background: linear-gradient(135deg, #ffffff 0%, #f9f871 28%, #4dd4ff 62%, #ff8fd0 100%);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.92))
                drop-shadow(0 0 26px rgba(77, 212, 255, 0.72));
        }

        .ink-outline.is-name-linked.is-supporter {
            background: linear-gradient(135deg, #fff7c8 0%, #ffd56a 48%, #ff8fd0 100%);
            filter: drop-shadow(0 0 12px rgba(255, 245, 190, 0.96))
                drop-shadow(0 0 32px rgba(255, 197, 72, 0.78));
        }

        .ink-name-beacon {
            position: absolute;
            z-index: 5;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.96);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.35);
            box-shadow: 0 0 18px rgba(77, 212, 255, 0.9);
        }

        .ink-name-beacon::before,
        .ink-name-beacon::after {
            content: "";
            position: absolute;
            inset: -3px;
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            animation: ink-name-beacon-ring 600ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .ink-name-beacon::after { animation-delay: 110ms; }

        @keyframes ink-name-beacon-ring {
            from { opacity: 0.95; transform: scale(0.4); }
            to { opacity: 0; transform: scale(7); }
        }

        @media (prefers-reduced-motion: reduce) {
            .ink-name-beacon::before,
            .ink-name-beacon::after { animation: none; opacity: 0.55; transform: scale(2.2); }
        }

        /* 支援者は文言ラベルではなく、彩のシンボルとラインで見分ける。 */
        .supporter-sigil {
            display: block;
            width: 0.48em;
            height: 0.48em;
            margin: 0 auto 0.4em;
            border-radius: 28% 72% 28% 72%;
            background: conic-gradient(from 45deg, #e55b55, #efa94a, #7db56e, #4e92bb, #8c79bb, #e55b55);
            transform: rotate(45deg);
            box-shadow: 0 0 13px rgba(78, 146, 187, 0.65), 0 0 22px rgba(229, 91, 85, 0.42);
            animation: supporter-sigil-pulse 1300ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .impact-person-name {
            display: inline-block;
            position: relative;
        }

        .impact-name.is-supporter .impact-person-name {
            padding-bottom: 0.3em;
        }

        .impact-name.is-supporter .impact-person-name::after {
            content: "";
            position: absolute;
            left: 5%;
            right: 5%;
            bottom: 0;
            height: 4px;
            border-radius: 999px;
            background: linear-gradient(90deg, #e55b55, #efa94a, #7db56e, #4e92bb, #8c79bb);
            box-shadow: 0 0 14px rgba(78, 146, 187, 0.45);
            transform-origin: center;
            animation: supporter-line-reveal 1200ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes supporter-sigil-pulse {
            0% { opacity: 0; transform: rotate(45deg) scale(0.2); }
            48% { opacity: 1; transform: rotate(225deg) scale(1.22); }
            100% { opacity: 0.92; transform: rotate(225deg) scale(1); }
        }

        @keyframes supporter-line-reveal {
            from { opacity: 0; transform: scaleX(0); }
            to { opacity: 1; transform: scaleX(1); }
        }

        .impact-comment {
            display: block;
            margin-top: 0.42em;
            font-size: 0.52em;
            font-weight: 500;
            line-height: 1.45;
            color: rgba(255, 255, 255, 0.94);
            max-width: 22em;
            white-space: normal;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            padding-top: 0.4em;
        }

        .impact-name.is-supporter {
            text-align: center;
            color: #fff;
            text-shadow: 0 4px 26px rgba(0, 0, 0, 0.9), 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        .impact-name.is-supporter::before {
            content: "";
            position: absolute;
            z-index: -1;
            inset: -0.8em -1.25em;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(circle,
                rgba(255, 255, 255, 0.2) 0%,
                rgba(78, 146, 187, 0.18) 30%,
                rgba(140, 121, 187, 0.12) 48%,
                rgba(229, 91, 85, 0.08) 64%,
                transparent 76%);
            animation: supporter-color-bloom 1500ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes supporter-color-bloom {
            0% { opacity: 0; transform: scale(0.45); }
            38% { opacity: 1; transform: scale(1.08); }
            100% { opacity: 0.42; transform: scale(1); }
        }

        /* 常連の一撃は、その人の色に染まったインクになる（彩＝人） */
        .ink-impact.is-streak {
            background-color: var(--returning-color, #ffc56d);
            background-blend-mode: color;
        }

        /* 白インクは blend だと沈むので、その人の色のグラデーションで直接塗る */
        .ink-impact.is-white.is-streak {
            background: radial-gradient(circle at 46% 42%,
                color-mix(in srgb, var(--returning-color, #ffc56d) 72%, #fff) 0%,
                var(--returning-color, #ffc56d) 55%,
                color-mix(in srgb, var(--returning-color, #ffc56d) 60%, #000) 100%);
            background-blend-mode: normal;
            filter: drop-shadow(0 0 26px color-mix(in srgb, var(--returning-color, #ffc56d) 45%, transparent));
        }

        /* 支援者の一撃は、企画テーマの「モノクロから彩」で区別する。 */
        .ink-impact.is-supporter,
        .ink-impact.is-streak.is-supporter {
            background: conic-gradient(from 120deg, #e55b55, #efa94a, #7db56e, #4e92bb, #8c79bb, #e55b55);
            background-blend-mode: color;
            box-shadow: 0 0 55px rgba(78, 146, 187, 0.24), 0 0 90px rgba(229, 91, 85, 0.18);
        }

        /* 白では支援者でもインクの色は変えない（金で塗るとインクの個性が消える）。
           彩は縁の光としてまとわせる。 */
        .ink-impact.is-white.is-supporter {
            background-color: transparent;
            background-blend-mode: normal;
            box-shadow: none;
            filter: drop-shadow(0 0 22px rgba(78, 146, 187, 0.6)) drop-shadow(0 0 34px rgba(229, 91, 85, 0.34));
        }

        /* 常連参加者は名前が streak 色で立つ（従来ピル/ティッカーが担っていた表現） */
        .impact-name.is-returning {
            color: var(--returning-color, #ffc56d);
            text-shadow: 0 4px 26px rgba(0, 0, 0, 0.8), 0 0 22px var(--returning-color, #ffc56d);
        }

        .impact-name.is-supporter.is-returning {
            color: #fff;
            text-shadow: 0 4px 26px rgba(0, 0, 0, 0.9), 0 0 18px rgba(78, 146, 187, 0.36);
        }

        /* 支援者コメントは「祝祭」と「誰も参加していない静かな時間」に出す。
           映像が主役のリレー進行中だけ引っ込む。 */
        /* クラファン支援者本人の参加直後だけコメントを表示する。 */
        body:not(.supporter-comment-active):not(.supporter-comment-history-active) .supporter-comment-wall { display: none !important; }

        /* 祝祭中は映像が静かなので、コメントを主役として大きく読ませる */
        body.is-celebrating .supporter-comment-text {
            font-size: clamp(1.25rem, 2.1vw, 2.3rem);
            line-height: 1.45;
        }

        /* 仕上げの一枚：飛沫ではなく完成版の新宿をくっきり最前面に重ねる */
        .final-layer {
            z-index: 2;
            mix-blend-mode: normal;
        }

        .warm-layer {
            z-index: 3;
            opacity: 0;
            mix-blend-mode: normal;
            filter: sepia(0.08) saturate(1.08) brightness(0.96) contrast(1.02);
            transition: opacity 1800ms ease, filter 1800ms ease;
        }

        .warm-layer.is-revealed {
            opacity: 1;
            filter: sepia(0.12) saturate(1.12) brightness(1.02) contrast(1.04);
        }

        .idle-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 4;
            pointer-events: none;
            opacity: 0;
            filter: saturate(1.04) brightness(0.98) contrast(1.01);
            transition: opacity 900ms ease;
        }

        .idle-layer.is-visible {
            opacity: 1;
        }

        /* 全点灯時に画面全体をふわっと持ち上げる（白〜銀のモノクロ光） */
        .stage.is-complete::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 46%, rgba(255, 255, 255, 0.16), transparent 58%),
                radial-gradient(circle at 50% 46%, rgba(200, 200, 200, 0.12), transparent 72%);
            mix-blend-mode: screen;
            animation: glowPulse 3.2s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* ===== ロワーサード：上下のグラデーションで画像を覆わず文字を載せる ===== */
        .scrim {
            position: fixed;
            left: 0;
            right: 0;
            z-index: 3;
            pointer-events: none;
        }

        .scrim-top {
            top: 0;
            height: 22vh;
            background: linear-gradient(to bottom, rgba(5, 6, 6, 0.62), rgba(5, 6, 6, 0) 100%);
        }

        .scrim-bottom {
            bottom: 0;
            height: 42vh;
            background: linear-gradient(to top, rgba(5, 6, 6, 0.9) 0%, rgba(5, 6, 6, 0.62) 26%, rgba(5, 6, 6, 0) 100%);
        }

        /* ブランド（左上） */
        .brandbar {
            position: fixed;
            top: clamp(20px, 2.6vw, 44px);
            left: clamp(22px, 2.8vw, 52px);
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: clamp(6px, 0.6vw, 10px);
            font-family: var(--font-serif);
            font-weight: 600;
            letter-spacing: 0.06em;
            font-size: clamp(1.35rem, 2.2vw, 2.25rem);
            color: #fff;
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6);
        }

        .brandbar-title {
            display: inline-flex;
            align-items: center;
            gap: clamp(12px, 1vw, 20px);
        }

        .brandbar-title::before {
            content: "";
            width: clamp(13px, 1.1vw, 20px);
            height: clamp(13px, 1.1vw, 20px);
            border-radius: 999px;
            background: #fff;
            box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.16), 0 0 16px rgba(255, 255, 255, 0.6);
            animation: livePulse 1.6s ease-in-out infinite;
        }

        @keyframes livePulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.7); opacity: 0.55; }
        }

        /* 操作ヒント／LIVE状態（ブランドの下） */
        /* タイトルの下の行（LIVE — 参加証投影中） */
        .hint {
            font-family: var(--font-sans);
            font-size: clamp(0.9rem, 1.25vw, 1.15rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.72);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
            transition: opacity 400ms ease;
            pointer-events: none;
        }

        /* 下部ドック：左＝参加カウント／右＝QR＋CTA */
        .dock {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 5;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: clamp(24px, 4vw, 80px);
            padding: clamp(24px, 3.4vw, 64px) clamp(26px, 3.4vw, 68px);
            pointer-events: none;
        }

        .live { position: relative; min-width: 0; color: #fff; }

        .live > .label,
        .live > .value,
        .progress-wrap,
        .cta,
        .thanks {
            transition: opacity 900ms ease, transform 900ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 60秒間参加がない時は黄色映像を背景として見せ、参加導線だけを残す。 */
        body.is-idle-video .live > .label,
        body.is-idle-video .live > .value,
        body.is-idle-video .progress-wrap,
        body.is-idle-video .thanks,
        body.is-idle-video .participation-thanks,
        body.is-idle-video .supporter-comment-wall {
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
            transition: opacity 320ms ease, filter 320ms ease;
        }

        body.is-linked-name-reveal .thanks { opacity: 0.22; filter: saturate(0.55); }

        body.is-idle-video .cta {
            opacity: 1;
            transform: none;
        }

        body.is-idle-video .cta-copy strong,
        body.is-idle-video .cta-copy small {
            color: #fff;
            opacity: 1;
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.82);
        }

        /* 完成映像の切替中は、固定情報を残しつつ映像へ視線を譲る。 */
        body.is-scene-focus .live > .label,
        body.is-scene-focus .live > .value {
            opacity: 0.28;
            transform: translateY(8px);
        }

        body.is-scene-focus .cta {
            opacity: 0.42;
            transform: translateY(8px) scale(0.96);
        }

        body.is-scene-focus .thanks {
            opacity: 0.08;
            transform: translateY(-4px);
        }

        body.is-scene-focus .supporter-comment-wall {
            opacity: 0.96;
            transform: translateY(0) scale(1.02);
            border-color: rgba(255, 255, 255, 0.28);
            box-shadow: 0 18px 52px rgba(0, 0, 0, 0.3), 0 0 24px rgba(255, 255, 255, 0.08);
        }

        /* 複数の寄付者名を連結して右から左へ流し続ける放送テロップ。
           左上が「タイトル＋LIVE行」の2段になったぶん開始位置を下げている。 */
        .thanks {
            position: fixed;
            top: clamp(126px, 15vh, 190px);
            left: 0;
            right: 0;
            z-index: 7;
            margin: 0;
            overflow: hidden;
            font-family: var(--font-sans);
            font-weight: 700;
            font-size: clamp(1rem, 1.55vw, 1.55rem);
            color: rgba(255, 255, 255, 0.82);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.42);
            pointer-events: none;
        }

        .thanks-track {
            display: flex;
            width: max-content;
            will-change: transform;
            animation: donor-ticker var(--ticker-duration, 36s) linear infinite;
        }

        .thanks-group {
            display: flex;
            align-items: center;
            gap: 1em;
            flex: none;
            min-width: 100vw;
            box-sizing: border-box;
            padding: clamp(9px, 0.8vw, 14px) clamp(28px, 3.4vw, 64px);
            border-block: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(15, 18, 18, 0.38);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            white-space: nowrap;
        }

        .ticker-name {
            color: rgba(255, 255, 255, 0.82);
            font-feature-settings: "palt" 1;
            font-synthesis: none;
            line-height: 1.25;
        }

        .ticker-font-noto {
            font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
        }

        .ticker-font-rounded {
            font-family: "M PLUS Rounded 1c", "Noto Sans JP", sans-serif;
            font-size: 0.98em;
        }

        .ticker-font-mincho {
            font-family: "Shippori Mincho", "Noto Serif JP", serif;
            font-size: 1.04em;
            font-weight: 700;
        }

        .ticker-font-dot {
            font-family: "DotGothic16", "Noto Sans JP", monospace;
            font-size: 0.9em;
            letter-spacing: 0.035em;
        }

        .ticker-font-yusei {
            font-family: "Yusei Magic", "Noto Sans JP", sans-serif;
            font-size: 0.98em;
            letter-spacing: 0.02em;
        }

        .ticker-name.is-returning.streak-2,
        .ticker-name.is-returning.streak-3,
        .ticker-name.is-returning.streak-4,
        .ticker-name.is-returning.streak-5,
        .ticker-name.is-returning.streak-6,
        .ticker-name.is-returning.streak-7 {
            color: var(--returning-color, #ffc56d);
            text-shadow: 0 0 10px color-mix(in srgb, var(--returning-color, #ffc56d) 58%, transparent);
        }

        .ticker-name.is-latest {
            padding: 3px 9px;
            border: 1px solid rgba(255, 255, 255, 0.52);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.18);
        }

        .streak-2 { --returning-color: #ffc56d; }
        .streak-3 { --returning-color: #ff8a80; }
        .streak-4 { --returning-color: #f48fb1; }
        .streak-5 { --returning-color: #c5a3ff; }
        .streak-6 { --returning-color: #80d8ff; }
        .streak-7 { --returning-color: #7ee2b8; }

        .ticker-separator {
            color: rgba(255, 255, 255, 0.62);
        }

        @keyframes donor-ticker {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* 参加した瞬間だけ、寄付者名テロップとは別に表示するお礼通知。 */
        .participation-thanks {
            position: absolute;
            bottom: calc(100% + 4px);
            left: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: clamp(7px, 0.7vw, 12px);
            width: min(64vw, 900px);
            color: #fff;
            font-family: var(--font-serif);
            pointer-events: none;
        }

        .participation-thanks-item {
            display: inline-flex;
            align-items: center;
            gap: clamp(10px, 0.9vw, 16px);
            max-width: 100%;
            padding: clamp(8px, 0.8vw, 13px) clamp(14px, 1.35vw, 24px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            background: rgba(15, 18, 18, 0.54);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            font-size: clamp(1rem, 1.55vw, 1.55rem);
            font-weight: 600;
            line-height: 1.25;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.6);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.14);
            white-space: nowrap;
            animation: participation-stack-in 420ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .participation-thanks-item::before {
            content: "";
            width: clamp(9px, 0.8vw, 14px);
            height: clamp(9px, 0.8vw, 14px);
            flex: none;
            border-radius: 999px;
            background: currentColor;
            box-shadow: 0 0 10px currentColor;
        }

        .participation-thanks-item.is-returning.streak-2,
        .participation-thanks-item.is-returning.streak-3,
        .participation-thanks-item.is-returning.streak-4,
        .participation-thanks-item.is-returning.streak-5,
        .participation-thanks-item.is-returning.streak-6,
        .participation-thanks-item.is-returning.streak-7 {
            color: var(--returning-color, #ffc56d);
            text-shadow: 0 2px 16px color-mix(in srgb, var(--returning-color, #ffc56d) 48%, #000);
        }

        .participation-thanks-item.is-leaving {
            animation: participation-stack-out 460ms ease-in both;
        }

        @keyframes participation-stack-in {
            from { opacity: 0; transform: translateY(18px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes participation-stack-out {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-16px); }
        }

        .supporter-comment-wall {
            position: fixed;
            /* 名前テロップ(top 15vh + 帯の高さ約64px)の下に必ず収まる位置 */
            top: clamp(216px, 23vh, 290px);
            right: clamp(26px, 3.4vw, 68px);
            z-index: 6;
            width: min(38vw, 620px);
            min-width: 360px;
            padding: clamp(15px, 1.35vw, 24px) clamp(20px, 1.8vw, 34px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: clamp(16px, 1.45vw, 24px);
            background: linear-gradient(135deg, rgba(15, 18, 18, 0.7), rgba(15, 18, 18, 0.46));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            box-shadow: 0 14px 38px rgba(0, 0, 0, 0.22);
            pointer-events: none;
            transition: opacity 900ms ease, transform 900ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        .supporter-comment-wall[hidden] {
            display: none;
        }

        .supporter-comment-wall.is-switching {
            animation: supporter-comment-in 520ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .supporter-comment-kicker {
            display: block;
            margin-bottom: 5px;
            font-size: clamp(0.76rem, 1vw, 1rem);
            font-weight: 700;
            letter-spacing: 0.16em;
            color: rgba(255, 255, 255, 0.64);
        }

        .supporter-comment-text {
            margin: 0;
            font-family: var(--font-serif);
            font-size: clamp(1.28rem, 1.85vw, 2rem);
            font-weight: 600;
            line-height: 1.32;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.55);
        }

        .supporter-comment-name {
            display: block;
            margin-top: 7px;
            font-size: clamp(0.82rem, 1.08vw, 1.1rem);
            font-weight: 700;
            color: rgba(255, 255, 255, 0.72);
        }

        @keyframes supporter-comment-in {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 900px) {
            .supporter-comment-wall {
                top: clamp(196px, 21vh, 240px);
                right: clamp(18px, 3vw, 28px);
                width: min(42vw, 360px);
                min-width: 240px;
            }
        }

        .stage.is-returning-pulse::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 4;
            pointer-events: none;
            background:
                radial-gradient(circle at 30% 70%, color-mix(in srgb, var(--returning-color, #ffc56d) 34%, transparent), transparent 38%),
                radial-gradient(circle at 70% 30%, color-mix(in srgb, var(--returning-color, #ffc56d) 20%, transparent), transparent 46%);
            mix-blend-mode: screen;
            animation: returningPulse 2600ms ease-out both;
        }

        @keyframes returningPulse {
            0% { opacity: 0; }
            25% { opacity: 1; }
            100% { opacity: 0; }
        }

        .live .value span.num { display: inline-block; }

        body.is-live-broadcast .thanks,
        body.is-live-broadcast .supporter-comment-wall {
            display: none !important;
        }

        .ticker-name.is-supporter {
            color: #fff;
        }

        .ticker-name.is-supporter::before {
            content: "✦";
            display: inline-block;
            margin-right: 0.38em;
            color: #7dbce0;
            text-shadow: 0 0 8px rgba(229, 91, 85, 0.72), 0 0 12px rgba(125, 181, 110, 0.5);
        }

        body.is-live-broadcast .participation-thanks {
            left: clamp(26px, 3.4vw, 68px);
            bottom: clamp(200px, 19vw, 330px);
        }

        body.is-live-broadcast .cta-copy strong {
            font-size: clamp(1.5rem, 2.55vw, 2.7rem);
        }

        .live .label {
            display: block;
            font-size: clamp(0.95rem, 1.35vw, 1.28rem);
            font-weight: 700;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.74);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
        }

        .live .value {
            display: flex;
            align-items: baseline;
            gap: 0.18em;
            margin: 2px 0 14px;
            font-family: var(--font-serif);
            font-weight: 600;
            font-size: clamp(4.2rem, 10.5vw, 9.5rem);
            line-height: 0.86;
            letter-spacing: -0.01em;
            font-variant-numeric: tabular-nums;
            color: #fff;
            text-shadow: 0 6px 30px rgba(0, 0, 0, 0.55);
        }

        .live .value span.unit {
            font-family: var(--font-sans);
            font-size: 0.26em;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.82);
        }

        .progress-wrap { width: min(620px, 58vw); }

        .progress-text {
            margin: 0 0 10px;
            font-family: var(--font-serif);
            font-size: clamp(1.45rem, 2.7vw, 2.45rem);
            font-weight: 600;
            color: #fff;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.6);
        }

        .progress-text.is-complete { color: #fff; }

        .transition-countdown {
            min-height: 1.4em;
            margin: -2px 0 10px;
            font-size: clamp(0.95rem, 1.35vw, 1.25rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.82);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.58);
        }

        .transition-countdown:empty {
            display: none;
        }

        .challenge-label {
            display: block;
            margin-bottom: 6px;
            font-size: clamp(0.86rem, 1.18vw, 1.08rem);
            font-weight: 700;
            letter-spacing: 0.16em;
            color: rgba(255, 255, 255, 0.7);
        }

        .progress-bar {
            height: clamp(10px, 0.8vw, 15px);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.18);
            overflow: hidden;
        }

        .progress-bar span {
            display: block;
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: linear-gradient(90deg, #ffffff, #c8c8c8);
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.5);
            transition: width 600ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ===== QR＋CTA（右下：視線の終着点・既存DOOHと同じ参加リンク） ===== */
        .cta {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: clamp(18px, 1.8vw, 32px);
            pointer-events: auto;
        }

        .cta-copy { text-align: right; color: #fff; }

        .cta-copy strong {
            display: block;
            font-family: var(--font-serif);
            font-weight: 600;
            font-size: clamp(1.65rem, 2.75vw, 2.9rem);
            line-height: 1.1;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.6);
            transition: opacity 360ms ease, transform 360ms ease;
        }

        .cta-copy small {
            display: block;
            margin-top: 8px;
            font-size: clamp(1.05rem, 1.45vw, 1.42rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.82);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
            transition: opacity 360ms ease, transform 360ms ease;
        }

        .cta-copy.is-changing strong,
        .cta-copy.is-changing small {
            opacity: 0;
            transform: translateY(4px);
        }

        .qr-code {
            width: clamp(190px, 18vw, 300px);
            padding: clamp(13px, 1vw, 18px);
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5);
            line-height: 0;
        }

        /* 正方形のQRを等比表示。qrcodeライブラリが付ける inline style を !important で上書き */
        .qr-code canvas, .qr-code img {
            display: block;
            width: 100% !important;
            height: auto !important;
            aspect-ratio: 1;
        }

        /* QR遷移先の確認用。通常表示では隠し、?dev のときだけ表示する。 */
        .url-note {
            display: none;
            position: fixed;
            left: clamp(26px, 3.4vw, 68px);
            bottom: clamp(10px, 1.2vw, 18px);
            z-index: 5;
            font-size: clamp(0.8rem, 1.05vw, 1rem);
            letter-spacing: 0.02em;
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
        }

        .url-note.is-dev-visible {
            display: block;
        }

        /* 操作系（デモ用ツール）：右上 */
        .tools {
            position: fixed;
            top: clamp(16px, 2.4vw, 36px);
            right: clamp(16px, 2.4vw, 36px);
            z-index: 6;
            display: none;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
            max-width: min(92vw, 820px);
        }

        body.is-manual-mode .tools {
            display: flex;
        }

        body.dooh-dev.dev-ui-hidden .tools,
        body.dooh-dev.dev-ui-hidden .hint,
        body.dooh-dev.dev-ui-hidden .url-note {
            display: none !important;
        }

        .tools button {
            pointer-events: auto;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid rgba(21, 25, 25, 0.18);
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--ink);
            font-family: var(--font-sans);
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(21, 25, 25, 0.08);
            transition: transform 120ms ease, border-color 160ms ease, background 160ms ease;
        }

        .tools button:hover { border-color: var(--ink); }
        .tools button:active { transform: scale(0.94); }
        .tools button.is-on {
            border-color: var(--ink);
            background: var(--ink);
            color: #fff;
        }

        .tools button.is-danger {
            border-color: rgba(190, 30, 30, 0.28);
            background: rgba(190, 30, 30, 0.88);
            color: #fff;
        }

        .tools button.is-running {
            border-color: rgba(21, 25, 25, 0.4);
            background: rgba(21, 25, 25, 0.88);
            color: #fff;
        }

        body.is-live-broadcast .tools,
        body.is-live-broadcast .hint,
        body.is-live-broadcast .url-note {
            display: none !important;
        }

        body.is-dooh-phone-preview {
            background: #050606;
        }

        body.is-dooh-phone-preview::before {
            content: "横向きにするとDOOH全体が見やすくなります";
            position: fixed;
            top: max(10px, env(safe-area-inset-top));
            left: 50%;
            z-index: 8;
            display: none;
            width: min(92vw, 420px);
            padding: 9px 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            background: rgba(5, 6, 6, 0.68);
            color: rgba(255, 255, 255, 0.88);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.02em;
            text-align: center;
            transform: translateX(-50%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
            pointer-events: none;
        }

        body.is-dooh-phone-preview .hint {
            display: none;
        }

        body.is-dooh-phone-preview .base-video {
            filter: brightness(0.96) contrast(1.1) saturate(1.04);
        }

        body.is-dooh-phone-preview .brandbar,
        body.is-dooh-phone-preview .cta,
        body.is-dooh-phone-preview .thanks,
        body.is-dooh-phone-preview .participation-thanks,
        body.is-dooh-phone-preview .supporter-comment-wall,
        body.is-dooh-phone-preview .progress-wrap,
        body.is-dooh-phone-preview .scrim-top {
            display: none !important;
        }

        body.is-dooh-phone-preview .scrim-bottom {
            height: 24vh;
            background: linear-gradient(to top, rgba(5, 6, 6, 0.78), rgba(5, 6, 6, 0));
        }

        body.is-dooh-phone-preview .dock {
            justify-content: flex-start;
            padding: clamp(14px, 3vw, 24px) clamp(16px, 3.6vw, 28px);
        }

        body.is-dooh-phone-preview .live {
            padding: 12px 16px 13px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 18px;
            background: rgba(5, 6, 6, 0.34);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        body.is-dooh-phone-preview .live > .label {
            font-size: clamp(0.64rem, 1.8vw, 0.8rem);
            letter-spacing: 0.18em;
            color: rgba(255, 255, 255, 0.78);
        }

        body.is-dooh-phone-preview .live > .value {
            margin: 4px 0 0;
            font-size: clamp(2.1rem, 10vw, 4rem);
        }

        body.is-dooh-phone-preview .tools {
            top: auto;
            right: max(12px, env(safe-area-inset-right));
            bottom: max(12px, env(safe-area-inset-bottom));
            left: auto;
            width: auto;
            justify-content: flex-end;
            gap: 0;
            padding: 7px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            background: rgba(5, 6, 6, 0.58);
            transform: none;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 16px 46px rgba(0, 0, 0, 0.35);
        }

        body.is-dooh-phone-preview .tools button {
            min-width: auto;
            padding: 10px 16px;
            border-color: rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.9);
            font-size: 13px;
        }

        body.is-dooh-phone-preview .tools button:not(#addBtn) {
            display: none !important;
        }

        @media (orientation: portrait) {
            body.is-dooh-phone-preview::before {
                display: block;
            }

            body.is-dooh-phone-preview .dock {
                padding-bottom: max(72px, calc(env(safe-area-inset-bottom) + 68px));
            }
        }

        @media (orientation: landscape) and (max-height: 540px) {
            body.is-dooh-phone-preview .tools {
                right: max(10px, env(safe-area-inset-right));
                bottom: max(10px, env(safe-area-inset-bottom));
                padding: 7px;
                border-radius: 999px;
            }

    <script src="./src/supporter-comment-rotation.js?v=20260715-fair-cycle-1"></script>
    <script>
        // 1チャレンジ=18人。飛沫9種×2段階（芯で着弾→広がって完成）で18ステップを構成する
        const TOTAL = 18;
        // ?dev で開くと、Firebase連動中でも手動ツールで動作確認できる（QR不要）
        const params = new URLSearchParams(location.search);
        const DONATION_PER_PERSON_YEN = 100; // 1参加あたりのデモ募金額（publishSwipeComplete の donationAmountYen と一致）
        const DEV = params.has("dev");
        const DEMO_MODE = params.has("demo");
        const DOOH_PHONE_PREVIEW = params.has("phone") || params.has("phone-dooh") || params.has("mobile-dooh");
        const AUTO_COUNT_MODE = params.has("autoCount") || params.has("auto-count") || params.has("autoplay");
        const MANUAL_ONLY_MODE = params.has("manual") || params.has("offline") || AUTO_COUNT_MODE;
        const MOBILE_VIDEO_MODE = DOOH_PHONE_PREVIEW
            || window.matchMedia("(max-width: 900px)").matches
            || window.matchMedia("(pointer: coarse) and (max-width: 1180px)").matches;
        const LIVE_BROADCAST_MODE = params.has("live") || params.has("youtube") || params.has("broadcast");
        const MANUAL_MODE = DEV || DEMO_MODE || DOOH_PHONE_PREVIEW;
        // DEVの「＋1人参加」用。毎回ランダムな名前と通算参加日数を付ける。
        const DEV_NAMES = [
            "さくら", "ゆうと", "あかり", "ケンタ",
            "みなみ", "はる", "タクミ", "あおい",
            "ひろと", "りん", "まこと", "こはる",
            "そうた", "めい", "なお", "ひなた",
        ];
        let lastDevNameIndex = -1;

        function createRandomDevPersona() {
            let index = Math.floor(Math.random() * DEV_NAMES.length);
            if (DEV_NAMES.length > 1 && index === lastDevNameIndex) {
                index = (index + 1 + Math.floor(Math.random() * (DEV_NAMES.length - 1))) % DEV_NAMES.length;

            lastDevNameIndex = index;
            const totalDays = 1 + Math.floor(Math.random() * 7);
            return {
                name: DEV_NAMES[index],

        }
        const CONTROL_TOOLS_MODE = DEV || params.has("ops") || params.has("control") || DOOH_PHONE_PREVIEW;
        document.body.classList.toggle("is-manual-mode", CONTROL_TOOLS_MODE);

        const toolsPanel = document.querySelector(".tools");

        function setDevUiHidden(hidden) {

            document.body.classList.toggle("dev-ui-hidden", Boolean(hidden));
        }

        if (DEV && toolsPanel) {
            const hideDevUiBtn = document.createElement("button");
            hideDevUiBtn.type = "button";
            hideDevUiBtn.textContent = "操作表示を隠す";
            hideDevUiBtn.title = "DEV操作・説明表示を一時的に隠す（Hキーでも切替）";
            hideDevUiBtn.addEventListener("click", (event) => {
                event.stopPropagation();
