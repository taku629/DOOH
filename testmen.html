<script>
        const handle = document.getElementById('slider-handle');
        const track = document.getElementById('slider-track');
        const fill = document.getElementById('slider-fill');
        let isDragging = false;
        let startX = 0;
        let currentTranslate = 0;

        const maxTranslate = track.offsetWidth - handle.offsetWidth - 16; // 16px for padding

        handle.addEventListener('mousedown', startDragging);
        handle.addEventListener('touchstart', startDragging);

        window.addEventListener('mousemove', drag);
        window.addEventListener('touchmove', drag);

        window.addEventListener('mouseup', endDragging);
        window.addEventListener('touchend', endDragging);

        function startDragging(e) {
            isDragging = true;
            startX = e.type === 'mousedown' ? e.clientX : e.touches[0].clientX;
            handle.style.transition = 'none';
            fill.style.transition = 'none';
        }

        function drag(e) {
            if (!isDragging) return;
            const x = e.type === 'mousemove' ? e.clientX : e.touches[0].clientX;
            const walk = x - startX;
            currentTranslate = Math.max(0, Math.min(walk, maxTranslate));
            
            handle.style.transform = `translateX(${currentTranslate}px)`;
            fill.style.width = `${currentTranslate + (handle.offsetWidth / 2)}px`;

            // Success threshold
            if (currentTranslate >= maxTranslate * 0.95) {
                completeAction();
            }
        }

        function endDragging() {
            if (!isDragging) return;
            isDragging = false;
            
            if (currentTranslate < maxTranslate * 0.95) {
                handle.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                fill.style.transition = 'width 0.4s ease';
                handle.style.transform = 'translateX(0px)';
                fill.style.width = '0px';
                currentTranslate = 0;
            }
        }

        function completeAction() {
            isDragging = false;
            handle.style.transform = `translateX(${maxTranslate}px)`;
            fill.style.width = '100%';
            handle.classList.remove('bg-primary-container');
            handle.classList.add('bg-tertiary-container');
            handle.innerHTML = '<span class="material-symbols-outlined text-on-tertiary">check</span>';
            
            // Atmospheric feedback
            track.classList.add('border-tertiary-container');
            
            setTimeout(() => {
                alert('寄付が完了しました。ご協力ありがとうございます。');
                // In a real app, transition to 3/3 screen
            }, 500);
        }
        // Resize observer to update maxTranslate
        const resizeObserver = new ResizeObserver(() => {
            // Recalculate if needed
        });
        resizeObserver.observe(track);
    </script>
