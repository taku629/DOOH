<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOOH Display Player</title>
    <style>
        :root {
            --overlay: rgba(5, 8, 10, 0.72);
            --text: #fffaf0;
            --muted: rgba(255, 250, 240, 0.72);
            --accent: #ff6b35;
            --cyan: #58f2d4;
            --pink: #ff4f88;
            --line: rgba(255, 250, 240, 0.18);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #050505;
            color: var(--text);
            font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
            overflow: hidden;
        }

        .display-shell {
            position: relative;
            width: 100vw;
            height: 100vh;
            isolation: isolate;
            background:
                radial-gradient(circle at 72% 18%, rgba(45, 61, 75, 0.44), transparent 25rem),
                radial-gradient(circle at 12% 78%, rgba(88, 242, 212, 0.1), transparent 30rem),
                linear-gradient(125deg, #050505 0%, #0d1214 48%, #1a130f 100%);
            transition: background 600ms ease;
        }

        .display-shell.is-reborn {
            background:
                radial-gradient(circle at 75% 18%, rgba(255, 79, 136, 0.38), transparent 24rem),
                radial-gradient(circle at 12% 78%, rgba(88, 242, 212, 0.32), transparent 30rem),
                radial-gradient(circle at 52% 52%, rgba(255, 210, 84, 0.18), transparent 26rem),
                linear-gradient(125deg, #050505 0%, #10201f 48%, #3a170f 100%);
        }

        .display-shell::before {
            position: absolute;
            inset: 0;
            z-index: -1;
            background:
                linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
            content: "";
        }

        .display-shell::after {
            position: absolute;
            inset: 0;
            z-index: -1;
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.78), transparent 48%, rgba(0, 0, 0, 0.5));
            content: "";
        }

        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            background: #050505;
        }

        .video-fallback {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            padding: 7vw;
            text-align: left;
            background:
                radial-gradient(circle at 75% 34%, rgba(255, 79, 136, 0.28), transparent 18rem),
                linear-gradient(135deg, rgba(255, 107, 53, 0.28), transparent 42%),
                transparent;
        }

        .video-fallback h1 {
            max-width: 1080px;
            margin: 0;
            text-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
            font-size: clamp(4rem, 11vw, 11rem);
            line-height: 0.86;
            letter-spacing: -0.1em;
        }

        .video-fallback p {
            max-width: 760px;
            margin: 28px 0 0;
            color: var(--muted);
            font-size: clamp(1rem, 2vw, 1.6rem);
            line-height: 1.7;
        }

        .brand-strip {
            position: absolute;
            top: 3vw;
            left: 3vw;
            right: 3vw;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            color: rgba(255, 250, 240, 0.86);
            font-size: 0.82rem;
            font-weight: 900;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .brand-strip span {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .brand-strip span::before {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: var(--cyan);
            box-shadow: 0 0 24px var(--cyan);
            content: "";
        }

        .live-ribbon {
            position: absolute;
            top: 50%;
            right: -10vw;
            padding: 14px 10vw;
            border-block: 1px solid rgba(255, 250, 240, 0.16);
            color: rgba(255, 250, 240, 0.36);
            font-size: clamp(2.6rem, 7vw, 7rem);
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transform: rotate(90deg) translateX(40%);
            transform-origin: center;
        }

        .city-silhouette {
            position: absolute;
            right: 6vw;
            bottom: 18vh;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            width: min(520px, 44vw);
            height: 34vh;
            opacity: 0.72;
        }

        .city-silhouette span {
            flex: 1;
            min-width: 24px;
            border: 1px solid rgba(255, 250, 240, 0.08);
            border-radius: 10px 10px 0 0;
            background:
                repeating-linear-gradient(180deg, rgba(255, 250, 240, 0.08) 0 8px, transparent 8px 20px),
                linear-gradient(180deg, rgba(255, 250, 240, 0.08), rgba(0, 0, 0, 0.8));
            box-shadow: 0 18px 80px rgba(0, 0, 0, 0.4);
            transition: background 600ms ease, box-shadow 600ms ease, border-color 600ms ease;
        }

        .city-silhouette span:nth-child(1) { height: 38%; }
        .city-silhouette span:nth-child(2) { height: 68%; }
        .city-silhouette span:nth-child(3) { height: 48%; }
        .city-silhouette span:nth-child(4) { height: 88%; }
        .city-silhouette span:nth-child(5) { height: 58%; }
        .city-silhouette span:nth-child(6) { height: 74%; }

        .display-shell.is-reborn .city-silhouette span {
            border-color: rgba(255, 250, 240, 0.22);
            background:
                repeating-linear-gradient(180deg, rgba(255, 230, 132, 0.9) 0 8px, transparent 8px 20px),
                linear-gradient(180deg, rgba(255, 79, 136, 0.44), rgba(88, 242, 212, 0.18));
            box-shadow: 0 0 42px rgba(255, 107, 53, 0.28), 0 0 80px rgba(88, 242, 212, 0.16);
        }

        .qr-panel {
            position: absolute;
            right: 3vw;
            bottom: 3vw;
            display: grid;
            grid-template-columns: 112px minmax(0, 1fr);
            gap: 18px;
            width: min(460px, calc(100vw - 48px));
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: var(--overlay);
            backdrop-filter: blur(18px);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
        }

        .qr-placeholder {
            display: grid;
            place-items: center;
            width: 112px;
            height: 112px;
            border-radius: 18px;
            color: #111812;
            background:
                linear-gradient(90deg, #111812 12px, transparent 1%) center / 28px 28px,
                linear-gradient(#111812 12px, transparent 1%) center / 28px 28px,
                #fffaf0;
            font-size: 0.78rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            box-shadow: 0 0 0 8px rgba(255, 250, 240, 0.08);
        }

        .qr-copy {
            align-self: center;
        }

        .qr-copy strong {
            display: block;
            margin-bottom: 8px;
            color: var(--accent);
            font-size: 0.86rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .qr-copy p {
            margin: 0;
            font-size: 1.28rem;
            font-weight: 800;
            line-height: 1.35;
        }

        .qr-copy small {
            display: block;
            margin-top: 10px;
            color: var(--muted);
        }

        .participation-signal {
            position: absolute;
            left: 3vw;
            bottom: 3vw;
            width: min(420px, calc(100vw - 48px));
            padding: 22px 24px;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: var(--overlay);
            backdrop-filter: blur(18px);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
            transform: translateY(10px);
            opacity: 0.82;
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .participation-signal.is-active {
            opacity: 1;
            transform: translateY(0);
        }

        .participation-signal strong {
            display: block;
            margin-bottom: 10px;
            color: var(--accent);
            font-size: 0.86rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .participation-signal p {
            margin: 0;
            font-size: clamp(1.6rem, 4vw, 3.2rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.05em;
        }

        .participation-signal small {
            display: block;
            margin-top: 12px;
            color: var(--muted);
            font-size: 1rem;
        }

        @media (max-width: 720px) {
            .qr-panel {
                left: 16px;
                right: 16px;
                bottom: 16px;
                grid-template-columns: 88px 1fr;
                width: auto;
            }

            .qr-placeholder {
                width: 88px;
                height: 88px;
            }

            .qr-copy p {
                font-size: 1rem;
            }

            .participation-signal {
                left: 16px;
                right: 16px;
                bottom: 144px;
                width: auto;
            }

            .brand-strip,
            .live-ribbon,
            .city-silhouette {
                display: none;
            }
        }
    </style>
</head>
<body>
    <main class="display-shell">
        <video id="player" autoplay muted playsinline></video>

        <div class="brand-strip" aria-hidden="true">
            <span>Shinjuku Re:Light Fund</span>
            <b>Swipe to relight the city</b>
        </div>

        <div class="live-ribbon" aria-hidden="true">Re:Shinjuku</div>

        <div class="city-silhouette" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <section class="video-fallback" id="videoFallback" aria-live="polite">
            <div>
                <h1>新宿に、もう一度灯りを。</h1>
                <p>あなたの募金とスワイプが、少し静かになった街に希望を送り、新しい新宿の景色を立ち上げます。</p>
            </div>
        </section>

        <aside class="qr-panel" aria-label="スマホ参加QR案内">
            <div class="qr-placeholder" aria-hidden="true">QR</div>
            <div class="qr-copy">
                <strong>Join from phone</strong>
                <p>QRから募金に参加して、新宿を灯す</p>
                <small>スワイプで希望を送る</small>
            </div>
        </aside>

        <section class="participation-signal" id="participationSignal" aria-live="polite">
            <strong>Live participation</strong>
            <p><span id="displayParticipantCount">0</span> lights</p>
            <small id="displayParticipantStatus">新宿に灯りが戻るのを待っています</small>
        </section>
    </main>

    <script type="module" src="./src/player.js"></script>
</body>
</html>
