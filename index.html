<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOOH Display Player</title>
    <style>
        :root {
            --overlay: rgba(0, 0, 0, 0.68);
            --text: #fffaf0;
            --muted: rgba(255, 250, 240, 0.72);
            --accent: #ff6b35;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #050505;
            color: var(--text);
            font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
            overflow: hidden;
        }

        .display-shell {
            position: relative;
            width: 100vw;
            height: 100vh;
            background:
                radial-gradient(circle at 78% 18%, rgba(255, 107, 53, 0.2), transparent 28rem),
                #050505;
        }

        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            background: #050505;
        }

        .video-fallback {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 4vw;
            text-align: center;
            background:
                linear-gradient(135deg, rgba(255, 107, 53, 0.26), transparent 42%),
                #111812;
        }

        .video-fallback h1 {
            max-width: 980px;
            margin: 0;
            font-size: clamp(3rem, 8vw, 8rem);
            line-height: 0.95;
            letter-spacing: -0.08em;
        }

        .video-fallback p {
            max-width: 720px;
            margin: 24px auto 0;
            color: var(--muted);
            font-size: clamp(1rem, 2vw, 1.6rem);
            line-height: 1.7;
        }

        .qr-panel {
            position: absolute;
            right: 3vw;
            bottom: 3vw;
            display: grid;
            grid-template-columns: 112px minmax(0, 1fr);
            gap: 18px;
            width: min(460px, calc(100vw - 48px));
            padding: 18px;
            border: 1px solid rgba(255, 250, 240, 0.18);
            border-radius: 24px;
            background: var(--overlay);
            backdrop-filter: blur(18px);
        }

        .qr-placeholder {
            display: grid;
            place-items: center;
            width: 112px;
            height: 112px;
            border-radius: 18px;
            color: #111812;
            background:
                linear-gradient(90deg, #111812 12px, transparent 1%) center / 28px 28px,
                linear-gradient(#111812 12px, transparent 1%) center / 28px 28px,
                #fffaf0;
            font-size: 0.78rem;
            font-weight: 900;
            letter-spacing: 0.08em;
        }

        .qr-copy {
            align-self: center;
        }

        .qr-copy strong {
            display: block;
            margin-bottom: 8px;
            color: var(--accent);
            font-size: 0.86rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .qr-copy p {
            margin: 0;
            font-size: 1.28rem;
            font-weight: 800;
            line-height: 1.35;
        }

        .qr-copy small {
            display: block;
            margin-top: 10px;
            color: var(--muted);
        }

        @media (max-width: 720px) {
            .qr-panel {
                left: 16px;
                right: 16px;
                bottom: 16px;
                grid-template-columns: 88px 1fr;
                width: auto;
            }

            .qr-placeholder {
                width: 88px;
                height: 88px;
            }

            .qr-copy p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <main class="display-shell">
        <video id="player" autoplay muted playsinline></video>

        <section class="video-fallback" id="videoFallback" aria-live="polite">
            <div>
                <h1>DOOH Live Display</h1>
                <p>映像素材が読み込まれるまでの待機表示です。動画再生中はこの表示は自動で隠れます。</p>
            </div>
        </section>

        <aside class="qr-panel" aria-label="スマホ参加QR案内">
            <div class="qr-placeholder" aria-hidden="true">QR</div>
            <div class="qr-copy">
                <strong>Join from phone</strong>
                <p>スマホでQRを読み取って参加</p>
                <small>参加ページ: /web/participant-flow.html</small>
            </div>
        </aside>
    </main>

    <script type="module" src="./src/player.js"></script>
</body>
</html>
