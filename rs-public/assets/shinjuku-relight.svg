<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">新宿の街がモノクロから色づくビジュアル</title>
  <desc id="desc">左側は静かなモノクロの新宿、右側は寄付参加で明るく色づいた新宿を表す仮ビジュアル。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9efe4"/>
      <stop offset="0.45" stop-color="#e3ddd5"/>
      <stop offset="1" stop-color="#f9b35a"/>
    </linearGradient>
    <linearGradient id="street" x1="0" y1="0.55" x2="1" y2="1">
      <stop offset="0" stop-color="#272727"/>
      <stop offset="0.5" stop-color="#5b5149"/>
      <stop offset="1" stop-color="#e97132"/>
    </linearGradient>
    <linearGradient id="colorWash" x1="0.2" y1="0.3" x2="1" y2="0.9">
      <stop offset="0" stop-color="#5b5b5b" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#f6a340" stop-opacity="0.38"/>
      <stop offset="0.72" stop-color="#ee6b6e" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#156082" stop-opacity="0.52"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="windows" width="54" height="64" patternUnits="userSpaceOnUse">
      <rect x="10" y="12" width="12" height="18" rx="2" fill="#fff6cf" opacity="0.72"/>
      <rect x="32" y="12" width="12" height="18" rx="2" fill="#ff8c61" opacity="0.72"/>
      <rect x="10" y="40" width="12" height="14" rx="2" fill="#ffffff" opacity="0.38"/>
      <rect x="32" y="40" width="12" height="14" rx="2" fill="#f6a340" opacity="0.58"/>
    </pattern>
    <clipPath id="leftHalf">
      <rect width="800" height="1000"/>
    </clipPath>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="#f7f2ea" opacity="0.42"/>
  <path d="M0 645 C250 590 430 625 640 600 C900 570 1130 590 1600 520 L1600 1000 L0 1000 Z" fill="url(#street)"/>

  <g opacity="0.96">
    <path d="M120 230 h170 v510 h-170z" fill="#343434"/>
    <path d="M330 150 h220 v610 h-220z" fill="#202020"/>
    <path d="M600 260 h170 v500 h-170z" fill="#3a3a3a"/>
    <path d="M820 120 h220 v650 h-220z" fill="#252525"/>
    <path d="M1085 210 h160 v550 h-160z" fill="#6b2a2a"/>
    <path d="M1280 95 h210 v705 h-210z" fill="#2b4556"/>
  </g>

  <g opacity="0.86">
    <path d="M150 265 h108 v454 h-108z" fill="url(#windows)" opacity="0.24"/>
    <path d="M365 190 h150 v535 h-150z" fill="url(#windows)" opacity="0.32"/>
    <path d="M632 300 h105 v420 h-105z" fill="url(#windows)" opacity="0.32"/>
    <path d="M855 165 h150 v560 h-150z" fill="url(#windows)" opacity="0.62"/>
    <path d="M1110 245 h110 v470 h-110z" fill="url(#windows)" opacity="0.8"/>
    <path d="M1318 136 h138 v590 h-138z" fill="url(#windows)" opacity="0.72"/>
  </g>

  <g clip-path="url(#leftHalf)">
    <rect width="800" height="1000" fill="#d8d8d8" opacity="0.55"/>
    <rect width="800" height="1000" fill="#2a2a2a" opacity="0.28"/>
    <path d="M0 645 C250 590 430 625 640 600 C700 594 760 590 800 586 L800 1000 L0 1000 Z" fill="#1f1f1f" opacity="0.36"/>
  </g>

  <rect x="772" y="0" width="54" height="1000" fill="#fffaf0" opacity="0.62"/>
  <rect x="792" y="0" width="9" height="1000" fill="#141414" opacity="0.18"/>
  <rect width="1600" height="1000" fill="url(#colorWash)"/>

  <g filter="url(#softGlow)">
    <circle cx="1038" cy="384" r="76" fill="#f6a340" opacity="0.82"/>
    <circle cx="1245" cy="486" r="42" fill="#ee6b6e" opacity="0.72"/>
    <circle cx="1380" cy="315" r="36" fill="#fff1a8" opacity="0.68"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M106 835 C350 760 548 806 760 740 C972 674 1215 724 1510 626" stroke="#fffaf0" stroke-width="10" opacity="0.82"/>
    <path d="M160 920 C420 832 646 872 860 802 C1080 730 1288 790 1536 700" stroke="#f6a340" stroke-width="6" opacity="0.78"/>
  </g>

  <g fill="#fffaf0" opacity="0.94">
    <circle cx="1010" cy="704" r="10"/>
    <circle cx="1090" cy="668" r="8"/>
    <circle cx="1198" cy="704" r="11"/>
    <circle cx="1292" cy="650" r="8"/>
    <circle cx="1372" cy="680" r="10"/>
  </g>

  <g fill="#141414" opacity="0.68">
    <path d="M220 812 l24 188 h-48z"/>
    <circle cx="220" cy="788" r="18"/>
    <path d="M302 846 l18 154 h-38z"/>
    <circle cx="302" cy="824" r="15"/>
    <path d="M410 820 l24 180 h-52z"/>
    <circle cx="410" cy="796" r="19"/>
  </g>
</svg>
