    .arrow {

    .arrowhead::after { position:absolute; inset:-7px; border-radius:50%; content:""; opacity:var(--c); background:radial-gradient(circle,rgba(var(--gold),.7),transparent 68%); filter:blur(4px); }

    .fletching::after { left:9px; background:rgba(var(--coral),.8); clip-path:polygon(0 0,100% 72%,0 100%); }
    .name {

      border-radius:50%; background:rgba(255,255,253,.97); box-shadow:0 12px 28px rgba(39,44,41,.12),inset 0 0 0 5px rgba(39,44,41,.025);
      color:#282d2a; transform:translate(-50%,var(--p)); z-index:5; touch-action:none;

    .guide span { display:block; margin-top:7px; color:#9a9e9b; font-size:8px; letter-spacing:.12em; }
    .phone.ready .portal::before { width:120px; background:linear-gradient(90deg,rgba(var(--blue),.3),rgba(var(--coral),.55),rgba(var(--gold),.3)); box-shadow:0 0 12px rgba(var(--coral),.2); }
    .phone.ready .name { border-color:rgba(var(--gold),.52); }

    .phone.launching .arrow,.phone.launching .name { animation:shoot .92s cubic-bezier(.18,.74,.14,1) forwards; }
    .phone.launching .bow { animation:recoil .65s cubic-bezier(.15,.7,.25,1); }
    .phone.launching .trajectory { animation:flightTrace .92s ease-out forwards; }
    .phone.launching .release-wave { animation:releaseWave .72s cubic-bezier(.12,.68,.2,1) forwards; }
    .phone.launching { animation:bodyKick .46s cubic-bezier(.18,.7,.2,1); }
    .phone.launching .light-cone { animation:lightLaunch .94s cubic-bezier(.12,.68,.18,1) forwards; }
    .phone.launching .light-ribs { animation:ribsLaunch .8s ease-out forwards; }
    .phone.arrived .portal::before { animation:boundary 1.05s cubic-bezier(.2,.72,.2,1); }
    .phone.arrived .portal::after { animation:impact 1.05s ease-out; }

    .phone.arrived { box-shadow:0 38px 100px rgba(30,35,32,.15),0 0 54px rgba(var(--gold),.25); }
    .phone.arrived .axis { animation:axisFlash .9s ease-out; }
    @keyframes shoot { 0%{transform:translate(-50%,var(--p));opacity:1} 15%{transform:translate(-50%,calc(var(--p) + 12px)) scaleY(.96)} 100%{transform:translate(-50%,-650px) scale(.42,1.15);opacity:0} }
    @keyframes recoil { 30%{transform:translateX(-50%) scaleX(.95) scaleY(1.04)} 100%{transform:translateX(-50%)} }
    @keyframes flightTrace { 20%{opacity:1;filter:brightness(1.6)} 100%{opacity:0;transform:translateX(-50%) translateY(-300px) scaleX(.16)} }
    @keyframes breathe { to{transform:scale(1.045);opacity:.62} }
    @keyframes tensionPop { 45%{filter:brightness(1.035);transform:scale(.997)} }
    @keyframes bodyKick { 18%{transform:translateY(3px)} 43%{transform:translateY(-2px)} 100%{transform:none} }
    @keyframes releaseWave { 0%{opacity:0;transform:translate(-50%,-50%) scale(.3)} 22%{opacity:1} 100%{opacity:0;transform:translate(-50%,-50%) scale(6.8);border-color:rgba(var(--coral),.05)} }
    @keyframes axisFlash { 28%{width:2px;background:linear-gradient(#fff,rgba(var(--gold),.8),rgba(var(--coral),.24),transparent);filter:drop-shadow(0 0 8px rgba(var(--gold),.7))} }

  </style>

<body>
  <main class="phone" id="phone">

  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const embedded = params.get("embedded") === "1";
      const language = params.get("lang") === "en" ? "en" : "ja";
      document.documentElement.dataset.embedded = String(embedded);
      const $ = s => document.querySelector(s), phone=$("#phone"), area=$("#interaction"), token=$("#token");
      const left=$("#leftString"), right=$("#rightString"), nock=$("#nock"), limb=$("#limb"), limbShadow=$("#limbShadow"), limbColor=$("#limbColor");
      const message=$("#message"), sub=$("#sub"), guide=$("#guide"), guideSub=$("#guideSub"), link=$("#link"), drawValue=$("#drawValue");
      const participantName = $("#participantName");
      participantName.textContent = (params.get("name") || (language === "en" ? "YOU" : "あなた")).trim().slice(0,24);
      let id=null,startY=0,pull=0,target=0,shown=0,launching=false,completed=false,lastHaptic=0,readyBuzzed=false; const readyAt=76,max=118;

        drawValue.textContent=String(Math.round(c*100)).padStart(2,"0");
        left.setAttribute("d",`M10 50 L176 ${y}`); right.setAttribute("d",`M342 50 L176 ${y}`); nock.setAttribute("cy",y);
        const d=`M10 50 Q72 ${74+bend*.22} 176 ${bend} Q280 ${74+bend*.22} 342 50`;
        limb.setAttribute("d",d); limbShadow.setAttribute("d",d); limbColor.setAttribute("d",d); requestAnimationFrame(frame);
      }
      function copy(c,ready){
        if(ready){message.textContent="新宿へ放つ準備ができました。";sub.textContent="指を離してください";guide.textContent="READY — 離して送る";guideSub.textContent="FULL DRAW / DOOH LINK";}
        else if(c>.08){message.textContent="弦の力が、街への光になる。";sub.textContent=`接続強度 ${Math.round(c*100)}%`;guide.textContent="そのまま、深く";guideSub.textContent="矢に彩りを込めています";}
        else{message.textContent="名前を、光の矢に。";sub.textContent="下へ引くと新宿との接続が深まります";guide.textContent="矢を下へ引いて、離す";guideSub.textContent="深く引くと送信できます";}
      }
      function down(e){if(launching||id!==null||(e.pointerType==="mouse"&&e.button!==0))return;e.preventDefault();id=e.pointerId;startY=e.clientY;pull=0;lastHaptic=0;readyBuzzed=false;vibrate(8);area.setPointerCapture?.(id)}
      function move(e){if(e.pointerId!==id||launching)return;e.preventDefault();pull=max*(1-Math.exp(-Math.max(0,e.clientY-startY)/96));target=pull;const c=clamp(pull/readyAt,0,1),ready=pull>=readyAt,step=Math.min(3,Math.floor(c*4));phone.classList.toggle("ready",ready);copy(c,ready);
        if(step>lastHaptic&&!ready){lastHaptic=step;vibrate(7+step*3);pulse()}
        if(ready&&!readyBuzzed){readyBuzzed=true;vibrate([18,28,26]);pulse()}

      function up(e){if(e.pointerId!==id||launching)return;area.releasePointerCapture?.(id);id=null;pull>=readyAt?launch():reset()}
      function reset(){target=0;pull=0;lastHaptic=0;readyBuzzed=false;phone.classList.remove("ready","tension-pop");copy(0,false)}
      function launch(){launching=true;phone.classList.add("launching");message.textContent=language === "en" ? "Your light is heading to Shinjuku." : "光の矢が、新宿へ。";sub.textContent="LIVE UPLINK";guide.textContent=language === "en" ? "SENDING" : "送信しています";guideSub.textContent="SHINJUKU DOOH";vibrate([28,22,48,18,30]);
        setTimeout(()=>{phone.classList.add("arrived");vibrate([36,26,72]);link.textContent=language === "en" ? `${participantName.textContent}'s color is heading to Shinjuku` : `${participantName.textContent}さんの彩りが、新宿へ`;message.textContent=language === "en" ? "It reached the Shinjuku DOOH" : "新宿DOOHに届きました";sub.textContent=language === "en" ? "Your name becomes part of the city light" : "あなたの名前が、街の光になります"},760);
        setTimeout(()=>{
          phone.classList.remove("launching","ready");target=shown=pull=0;completed=embedded;
          if(embedded){window.parent.postMessage({type:"dooh-color-membrane-complete"},location.origin)}
        },1120);
        setTimeout(()=>{if(completed)return;phone.classList.remove("arrived");link.textContent="新宿DOOHと接続中";launching=false;reset()},2700)}
      area.addEventListener("pointerdown",down);area.addEventListener("pointermove",move,{passive:false});area.addEventListener("pointerup",up);area.addEventListener("pointercancel",up);requestAnimationFrame(frame);
    })();
  </script>
