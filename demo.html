<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- ホーム画面に追加して起動するとブラウザUIなしの全画面（プロジェクター表示用） -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="新宿DOOH" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#050606" />
    <title>新宿インク演出デモ</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.skypack.dev" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700&family=Hanken+Grotesk:wght@400;600;700&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet" />
    <style>
        /* モノクロ大理石テーマ（theme-men.css / SHINJUKU GIVE に準拠） */
        :root {
            --ink: #151919;
            --ink-strong: #050606;
            --ink-2: #5c5f60;
            --silver: #c8c8c8;
            --line: rgba(21, 25, 25, 0.14);
            --line-soft: rgba(21, 25, 25, 0.08);
            --font-sans: "Hanken Grotesk", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
            --font-serif: "EB Garamond", "Noto Sans JP", serif;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            color: var(--ink);
            font-family: var(--font-sans);
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* 大理石の壁（参加サイトと同じ床面） */
        body {
            background:
                radial-gradient(ellipse at 16% 8%, rgba(255, 255, 255, 0.96) 0 12%, transparent 34%),
                radial-gradient(ellipse at 82% 18%, rgba(230, 230, 230, 0.5) 0 14%, transparent 36%),
                radial-gradient(ellipse at 42% 88%, rgba(190, 190, 190, 0.18) 0 14%, transparent 38%),
                linear-gradient(118deg, transparent 0 29%, rgba(21, 21, 21, 0.052) 30%, transparent 33% 100%),
                linear-gradient(128deg, transparent 0 47%, rgba(21, 21, 21, 0.12) 48%, rgba(21, 21, 21, 0.03) 49%, transparent 51% 100%),
                linear-gradient(24deg, transparent 0 64%, rgba(48, 48, 48, 0.07) 65%, transparent 68% 100%),
                #f8f8f8;
        }

        /* ステージ：画面全体が新宿の写真。黒地に飛沫を screen で累積リビール */
        .stage {
            position: fixed;
            inset: 0;
            background: #050606;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
            isolation: isolate;
        }

        /* 待機画面：いま入れた新宿の写真をそのまま全画面表示 */
        .base-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
        }

        .ink-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            /* 全画面いっぱいに新宿を表示 */
            object-fit: cover;
            z-index: 1;
            opacity: 0;
            /* 黒背景を透過させ、飛沫の明部だけを累積させる */
            mix-blend-mode: screen;
            will-change: transform, opacity, filter;
            pointer-events: none;
        }

        .ink-layer.is-revealed { opacity: 1; }

        /* 仕上げの一枚：飛沫ではなく完成版の新宿をくっきり最前面に重ねる */
        .final-layer {
            z-index: 2;
            mix-blend-mode: normal;
        }

        .warm-layer {
            z-index: 3;
            opacity: 0;
            mix-blend-mode: normal;
            filter: sepia(0.2) saturate(1.18) brightness(1.06);
            transition: opacity 1800ms ease, filter 1800ms ease;
        }

        .warm-layer.is-revealed {
            opacity: 1;
            filter: sepia(0.32) saturate(1.3) brightness(1.1);
        }

        /* 全点灯時に画面全体をふわっと持ち上げる（白〜銀のモノクロ光） */
        .stage.is-complete::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 46%, rgba(255, 255, 255, 0.16), transparent 58%),
                radial-gradient(circle at 50% 46%, rgba(200, 200, 200, 0.12), transparent 72%);
            mix-blend-mode: screen;
            animation: glowPulse 3.2s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* ===== ロワーサード：上下のグラデーションで画像を覆わず文字を載せる ===== */
        .scrim {
            position: fixed;
            left: 0;
            right: 0;
            z-index: 3;
            pointer-events: none;
        }

        .scrim-top {
            top: 0;
            height: 22vh;
            background: linear-gradient(to bottom, rgba(5, 6, 6, 0.62), rgba(5, 6, 6, 0) 100%);
        }

        .scrim-bottom {
            bottom: 0;
            height: 42vh;
            background: linear-gradient(to top, rgba(5, 6, 6, 0.9) 0%, rgba(5, 6, 6, 0.62) 26%, rgba(5, 6, 6, 0) 100%);
        }

        /* ブランド（左上） */
        .brandbar {
            position: fixed;
            top: clamp(20px, 2.6vw, 44px);
            left: clamp(22px, 2.8vw, 52px);
            z-index: 5;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-serif);
            font-weight: 600;
            letter-spacing: 0.06em;
            font-size: clamp(1rem, 1.5vw, 1.5rem);
            color: #fff;
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6);
        }

        .brandbar::before {
            content: "";
            width: 11px; height: 11px;
            border-radius: 999px;
            background: #fff;
            box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.16), 0 0 16px rgba(255, 255, 255, 0.6);
            animation: livePulse 1.6s ease-in-out infinite;
        }

        @keyframes livePulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.7); opacity: 0.55; }
        }

        /* 操作ヒント／LIVE状態（ブランドの下） */
        .hint {
            position: fixed;
            top: clamp(56px, 5.4vw, 96px);
            left: clamp(22px, 2.8vw, 52px);
            z-index: 5;
            font-size: clamp(0.72rem, 1vw, 0.92rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.72);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
            transition: opacity 400ms ease;
            pointer-events: none;
        }

        /* 下部ドック：左＝参加カウント／右＝QR＋CTA */
        .dock {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 5;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: clamp(24px, 4vw, 80px);
            padding: clamp(24px, 3.4vw, 64px) clamp(26px, 3.4vw, 68px);
            pointer-events: none;
        }

        .live { position: relative; min-width: 0; color: #fff; }

        .live > .label,
        .live > .value,
        .cta,
        .thanks {
            transition: opacity 900ms ease, transform 900ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 完成映像の切替中は、固定情報を残しつつ映像へ視線を譲る。 */
        body.is-scene-focus .live > .label,
        body.is-scene-focus .live > .value {
            opacity: 0.28;
            transform: translateY(8px);
        }

        body.is-scene-focus .cta {
            opacity: 0.42;
            transform: translateY(8px) scale(0.96);
        }

        body.is-scene-focus .thanks {
            opacity: 0.08;
            transform: translateY(-4px);
        }

        body.is-scene-focus .supporter-comment-wall {
            opacity: 0.96;
            transform: translateY(0) scale(1.02);
            border-color: rgba(255, 255, 255, 0.28);
            box-shadow: 0 18px 52px rgba(0, 0, 0, 0.3), 0 0 24px rgba(255, 255, 255, 0.08);
        }

        /* 複数の寄付者名を連結して右から左へ流し続ける放送テロップ。 */
        .thanks {
            position: fixed;
            top: clamp(84px, 12vh, 150px);
            left: 0;
            right: 0;
            z-index: 7;
            margin: 0;
            overflow: hidden;
            font-family: var(--font-sans);
            font-weight: 700;
            font-size: clamp(0.72rem, 1.05vw, 1rem);
            color: rgba(255, 255, 255, 0.82);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.42);
            pointer-events: none;
        }

        .thanks-track {
            display: flex;
            width: max-content;
            will-change: transform;
            animation: donor-ticker var(--ticker-duration, 36s) linear infinite;
        }

        .thanks-group {
            display: flex;
            align-items: center;
            gap: 0.85em;
            flex: none;
            min-width: 100vw;
            box-sizing: border-box;
            padding: clamp(6px, 0.55vw, 9px) clamp(22px, 3vw, 52px);
            border-block: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(15, 18, 18, 0.38);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            white-space: nowrap;
        }

        .ticker-name {
            color: rgba(255, 255, 255, 0.82);
        }

        .ticker-name.is-returning.streak-2,
        .ticker-name.is-returning.streak-3,
        .ticker-name.is-returning.streak-4,
        .ticker-name.is-returning.streak-5,
        .ticker-name.is-returning.streak-6,
        .ticker-name.is-returning.streak-7 {
            color: var(--returning-color, #ffc56d);
            text-shadow: 0 0 10px color-mix(in srgb, var(--returning-color, #ffc56d) 58%, transparent);
        }

        .ticker-name.is-latest {
            padding: 3px 9px;
            border: 1px solid rgba(255, 255, 255, 0.52);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.18);
        }

        .streak-2 { --returning-color: #ffc56d; }
        .streak-3 { --returning-color: #ff8a80; }
        .streak-4 { --returning-color: #f48fb1; }
        .streak-5 { --returning-color: #c5a3ff; }
        .streak-6 { --returning-color: #80d8ff; }
        .streak-7 { --returning-color: #7ee2b8; }

        .ticker-separator {
            color: rgba(255, 255, 255, 0.62);
        }

        @keyframes donor-ticker {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* 参加した瞬間だけ、寄付者名テロップとは別に表示するお礼通知。 */
        .participation-thanks {
            position: absolute;
            bottom: calc(100% + 4px);
            left: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: clamp(5px, 0.55vw, 9px);
            width: min(58vw, 720px);
            color: #fff;
            font-family: var(--font-serif);
            pointer-events: none;
        }

        .participation-thanks-item {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            max-width: 100%;
            padding: clamp(5px, 0.5vw, 8px) clamp(10px, 1vw, 16px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            background: rgba(15, 18, 18, 0.54);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            font-size: clamp(0.78rem, 1.18vw, 1.12rem);
            font-weight: 600;
            line-height: 1.25;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.6);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.14);
            white-space: nowrap;
            animation: participation-stack-in 420ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .participation-thanks-item::before {
            content: "";
            width: 8px;
            height: 8px;
            flex: none;
            border-radius: 999px;
            background: currentColor;
            box-shadow: 0 0 10px currentColor;
        }

        .participation-thanks-item.is-returning.streak-2,
        .participation-thanks-item.is-returning.streak-3,
        .participation-thanks-item.is-returning.streak-4,
        .participation-thanks-item.is-returning.streak-5,
        .participation-thanks-item.is-returning.streak-6,
        .participation-thanks-item.is-returning.streak-7 {
            color: var(--returning-color, #ffc56d);
            text-shadow: 0 2px 16px color-mix(in srgb, var(--returning-color, #ffc56d) 48%, #000);
        }

        .participation-thanks-item.is-leaving {
            animation: participation-stack-out 460ms ease-in both;
        }

        @keyframes participation-stack-in {
            from { opacity: 0; transform: translateY(18px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes participation-stack-out {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-16px); }
        }

        .supporter-comment-wall {
            position: fixed;
            top: clamp(122px, 17vh, 210px);
            right: clamp(26px, 3.4vw, 68px);
            z-index: 6;
            width: min(31vw, 430px);
            min-width: 280px;
            padding: clamp(10px, 1vw, 15px) clamp(14px, 1.35vw, 22px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: clamp(16px, 1.45vw, 24px);
            background: linear-gradient(135deg, rgba(15, 18, 18, 0.7), rgba(15, 18, 18, 0.46));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            box-shadow: 0 14px 38px rgba(0, 0, 0, 0.22);
            pointer-events: none;
            transition: opacity 900ms ease, transform 900ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        .supporter-comment-wall[hidden] {
            display: none;
        }

        .supporter-comment-wall.is-switching {
            animation: supporter-comment-in 520ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .supporter-comment-kicker {
            display: block;
            margin-bottom: 5px;
            font-size: clamp(0.58rem, 0.72vw, 0.76rem);
            font-weight: 700;
            letter-spacing: 0.16em;
            color: rgba(255, 255, 255, 0.64);
        }

        .supporter-comment-text {
            margin: 0;
            font-family: var(--font-serif);
            font-size: clamp(0.94rem, 1.22vw, 1.3rem);
            font-weight: 600;
            line-height: 1.32;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.55);
        }

        .supporter-comment-name {
            display: block;
            margin-top: 7px;
            font-size: clamp(0.62rem, 0.78vw, 0.82rem);
            font-weight: 700;
            color: rgba(255, 255, 255, 0.72);
        }

        @keyframes supporter-comment-in {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 900px) {
            .supporter-comment-wall {
                top: clamp(110px, 14vh, 150px);
                right: clamp(18px, 3vw, 28px);
                width: min(42vw, 360px);
                min-width: 240px;
            }
        }

        .stage.is-returning-pulse::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 4;
            pointer-events: none;
            background:
                radial-gradient(circle at 30% 70%, color-mix(in srgb, var(--returning-color, #ffc56d) 34%, transparent), transparent 38%),
                radial-gradient(circle at 70% 30%, color-mix(in srgb, var(--returning-color, #ffc56d) 20%, transparent), transparent 46%);
            mix-blend-mode: screen;
            animation: returningPulse 2600ms ease-out both;
        }

        @keyframes returningPulse {
            0% { opacity: 0; }
            25% { opacity: 1; }
            100% { opacity: 0; }
        }

        .live .value span.num { display: inline-block; }

        body.is-live-broadcast .thanks,
        body.is-live-broadcast .supporter-comment-wall {
            display: none !important;
        }

        body.is-live-broadcast .participation-thanks {
            left: clamp(26px, 3.4vw, 68px);
            bottom: clamp(200px, 19vw, 330px);
        }

        body.is-live-broadcast .cta-copy strong {
            font-size: clamp(1rem, 1.6vw, 1.55rem);
        }

        .live .label {
            display: block;
            font-size: clamp(0.7rem, 1vw, 0.95rem);
            font-weight: 700;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.74);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
        }

        .live .value {
            display: flex;
            align-items: baseline;
            gap: 0.18em;
            margin: 2px 0 14px;
            font-family: var(--font-serif);
            font-weight: 600;
            font-size: clamp(3rem, 8vw, 7rem);
            line-height: 0.86;
            letter-spacing: -0.01em;
            font-variant-numeric: tabular-nums;
            color: #fff;
            text-shadow: 0 6px 30px rgba(0, 0, 0, 0.55);
        }

        .live .value span.unit {
            font-family: var(--font-sans);
            font-size: 0.26em;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.82);
        }

        .progress-wrap { width: min(460px, 52vw); }

        .progress-text {
            margin: 0 0 10px;
            font-family: var(--font-serif);
            font-size: clamp(1.05rem, 2vw, 1.7rem);
            font-weight: 600;
            color: #fff;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.6);
        }

        .progress-text.is-complete { color: #fff; }

        .transition-countdown {
            min-height: 1.4em;
            margin: -2px 0 10px;
            font-size: clamp(0.72rem, 1vw, 0.94rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.82);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.58);
        }

        .transition-countdown:empty {
            display: none;
        }

        .challenge-label {
            display: block;
            margin-bottom: 6px;
            font-size: clamp(0.66rem, 0.9vw, 0.82rem);
            font-weight: 700;
            letter-spacing: 0.16em;
            color: rgba(255, 255, 255, 0.7);
        }

        .progress-bar {
            height: 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.18);
            overflow: hidden;
        }

        .progress-bar span {
            display: block;
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: linear-gradient(90deg, #ffffff, #c8c8c8);
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.5);
            transition: width 600ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ===== QR＋CTA（右下：視線の終着点・既存DOOHと同じ参加リンク） ===== */
        .cta {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: clamp(14px, 1.4vw, 22px);
            pointer-events: auto;
        }

        .cta-copy { text-align: right; color: #fff; }

        .cta-copy strong {
            display: block;
            font-family: var(--font-serif);
            font-weight: 600;
            font-size: clamp(1.1rem, 1.8vw, 1.8rem);
            line-height: 1.1;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.6);
        }

        .cta-copy small {
            display: block;
            margin-top: 8px;
            font-size: clamp(0.74rem, 1vw, 0.95rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.82);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
        }

        .qr-code {
            width: clamp(148px, 15vw, 220px);
            padding: 12px;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5);
            line-height: 0;
        }

        /* 正方形のQRを等比表示。qrcodeライブラリが付ける inline style を !important で上書き */
        .qr-code canvas, .qr-code img {
            display: block;
            width: 100% !important;
            height: auto !important;
            aspect-ratio: 1;
        }

        /* QR遷移先の確認用。通常表示では隠し、?dev のときだけ表示する。 */
        .url-note {
            display: none;
            position: fixed;
            left: clamp(26px, 3.4vw, 68px);
            bottom: clamp(10px, 1.2vw, 18px);
            z-index: 5;
            font-size: clamp(0.6rem, 0.82vw, 0.76rem);
            letter-spacing: 0.02em;
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
        }

        .url-note.is-dev-visible {
            display: block;
        }

        /* 操作系（デモ用ツール）：右上 */
        .tools {
            position: fixed;
            top: clamp(16px, 2.4vw, 36px);
            right: clamp(16px, 2.4vw, 36px);
            z-index: 6;
            display: flex;
            gap: 10px;
        }

        .tools button {
            pointer-events: auto;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid rgba(21, 25, 25, 0.18);
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--ink);
            font-family: var(--font-sans);
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(21, 25, 25, 0.08);
            transition: transform 120ms ease, border-color 160ms ease, background 160ms ease;
        }

        .tools button:hover { border-color: var(--ink); }
        .tools button:active { transform: scale(0.94); }
        .tools button.is-on {
            border-color: var(--ink);
            background: var(--ink);
            color: #fff;
        }
    </style>
</head>
<body>
    <main class="stage" id="stage" aria-label="新宿インク演出デモ">
        <img class="base-layer" src="assets/ink/Shinjuku_06_0-00-00-00_1.jpg" alt="" decoding="async" />
    </main>

    <div class="scrim scrim-top" aria-hidden="true"></div>
    <div class="scrim scrim-bottom" aria-hidden="true"></div>

    <div class="brandbar">SHINJUKU DOOH</div>
    <div class="hint" id="hint">画面クリック / スペースキー で参加者 +1</div>
    <div class="dock">
        <div class="live">
            <div class="participation-thanks" id="participationThanks" aria-live="polite"></div>
            <p class="thanks" id="thanks" aria-hidden="true"></p>
            <section class="supporter-comment-wall" id="supporterCommentWall" aria-live="polite" hidden>
                <span class="supporter-comment-kicker">クラファン支援者からのメッセージ</span>
                <p class="supporter-comment-text" id="supporterCommentText"></p>
                <small class="supporter-comment-name" id="supporterCommentName"></small>
            </section>
            <span class="label">合計金額</span>
            <span class="value"><span class="unit">¥</span><span class="num" id="countNum">0</span></span>
            <div class="progress-wrap">
                <span class="challenge-label" id="challengeLabel">第1回 点灯チャレンジ</span>
                <p class="progress-text" id="progressText">あと9人で取り組みが見えてくる</p>
                <p class="transition-countdown" id="transitionCountdown" aria-live="polite"></p>
                <div class="progress-bar"><span id="progressBar"></span></div>
            </div>
        </div>

        <aside class="cta" aria-label="スマホ参加QR案内">
            <div class="cta-copy">
                <strong>スマホで無料寄付に参加</strong>
                <small id="qrCaption">街への応援寄付に参加</small>
            </div>
            <div class="qr-code" id="qrCode" aria-hidden="true">QR</div>
        </aside>
    </div>

    <div class="url-note" id="urlNote">https://dooh-ca9c2.web.app/men</div>

    <div class="tools">
        <button id="addBtn" type="button">＋ 1人参加</button>
        <button id="completeBtn" type="button" hidden>達成まで進める</button>
        <button id="skipSceneBtn" type="button" hidden>⏭ 次の場面へ</button>
        <button id="newParticipantTestBtn" type="button" hidden>新規参加を再現</button>
        <button id="returningParticipantTestBtn" type="button" hidden>通算2〜7日参加を再現</button>
        <button id="crowdTestBtn" type="button" hidden>50人同時参加を再現</button>
        <button id="autoBtn" type="button">▶ 自動</button>
        <button id="resetBtn" type="button">↺ リセット</button>
    </div>

    <script>
        const TOTAL = 9;
        // ?dev で開くと、Firebase連動中でも手動ツールで動作確認できる（QR不要）
        const params = new URLSearchParams(location.search);
        const DONATION_PER_PERSON_YEN = 100; // 1参加あたりのデモ募金額（publishSwipeComplete の donationAmountYen と一致）
        const DEV = params.has("dev");
        const DEMO_MODE = params.has("demo");
        const LIVE_BROADCAST_MODE = params.has("live") || params.has("youtube") || params.has("broadcast");
        const MANUAL_MODE = DEV || DEMO_MODE;
        document.body.classList.toggle("is-live-broadcast", LIVE_BROADCAST_MODE);
        const stage = document.getElementById("stage");
        const countNum = document.getElementById("countNum");
        const progressText = document.getElementById("progressText");
        const progressBar = document.getElementById("progressBar");
        const challengeLabel = document.getElementById("challengeLabel");
        const transitionCountdown = document.getElementById("transitionCountdown");
        const hint = document.getElementById("hint");
        const participationThanks = document.getElementById("participationThanks");
        const liveLabel = document.querySelector(".live > .label");
        const liveUnit = document.querySelector(".live > .value .unit");
        const ctaTitle = document.querySelector(".cta-copy strong");
        const qrCaption = document.getElementById("qrCaption");
        const addBtn = document.getElementById("addBtn");
        const autoBtn = document.getElementById("autoBtn");
        const resetBtn = document.getElementById("resetBtn");
        const completeBtn = document.getElementById("completeBtn");
        const skipSceneBtn = document.getElementById("skipSceneBtn");
        const newParticipantTestBtn = document.getElementById("newParticipantTestBtn");
        const returningParticipantTestBtn = document.getElementById("returningParticipantTestBtn");
        const crowdTestBtn = document.getElementById("crowdTestBtn");
        const urlNote = document.getElementById("urlNote");

        urlNote?.classList.toggle("is-dev-visible", DEV);
        newParticipantTestBtn.hidden = !MANUAL_MODE;
        returningParticipantTestBtn.hidden = !MANUAL_MODE;
        crowdTestBtn.hidden = !MANUAL_MODE;
        if (DEMO_MODE) {
            completeBtn.hidden = false;
            skipSceneBtn.hidden = false;
        }

        // 飛沫レイヤーを9枚生成（黒地は screen 合成で透過 → 明部だけ累積）
        const layers = [];
        for (let i = 1; i <= TOTAL; i++) {
            const img = document.createElement("img");
            img.className = "ink-layer";
            img.src = `assets/ink/${String(i).padStart(2, "0")}.jpg`;
            img.alt = "";
            img.decoding = "async";
            stage.appendChild(img);
            layers.push(img);
        }

        // 9枚が出揃った最後に重ねる仕上げの一枚
        const finalLayer = document.createElement("img");
        finalLayer.className = "ink-layer final-layer";
        finalLayer.src = "assets/ink/Shinjuku_11.png";
        finalLayer.alt = "";
        finalLayer.decoding = "async";
        stage.appendChild(finalLayer);

        const warmLayer = document.createElement("img");
        warmLayer.className = "ink-layer warm-layer";
        warmLayer.src = "assets/ink/Shinjuku_warm.jpg";
        warmLayer.alt = "";
        warmLayer.decoding = "async";
        stage.appendChild(warmLayer);

        let count = 0;          // 累計参加者
        let revealed = 0;       // 既に出ている飛沫レイヤー数
        let autoTimer = null;
        let liveActive = false; // Firebaseの実カウントに連動中か
        let celebrationTimer = null;
        let warmTimer = null;
        let countdownTimer = null;
        let celebrationActive = false;
        let celebrationStartedAt = 0;
        let activeChallengeNumber = 0;
        let liveCountInitialized = false;
        let visualizedLiveCount = 0;
        let liveVisualTimer = null;
        let queuedRevealCount = 0;
        let queuedReplayTimer = null;
        let queuedReplayHoldTimer = null;
        let donorNameTestIndex = 0;
        const SCENE_TIME_SCALE = params.has("fast") ? 0.1 : 1;
        const CLEAN_SCENE_MS = 7_000 * SCENE_TIME_SCALE;
        const LIVE_REVEAL_INTERVAL_MS = 260;
        const QUEUED_REPLAY_HOLD_MS = 5_000 * SCENE_TIME_SCALE;
        const QUEUED_REPLAY_INTERVAL_MS = 700 * SCENE_TIME_SCALE;

        // インクが飛び散る「ポップ」アニメーション
        function splat(el) {
            el.animate(
                [
                    { transform: "scale(0.28) rotate(-7deg)", filter: "blur(14px)", opacity: 0, offset: 0 },
                    { transform: "scale(1.12) rotate(2deg)", filter: "blur(1px)", opacity: 1, offset: 0.55 },
                    { transform: "scale(0.97) rotate(-1deg)", filter: "blur(0px)", opacity: 1, offset: 0.78 },
                    { transform: "scale(1) rotate(0deg)", filter: "blur(0px)", opacity: 1, offset: 1 },
                ],
                { duration: 720, easing: "cubic-bezier(0.18, 1.25, 0.32, 1)", fill: "both" }
            );
        }

        function updateHud() {
            countNum.textContent = LIVE_BROADCAST_MODE
                ? `${count.toLocaleString("ja-JP")}人`
                : (count * DONATION_PER_PERSON_YEN).toLocaleString("ja-JP");
            const remaining = Math.max(0, TOTAL - revealed);
            const done = revealed >= TOTAL || celebrationActive;
            if (challengeLabel) {
                const challengeNumber = celebrationActive
                    ? activeChallengeNumber
                    : Math.floor(count / TOTAL) + 1;
                challengeLabel.textContent = `第${challengeNumber}回 点灯チャレンジ`;
            }
            progressBar.style.width = `${(revealed / TOTAL) * 100}%`;
            progressText.classList.toggle("is-complete", done);
            stage.classList.toggle("is-complete", done);
            progressText.textContent = queuedReplayHoldTimer && queuedRevealCount > 0 && !celebrationActive
                ? "次の参加をまもなく反映します"
                : warmLayer.classList.contains("is-revealed")
                ? "みんなの関心が、新宿への応援として重なりました"
                : done
                ? "新宿で続く取り組みが見えてきました"
                : `あと${remaining}スワイプで彩が戻ってくる`;
        }

        function updateTransitionCountdown() {
            if (!celebrationActive || !transitionCountdown) {
                if (transitionCountdown) transitionCountdown.textContent = "";
                return;
            }

            const elapsed = Date.now() - celebrationStartedAt;
            const remainingMs = CLEAN_SCENE_MS - elapsed;
            const remainingSeconds = Math.max(0, Math.ceil(remainingMs / 1000));
            const nextChallenge = activeChallengeNumber + 1;

            transitionCountdown.textContent = `第${nextChallenge}回チャレンジへ あと${remainingSeconds}秒`;
        }

        function startCountdownTimer() {
            if (countdownTimer) clearInterval(countdownTimer);
            updateTransitionCountdown();
            countdownTimer = setInterval(updateTransitionCountdown, 250);
        }

        function clearCelebrationTimers() {
            if (celebrationTimer) clearTimeout(celebrationTimer);
            if (warmTimer) clearTimeout(warmTimer);
            if (countdownTimer) clearInterval(countdownTimer);
            celebrationTimer = null;
            warmTimer = null;
            countdownTimer = null;
            if (transitionCountdown) transitionCountdown.textContent = "";
        }

        function setSceneFocus(active) {
            document.body.classList.toggle("is-scene-focus", active);
        }

        function clearQueuedReplayTimer() {
            if (queuedReplayTimer) window.clearInterval(queuedReplayTimer);
            if (queuedReplayHoldTimer) window.clearTimeout(queuedReplayHoldTimer);
            queuedReplayTimer = null;
            queuedReplayHoldTimer = null;
        }

        function replayQueuedReveals() {
            if (queuedRevealCount <= 0 || queuedReplayTimer || queuedReplayHoldTimer) {
                return;
            }

            queuedReplayTimer = window.setInterval(() => {
                if (celebrationActive) {
                    return;
                }

                if (queuedRevealCount <= 0) {
                    clearQueuedReplayTimer();
                    return;
                }

                queuedRevealCount -= 1;
                triggerSplat({ force: true });
            }, QUEUED_REPLAY_INTERVAL_MS);
        }

        function holdThenReplayQueuedReveals() {
            if (queuedRevealCount <= 0 || queuedReplayHoldTimer || queuedReplayTimer) {
                return;
            }

            if (progressText) {
                progressText.textContent = "次の参加をまもなく反映します";
            }
            if (transitionCountdown) {
                transitionCountdown.textContent = "荒廃した新宿に戻してから反映中";
            }
            queuedReplayHoldTimer = window.setTimeout(() => {
                queuedReplayHoldTimer = null;
                if (transitionCountdown) transitionCountdown.textContent = "";
                replayQueuedReveals();
            }, QUEUED_REPLAY_HOLD_MS);
        }

        function finishCelebration() {
            clearCelebrationTimers();
            celebrationActive = false;
            setSceneFocus(false);
            celebrationStartedAt = 0;
            activeChallengeNumber = 0;
            warmLayer.classList.remove("is-revealed");
            finalLayer.classList.remove("is-revealed");
            // 達成演出中に参加が重なっても、次の回は荒廃状態から始める。
            rebuildReveal(0);
            updateHud();
            holdThenReplayQueuedReveals();
        }

        function startCelebration() {
            clearCelebrationTimers();
            // キュー再生中に達成した場合も、次の回は必ず荒廃状態を数秒見せてから再開する。
            clearQueuedReplayTimer();
            celebrationActive = true;
            setSceneFocus(true);
            celebrationStartedAt = Date.now();
            activeChallengeNumber = Math.max(1, Math.floor((count - revealed) / TOTAL) + 1);
            finalLayer.classList.add("is-revealed");
            splat(finalLayer);
            updateHud();
            startCountdownTimer();

            celebrationTimer = setTimeout(finishCelebration, CLEAN_SCENE_MS);
        }

        function skipScene() {
            if (!celebrationActive) {
                return;
            }

            finishCelebration();
        }

        const thanks = document.getElementById("thanks");
        const supporterCommentWall = document.getElementById("supporterCommentWall");
        const supporterCommentText = document.getElementById("supporterCommentText");
        const supporterCommentName = document.getElementById("supporterCommentName");

        if (LIVE_BROADCAST_MODE) {
            if (liveLabel) liveLabel.textContent = "累計参加者";
            if (liveUnit) liveUnit.textContent = "";
            if (ctaTitle) ctaTitle.textContent = "スマホで参加";
            if (qrCaption) qrCaption.textContent = "応援アクションを送る";
            if (hint) hint.textContent = "LIVE配信中：スマホの応援アクションで画面が変化します";
        }

        // 参加ページが名前未入力時に自動採番する「サポーター#XXXX」等は本名扱いしない
        const AUTO_NAME_RE = /^サポーター#/;
        const PLACEHOLDER_NAMES = new Set(["匿名サポーター", "匿名", "Guest", "参加者"]);
        function isRealName(raw) {
            return raw.length > 0 && !AUTO_NAME_RE.test(raw) && !PLACEHOLDER_NAMES.has(raw);
        }

        const donorNameRotation = [];
        const STREAK_CLASS_NAMES = ["streak-2", "streak-3", "streak-4", "streak-5", "streak-6", "streak-7"];
        const NAME_NOTIFICATION_MS = 3400;
        const PARTICIPATION_STACK_VISIBLE_MS = 7000;
        const PARTICIPATION_STACK_MAX_VISIBLE = 6;
        const PARTICIPATION_STACK_ARRIVAL_MS = 380;
        let latestDonorEntry = null;
        const nameNotificationQueue = [];
        let nameNotificationTimer = null;
        const participationStackQueue = [];
        let participationStackTimer = null;
        const SUPPORTER_COMMENT_ROTATION_MS = 6500;
        const supporterCommentRotation = [];
        let supporterCommentIndex = 0;
        let supporterCommentTimer = null;

        function getStreakClass(options = {}) {
            // 色は「連続日数」ではなく「通算参加日数」で決める。連続でなくても日数が増えれば色が進む。
            // 旧イベント（totalDays 未保持）は streakDays で補完する。
            const totalDays = Math.max(1, Number(options.totalDays) || Number(options.streakDays) || 1);
            if (totalDays < 2) return "";
            return `streak-${Math.min(7, totalDays)}`;
        }

        function hasStreakColor(options = {}) {
            return getStreakClass(options) !== "";
        }

        function applyStreakClass(element, options = {}) {
            element.classList.remove(...STREAK_CLASS_NAMES);
            const streakClass = getStreakClass(options);
            if (streakClass) element.classList.add(streakClass);
        }

        function addToDonorNameRotation(name, options = {}) {
            const entry = {
                name,
                visitorId: typeof options.visitorId === "string" ? options.visitorId : "",
                isReturning: options.isReturning === true,
                streakDays: Math.max(1, Number(options.streakDays) || 1),
                totalDays: Math.max(1, Number(options.totalDays) || Number(options.streakDays) || 1),
                createdAt: Number(options.createdAt) || 0,
            };
            const dedupeKey = entry.visitorId ? `visitor:${entry.visitorId}` : `name:${entry.name}`;
            const existingIndex = donorNameRotation.findIndex((current) => {
                const currentKey = current.visitorId ? `visitor:${current.visitorId}` : `name:${current.name}`;
                return currentKey === dedupeKey;
            });
            if (existingIndex >= 0) {
                donorNameRotation.splice(existingIndex, 1);
            }
            donorNameRotation.push(entry);
            donorNameRotation.sort((a, b) =>
                b.totalDays - a.totalDays ||
                b.createdAt - a.createdAt
            );
            return entry;
        }

        function appendTickerItems(group, entries, priorityEntry = null) {
            entries.forEach((entry) => {
                const name = document.createElement("span");
                name.className = "ticker-name";
                name.classList.toggle("is-returning", entry.isReturning && hasStreakColor(entry));
                name.classList.toggle("is-latest", entry === priorityEntry);
                applyStreakClass(name, entry);
                name.textContent = `${entry.name}さん`;
                group.appendChild(name);

                const separator = document.createElement("span");
                separator.className = "ticker-separator";
                separator.textContent = "◆";
                group.appendChild(separator);
            });
        }

        function renderDonorTicker(priorityEntry = null) {
            if (!thanks || donorNameRotation.length === 0) {
                thanks?.replaceChildren();
                return;
            }

            const orderedEntries = priorityEntry
                ? [priorityEntry, ...donorNameRotation.filter((entry) => entry !== priorityEntry)]
                : donorNameRotation;
            const entries = [];
            while (entries.length < Math.max(12, orderedEntries.length)) {
                entries.push(...orderedEntries);
            }
            const track = document.createElement("span");
            track.className = "thanks-track";
            track.style.setProperty("--ticker-duration", `${Math.max(24, entries.length * 2.1)}s`);

            for (let i = 0; i < 2; i += 1) {
                const group = document.createElement("span");
                group.className = "thanks-group";
                appendTickerItems(group, entries, priorityEntry);
                track.appendChild(group);
            }
            thanks.replaceChildren(track);
        }

        function resumeDonorTicker() {
            if (donorNameRotation.length === 0) return;
            renderDonorTicker();
        }

        function processNameNotificationQueue() {
            if (nameNotificationTimer || nameNotificationQueue.length === 0) return;
            const next = nameNotificationQueue.shift();
            latestDonorEntry = next;
            renderDonorTicker(latestDonorEntry);
            nameNotificationTimer = window.setTimeout(() => {
                nameNotificationTimer = null;
                latestDonorEntry = null;
                renderDonorTicker();
                processNameNotificationQueue();
            }, NAME_NOTIFICATION_MS);
        }

        function showThanks(name, options = {}) {
            if (LIVE_BROADCAST_MODE) {
                showParticipationThanks("", options);
                return;
            }
            const raw = String(name ?? "").trim().slice(0, 24);
            if (!isRealName(raw)) return;
            const entry = addToDonorNameRotation(raw, options);
            nameNotificationQueue.push(entry);
            if (nameNotificationQueue.length > 120) {
                nameNotificationQueue.splice(0, nameNotificationQueue.length - 120);
            }
            renderDonorTicker(latestDonorEntry);
            showParticipationThanks(raw, entry);
            processNameNotificationQueue();
        }

        function setDonorNameRotation(names) {
            donorNameRotation.length = 0;
            latestDonorEntry = null;
            window.clearTimeout(nameNotificationTimer);
            nameNotificationTimer = null;
            nameNotificationQueue.length = 0;
            if (LIVE_BROADCAST_MODE) {
                thanks?.replaceChildren();
                return;
            }
            names.forEach((entry) => {
                const raw = String(entry?.name ?? entry ?? "").trim().slice(0, 24);
                if (isRealName(raw)) addToDonorNameRotation(raw, entry);
            });
            renderDonorTicker();
        }

        function removeParticipationThanksItem(item) {
            if (!item?.isConnected || item.classList.contains("is-leaving")) return;
            item.classList.add("is-leaving");
            window.setTimeout(() => item.remove(), 480);
        }

        function renderParticipationThanks(name, options = {}) {
            if (!participationThanks) return;
            const raw = String(name ?? "").trim().slice(0, 24);
            const liveBroadcastText = "応援アクションが届きました";
            const isReturning = options.isReturning === true;
            const shouldColorReturning = isReturning && hasStreakColor(options);
            const item = document.createElement("div");
            item.className = "participation-thanks-item";
            item.classList.toggle("is-returning", shouldColorReturning);
            applyStreakClass(item, options);
            applyStreakClass(stage, options);
            item.textContent = LIVE_BROADCAST_MODE
                ? liveBroadcastText
                : isReturning
                ? `${isRealName(raw) ? `おかえりなさい、${raw}さん` : "おかえりなさい"}`
                : isRealName(raw)
                    ? `${raw}さん、ご参加ありがとうございます`
                    : "ご参加ありがとうございます";
            participationThanks.appendChild(item);
            const visibleItems = [...participationThanks.children]
                .filter((child) => !child.classList.contains("is-leaving"));
            if (visibleItems.length > PARTICIPATION_STACK_MAX_VISIBLE) {
                removeParticipationThanksItem(visibleItems[0]);
            }
            stage.classList.remove("is-returning-pulse");
            if (shouldColorReturning) {
                void stage.offsetWidth;
                stage.classList.add("is-returning-pulse");
                window.setTimeout(() => stage.classList.remove("is-returning-pulse"), 2700);
            }
            window.setTimeout(() => removeParticipationThanksItem(item), PARTICIPATION_STACK_VISIBLE_MS);
        }

        function processParticipationStackQueue() {
            if (participationStackTimer || participationStackQueue.length === 0) return;
            const next = participationStackQueue.shift();
            renderParticipationThanks(next.name, next.options);
            participationStackTimer = window.setTimeout(() => {
                participationStackTimer = null;
                processParticipationStackQueue();
            }, PARTICIPATION_STACK_ARRIVAL_MS);
        }

        function showParticipationThanks(name, options = {}) {
            participationStackQueue.push({ name, options });
            if (participationStackQueue.length > 120) {
                participationStackQueue.splice(0, participationStackQueue.length - 120);
            }
            processParticipationStackQueue();
        }

        function normalizeSupporterCommentForDisplay(entry = {}) {
            const comment = String(entry?.comment ?? "").trim().slice(0, 60);
            const name = String(entry?.name ?? "").trim().slice(0, 24);
            if (!comment) {
                return null;
            }
            return {
                comment,
                name: isRealName(name) ? name : "",
                createdAt: Number(entry?.createdAt) || 0,
                id: String(entry?.id ?? entry?.codeHash ?? comment),
            };
        }

        function renderSupporterComment() {
            if (!supporterCommentWall || !supporterCommentText || supporterCommentRotation.length === 0) {
                if (supporterCommentWall) supporterCommentWall.hidden = true;
                return;
            }

            const entry = supporterCommentRotation[supporterCommentIndex % supporterCommentRotation.length];
            supporterCommentText.textContent = entry.comment;
            supporterCommentName.textContent = entry.name ? `${entry.name}さんより` : "";
            supporterCommentWall.hidden = false;
            supporterCommentWall.classList.remove("is-switching");
            void supporterCommentWall.offsetWidth;
            supporterCommentWall.classList.add("is-switching");
        }

        function startSupporterCommentTicker() {
            if (supporterCommentTimer) {
                window.clearInterval(supporterCommentTimer);
                supporterCommentTimer = null;
            }
            if (supporterCommentRotation.length === 0) {
                if (supporterCommentWall) supporterCommentWall.hidden = true;
                return;
            }
            supporterCommentIndex = Math.min(supporterCommentIndex, supporterCommentRotation.length - 1);
            renderSupporterComment();
            if (supporterCommentRotation.length > 1) {
                supporterCommentTimer = window.setInterval(() => {
                    supporterCommentIndex = (supporterCommentIndex + 1) % supporterCommentRotation.length;
                    renderSupporterComment();
                }, SUPPORTER_COMMENT_ROTATION_MS);
            }
        }

        function setSupporterComments(comments = []) {
            supporterCommentRotation.length = 0;
            if (LIVE_BROADCAST_MODE) {
                supporterCommentIndex = 0;
                if (supporterCommentWall) supporterCommentWall.hidden = true;
                return;
            }
            const normalized = comments
                .map(normalizeSupporterCommentForDisplay)
                .filter(Boolean)
                .sort((a, b) => b.createdAt - a.createdAt || b.id.localeCompare(a.id));
            supporterCommentRotation.push(...normalized);
            supporterCommentIndex = 0;
            startSupporterCommentTicker();
        }

        // カウントを軽く弾ませてライブ感を出す
        function pulseCount() {
            countNum.animate(
                [
                    { transform: "scale(1)" },
                    { transform: "scale(1.16)", offset: 0.3 },
                    { transform: "scale(1)" },
                ],
                { duration: 650, easing: "cubic-bezier(0.18, 1.2, 0.32, 1)" }
            );
        }

        // 飛沫を1つ飛ばす（人数カウントとは独立）
        function triggerSplat(options = {}) {
            if (!options.force && celebrationActive) {
                queuedRevealCount += 1;
                splat(finalLayer);
                return;
            }
            if (!options.force && queuedReplayHoldTimer) {
                queuedRevealCount += 1;
                return;
            }

            if (revealed < TOTAL) {
                // 次の飛沫を飛び散らせて新しい範囲を出す
                const el = layers[revealed];
                el.classList.add("is-revealed");
                splat(el);
                revealed += 1;
                if (revealed >= TOTAL) {
                    // 9人ごとに、きれいな新宿 → 温かな新宿 → 次のチャレンジへ進む
                    startCelebration();
                }
                updateHud(); // 進捗バー/テキストを飛沫ごとに更新（ライブ連動の連続表示にも対応）
            } else {
                // 全点灯後も参加するたびに既存の飛沫を弾けさせて反応させる
                splat(layers[Math.floor(Math.random() * TOTAL)]);
            }
        }

        // 手動トリガー（オフラインデモ用）。Firebase連動中は無効。
        function addParticipant() {
            if (liveActive && !MANUAL_MODE) return;
            count += 1;
            triggerSplat();
            updateHud();
            pulseCount();
            showParticipationThanks();
            if (hint && count === 1) hint.style.opacity = "0";
        }

        function completeCurrentChallenge() {
            if (celebrationActive) {
                return;
            }

            const remaining = Math.max(1, TOTAL - revealed);
            count += remaining;
            for (let i = 0; i < remaining; i += 1) {
                triggerSplat();
            }
            updateHud();
            pulseCount();
        }

        // 飛沫の出方を target 枚に合わせる（実カウントのリセット/巻き戻し対応）
        function rebuildReveal(target) {
            revealed = Math.max(0, Math.min(TOTAL, target));
            layers.forEach((el, i) => {
                el.getAnimations().forEach((a) => a.cancel());
                el.classList.toggle("is-revealed", i < revealed);
            });
            finalLayer.getAnimations().forEach((a) => a.cancel());
            finalLayer.classList.toggle("is-revealed", revealed >= TOTAL || celebrationActive);
        }

        // Firebaseの実カウントを反映：増えた分だけ飛沫を飛ばす
        function applyLiveCount(next) {
            const n = Math.max(0, Number(next) || 0);
            const delta = n - count;
            // DEVモードでは手動操作中の表示を、低い/同値のライブ値で巻き戻さない
            if (MANUAL_MODE && delta <= 0) return;

            // 初回同期は過去の参加を再演せず、累計人数から現在の回と進捗を直接復元する。
            if (!liveCountInitialized) {
                liveCountInitialized = true;
                count = n;
                visualizedLiveCount = n;
                clearCelebrationTimers();
                celebrationActive = false;
                setSceneFocus(false);
                celebrationStartedAt = 0;
                activeChallengeNumber = 0;
                warmLayer.classList.remove("is-revealed");
                finalLayer.classList.remove("is-revealed");
                rebuildReveal(n % TOTAL);
                updateHud();
                return;
            }

            count = n;

            if (delta > 0) {
                pulseCount();
                if (!liveVisualTimer) {
                    liveVisualTimer = window.setInterval(() => {
                        if (visualizedLiveCount >= count) {
                            window.clearInterval(liveVisualTimer);
                            liveVisualTimer = null;
                            if (hint && !DEV) hint.textContent = "● LIVE — 参加証投影中";
                            return;
                        }
                        visualizedLiveCount += 1;
                        triggerSplat();
                        if (hint && !DEV) {
                            const pending = Math.max(0, count - visualizedLiveCount);
                            hint.textContent = pending > 0
                                ? `● LIVE — あと${pending}人の参加を順番に反映中`
                                : "● LIVE — 参加証投影中";
                        }
                    }, LIVE_REVEAL_INTERVAL_MS);
                }
            } else if (delta < 0) {
                if (liveVisualTimer) window.clearInterval(liveVisualTimer);
                liveVisualTimer = null;
                visualizedLiveCount = n;
                queuedRevealCount = 0;
                clearQueuedReplayTimer();
                clearCelebrationTimers();
                celebrationActive = false;
                setSceneFocus(false);
                celebrationStartedAt = 0;
                activeChallengeNumber = 0;
                warmLayer.classList.remove("is-revealed");
                rebuildReveal(n % TOTAL); // サーバ側でカウントがリセットされた場合
            }

            updateHud();
        }

        // 連動開始：手動ツールを隠して実カウント主導に切り替え
        function activateLive() {
            if (liveActive) return;
            liveActive = true;
            if (!DEV && autoTimer) {
                clearInterval(autoTimer);
                autoTimer = null;
            }
            if (!DEV) document.querySelector(".tools")?.style.setProperty("display", "none");
            if (hint) {
                hint.textContent = DEV
                    ? "● LIVE（DEV：手動 / 📡本番+1 で確認）"
                    : "● LIVE — 参加証投影中";
                hint.style.opacity = "1";
            }
        }

        function reset() {
            count = 0;
            revealed = 0;
            clearCelebrationTimers();
            celebrationActive = false;
            setSceneFocus(false);
            celebrationStartedAt = 0;
            activeChallengeNumber = 0;
            liveCountInitialized = false;
            visualizedLiveCount = 0;
            queuedRevealCount = 0;
            if (liveVisualTimer) window.clearInterval(liveVisualTimer);
            liveVisualTimer = null;
            clearQueuedReplayTimer();
            layers.forEach((el) => {
                el.getAnimations().forEach((a) => a.cancel());
                el.classList.remove("is-revealed");
            });
            finalLayer.getAnimations().forEach((a) => a.cancel());
            finalLayer.classList.remove("is-revealed");
            warmLayer.classList.remove("is-revealed");
            if (hint) hint.style.opacity = "1";
            updateHud();
        }

        function toggleAuto() {
            if (autoTimer) {
                clearInterval(autoTimer);
                autoTimer = null;
                autoBtn.classList.remove("is-on");
                autoBtn.textContent = "▶ 自動";
                return;
            }
            autoBtn.classList.add("is-on");
            autoBtn.textContent = "⏸ 停止";
            addParticipant();
            autoTimer = setInterval(addParticipant, 1400);
        }

        // 操作：ステージのどこでも参加 +1
        stage.addEventListener("click", addParticipant);

        addBtn.addEventListener("click", (e) => { e.stopPropagation(); addParticipant(); });
        completeBtn.addEventListener("click", (e) => { e.stopPropagation(); completeCurrentChallenge(); });
        skipSceneBtn.addEventListener("click", (e) => { e.stopPropagation(); skipScene(); });
        newParticipantTestBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            const testNames = ["さくら", "タクヤ", "ミナ", "新宿サポーター"];
            showThanks(testNames[donorNameTestIndex % testNames.length], { isReturning: false, streakDays: 1, totalDays: 1 });
            donorNameTestIndex += 1;
        });
        let returningParticipantTestDay = 2;
        returningParticipantTestBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            showThanks("さくら", {
                isReturning: true,
                // 連続ではなく通算日数で色が進むことを確認するため streak はリセット相当にする。
                isConsecutiveReturn: false,
                streakDays: 1,
                totalDays: returningParticipantTestDay,
            });
            returningParticipantTestDay = returningParticipantTestDay >= 7
                ? 2
                : returningParticipantTestDay + 1;
        });
        function simulateCrowd(size = 50) {
            const safeSize = Math.max(1, Math.min(100, Math.floor(Number(size) || 50)));
            if (!liveCountInitialized) {
                applyLiveCount(count);
            }
            applyLiveCount(count + safeSize);
            for (let index = 1; index <= safeSize; index += 1) {
                showThanks(`テスト${String(index).padStart(2, "0")}`, {
                    isReturning: index % 5 === 0,
                    streakDays: index % 5 === 0 ? 2 : 1,
                    totalDays: index % 5 === 0 ? 2 : 1,
                    createdAt: Date.now() + index,
                });
            }
        }
        crowdTestBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            simulateCrowd(50);
        });
        autoBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleAuto(); });
        resetBtn.addEventListener("click", (e) => { e.stopPropagation(); reset(); });

        document.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "Enter" || e.code === "ArrowRight") {
                e.preventDefault();
                addParticipant();
            } else if (e.code === "KeyA") {
                toggleAuto();
            } else if (e.code === "KeyR") {
                reset();
            }
        });

        updateHud();

        // Firebase連動スクリプト（module）から呼べるように公開
        window.__inkDemo = { activateLive, applyLiveCount, showThanks, showParticipationThanks, setDonorNameRotation, resumeDonorTicker, setSupporterComments, simulateCrowd, skipScene, completeCurrentChallenge };
    </script>

    <script type="module">
        // 実際のスマホ参加（Firebase）に連動：index.html と同じチャンネルを購読
        import { getRecentNameAnnouncements, subscribeToParticipantCount, subscribeToNameAnnouncements, subscribeToSwipeCompletes, subscribeToSupporterComments, publishSwipeComplete } from "./src/firebase-bridge.js?v=20260620-supporter-comment-1";
        import { isInappropriateName } from "./src/name-filter.js";
        import { getChannelForTheme, resolveTheme } from "./src/theme-router.js";

        const theme = resolveTheme({ defaultTheme: "day" });
        const searchParams = new URLSearchParams(location.search);
        const channel = searchParams.get("channel") === "research" && searchParams.get("team-test") === "1"
            ? "research"
            : getChannelForTheme(theme, "default");
        const isDevMode = searchParams.has("dev");
        const isDemoMode = searchParams.has("demo");
        const isLiveBroadcastMode = searchParams.has("live") || searchParams.has("youtube") || searchParams.has("broadcast");

        // ?dev のときだけ「本番+1」ボタンを出す：QRと同じFirebaseイベントを1件送って連動確認できる
        if (isDevMode) {
            const tools = document.querySelector(".tools");
            const liveBtn = document.createElement("button");
            liveBtn.type = "button";
            liveBtn.textContent = "📡 本番+1";
            liveBtn.title = "実際のQR参加と同じFirebaseイベントをDEV用に1件送る";
            liveBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                publishSwipeComplete({ channel, source: "dev-demo", donationAmountYen: 100 })
                    .catch((error) => console.warn("[demo] dev swipe failed:", error));
            });
            tools?.appendChild(liveBtn);
        }

        if (!isDemoMode) {
            subscribeToParticipantCount((liveCount) => {
                // 最初のスナップショットが届いた＝Firebase接続済み → 連動モードへ
                // カウント＋インクはスワイプ時に即反応
                window.__inkDemo?.activateLive();
                window.__inkDemo?.applyLiveCount(liveCount);
            }, { channel }).catch((error) => {
                console.info("[demo] live sync disabled (offline/manual):", error);
            });

        }

        if (!isLiveBroadcastMode) {
            getRecentNameAnnouncements({ channel, all: true })
                .then((events) => {
                    const validEvents = events
                        .map((event) => ({ ...event, name: String(event?.name ?? "").trim() }))
                        .filter((event) => event.name && !isInappropriateName(event.name));
                    window.__inkDemo?.setDonorNameRotation(validEvents);
                })
                .catch((error) => {
                    console.info("[demo] donor history disabled (offline/manual):", error);
                });

            // 新しい寄付者名は巡回表示より優先し、以後の巡回リストにも追加する。
            subscribeToNameAnnouncements((event) => {
                if (!isInappropriateName(String(event?.name ?? ""))) {
                    window.__inkDemo?.showThanks(event?.name, event);
                }
            }, { channel }).catch((error) => {
                console.info("[demo] name feed disabled (offline/manual):", error);
            });

            subscribeToSupporterComments((comments) => {
                const validComments = comments.filter((event) =>
                    !isInappropriateName(String(event?.comment ?? "")) &&
                    !isInappropriateName(String(event?.name ?? ""))
                );
                window.__inkDemo?.setSupporterComments(validComments);
            }, { channel }).catch((error) => {
                console.info("[demo] supporter comment feed disabled (offline/manual):", error);
            });
        }

        if (!isDemoMode) {
            subscribeToSwipeCompletes((event) => {
                window.__inkDemo?.showParticipationThanks(event?.name, event);
            }, { channel }).catch((error) => {
                console.info("[demo] returning participant feed disabled (offline/manual):", error);
            });
        }
    </script>

    <script type="module">
        // 時間で参加ページのQRを切替：偶数時=男性 / 奇数時=女性
        const MEN_URL = "https://dooh-ca9c2.web.app/men";
        const WOMEN_URL = "https://dooh-ca9c2.web.app/women";
        const qrSearchParams = new URLSearchParams(location.search);
        const QR_YOUTUBE_MODE = qrSearchParams.has("youtube") || qrSearchParams.has("live") || qrSearchParams.has("broadcast");
        const qrCode = document.getElementById("qrCode");
        const urlNote = document.getElementById("urlNote");

        const { default: QRCode } = await import("https://cdn.skypack.dev/qrcode@1.5.3");

        function pickParticipantUrl(now = new Date()) {
            const baseUrl = now.getHours() % 2 === 0 ? MEN_URL : WOMEN_URL;
            if (!QR_YOUTUBE_MODE) {
                return baseUrl;
            }
            const url = new URL(baseUrl);
            url.searchParams.set("mode", "youtube");
            return url.toString();
        }

        async function renderQr() {
            const url = pickParticipantUrl();
            if (urlNote) urlNote.textContent = url;
            try {
                const canvas = await QRCode.toCanvas(url, {
                    width: 240,
                    margin: 1,
                    errorCorrectionLevel: "M",
                    color: { dark: "#151919", light: "#ffffff" },
                });
                qrCode?.replaceChildren(canvas);
            } catch (error) {
                console.warn("QR generation failed:", error);
            }
        }

        function scheduleNextHourly() {
            const now = new Date();
            const next = new Date(now);
            next.setHours(now.getHours() + 1, 0, 0, 50);
            const delay = next.getTime() - now.getTime();
            setTimeout(async () => {
                await renderQr();
                scheduleNextHourly();
            }, delay);
        }

        await renderQr();
        scheduleNextHourly();
    </script>
