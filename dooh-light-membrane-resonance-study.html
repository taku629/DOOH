<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Light Membrane — Resonance Study</title>
  <style>
    html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#f8f8f5}
    iframe{display:block}
  </style>
</head>
<body>
  <iframe id="study" src="dooh-light-membrane-minimal-contrast-study.html" title="Light Membrane Resonance Study"></iframe>
  <script>
    const frame = document.querySelector("#study");
    const applyResonance = () => {
      const doc = frame.contentDocument;
      if (!doc || doc.readyState !== "complete" || doc.querySelector("#resonance-override")) return;
      const message = doc.querySelector("#message");
      const sub = doc.querySelector("#sub");
      const guide = doc.querySelector("#guide");
      const guideSub = doc.querySelector("#guideSub");
      const area = doc.querySelector("#interaction");
      const phone = doc.querySelector("#phone");
      if (!message || !sub || !guide || !guideSub || !area || !phone) return;

      const style = doc.createElement("style");
      style.id = "resonance-override";
      style.textContent = `
        .copy .color-word {
          display:inline;
          margin:0;
          font-size:inherit;
          line-height:inherit;
          color:#b4495e;
          background:none;
          font-weight:700;
          text-shadow:0 0 5px rgba(var(--gold),.28);
          filter:none;
        }
        .copy strong {
          font-size:18px;
          font-weight:600;
          line-height:1.55;
          letter-spacing:.08em;
        }
        .copy span {
          margin-top:7px;
          color:#454b47;
          font-size:12px;
          font-weight:500;
          line-height:1.55;
          letter-spacing:.06em;
        }
        .phone.ready .copy strong { font-size:18px; }
        .phone.ready .copy span { font-size:12px; }
        .name strong { font-size:20px; }
        .intro-card span { font-size:9px; line-height:1.65; }
      `;
      doc.head.appendChild(style);

      message.innerHTML = `あなたの<span class="color-word">彩り</span>を、街へ。`;
      sub.textContent = "下へ引くほど、彩りが街へひろがります";
      guide.textContent = "光の膜を下へ引く";

      const setCopy = (html,secondary) => {
        if (message.innerHTML !== html) message.innerHTML = html;
        if (sub.textContent !== secondary) sub.textContent = secondary;
      };
      const syncCopy = () => {
        const c = Number.parseFloat(frame.contentWindow.getComputedStyle(phone).getPropertyValue("--c")) || 0;
        if (phone.classList.contains("arrived")) {
          setCopy(`あなたの<span class="color-word">彩り</span>が、街の光になりました`,"");
        } else if (phone.classList.contains("launching")) {
          setCopy(`あなたの<span class="color-word">彩り</span>が、街へ`,"送信しています");
        } else if (phone.classList.contains("ready")) {
          setCopy(`指を離して、<span class="color-word">彩り</span>を届ける`,"準備ができました");
        } else if (c > .08) {
          setCopy(`あなたの<span class="color-word">彩り</span>が、街と重なっていく`,`重なり ${Math.round(c*100)}%`);
        } else {
          setCopy(`あなたの<span class="color-word">彩り</span>を、街へ。`,"下へ引くほど、彩りが街へひろがります");
        }
      };
      const syncFrame = () => {
        syncCopy();
        window.requestAnimationFrame(syncFrame);
      };
      syncFrame();

      guideSub.textContent = "";
    };
    frame.addEventListener("load", applyResonance);
    if (frame.contentDocument?.readyState === "complete") applyResonance();
  </script>
</body>
</html>
