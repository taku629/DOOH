<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Light Membrane — Veil Study</title>
  <style>
    html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#f8f8f5}
    iframe{display:block}
  </style>
</head>
<body>
  <iframe id="study" src="dooh-light-membrane-resonance-study.html" title="Light Membrane Veil Study"></iframe>
  <script>
    const study = document.querySelector("#study");
    const installVeil = () => {
      const resonanceDoc = study.contentDocument;
      const innerFrame = resonanceDoc?.querySelector("iframe");
      const doc = innerFrame?.contentDocument;
      if (!doc?.querySelector("#message") || doc.querySelector("#copy-veil-override")) return;

      const style = doc.createElement("style");
      style.id = "copy-veil-override";
      style.textContent = `
        .copy {
          isolation:isolate;
          padding:22px 30px;
          transform:translateY(-22px);
        }
        .copy::before {
          position:absolute;
          z-index:-1;
          top:50%;
          left:50%;
          width:310px;
          height:112px;
          content:"";
          border-radius:50%;
          background:radial-gradient(
            ellipse,
            rgba(255,255,252,.97) 0%,
            rgba(255,255,252,.82) 42%,
            rgba(255,255,252,.38) 64%,
            transparent 78%
          );
          backdrop-filter:blur(8px);
          -webkit-backdrop-filter:blur(8px);
          transform:translate(-50%,-50%);
          transition:opacity .2s,filter .2s,transform .2s;
          pointer-events:none;
        }
        .copy strong {
          color:#17231f;
          text-shadow:0 1px 10px rgba(255,255,255,.98);
        }
        .copy span {
          color:rgba(23,35,31,.78);
          text-shadow:0 1px 8px rgba(255,255,255,1);
        }
        .copy .color-word {
          color:#a93f58;
          text-shadow:0 0 calc(3px + var(--c)*9px) rgba(var(--gold),.48);
        }
        .phone.ready .copy::before {
          filter:brightness(1.04);
          transform:translate(-50%,-50%) scale(1.06);
        }
        .phone.launching .copy::before {
          opacity:.94;
          filter:brightness(1.08);
        }
        .phone.arrived .copy::before {
          width:350px;
          opacity:.9;
        }
      `;
      doc.head.appendChild(style);
    };
    study.addEventListener("load", installVeil);
    window.setInterval(installVeil,120);
  </script>
</body>
</html>
