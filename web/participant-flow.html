<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shinjuku Color Project | 参加フロー</title>
  <link rel="stylesheet" href="./participant-flow.css" />
</head>
<body>
  <main class="app" id="app">
    <header class="progress" aria-label="進行状況">
      <span id="progressText" aria-live="polite">1/5 はじめに</span>
      <div class="bar" role="progressbar" aria-valuemin="1" aria-valuenow="1" aria-describedby="progressText">
        <div id="progressBar"></div>
      </div>
    </header>

    <section class="step is-active" data-step="0" data-label="はじめに" aria-labelledby="welcomeTitle">
      <h1 id="welcomeTitle">あなたの1スワイプで、新宿に色が戻る。</h1>
      <p>所要10秒・無料で参加できます。</p>
      <button class="primary" type="button" data-next>参加する（無料）</button>
      <small>個人情報の登録は不要。表示名は任意です。</small>
    </section>

    <section class="step" data-step="1" data-label="スワイプ" aria-labelledby="swipeTitle">
      <h2 id="swipeTitle">スワイプして灯りをともす</h2>
      <p>下のスライダーを右に動かし、完了ボタンで参加を確定してください。</p>
      <div class="slider-wrap">
        <input id="swipeSlider" type="range" min="0" max="100" step="5" value="0" aria-label="参加スワイプ" aria-describedby="swipeHint" />
      </div>
      <p class="hint" id="swipeHint">100%まで到達すると完了ボタンを押せます。</p>
      <button id="swipeComplete" class="primary" type="button" disabled aria-disabled="true">完了して次へ</button>
    </section>

    <section class="step" data-step="2" data-label="参加完了" aria-labelledby="thanksTitle" aria-live="polite">
      <h2 id="thanksTitle">参加ありがとうございます！</h2>
      <p>あなたの参加で <strong>+1</strong></p>
      <p>現在の参加者数: <strong id="counterValue">12,842</strong> 人</p>
      <button class="primary" type="button" data-next>参加証を受け取る</button>
    </section>

    <section class="step" data-step="3" data-label="参加証作成" aria-labelledby="certificateTitle">
      <h2 id="certificateTitle">あなたの参加証を作成</h2>
      <label for="nickname">表示名（任意）</label>
      <input id="nickname" type="text" maxlength="20" placeholder="匿名サポーター" autocomplete="nickname" />
      <article class="card" id="certificatePreview" aria-live="polite">
        <p>SHINJUKU COLOR SUPPORTER</p>
        <h3 id="previewName">匿名サポーター</h3>
      </article>
      <div class="actions">
        <button class="primary" type="button" id="createCard">この名前で作成する</button>
        <button class="ghost" type="button" id="skipName">入力しないで作成</button>
      </div>
    </section>

    <section class="step" data-step="4" data-label="シェア" aria-labelledby="shareTitle">
      <h2 id="shareTitle">参加証ができました！</h2>
      <article class="card done" id="finalCard" aria-live="polite"></article>
      <div class="actions stacked">
        <button class="primary" type="button" id="downloadBtn">画像を保存</button>
        <button class="ghost" type="button" id="shareBtn">リンクをコピー</button>
      </div>
      <p id="shareStatus" aria-live="polite"></p>
    </section>
  </main>

  <script type="module" src="./participant-flow.js"></script>
</body>
</html>
